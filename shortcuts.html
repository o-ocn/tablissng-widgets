<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shortcuts</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  background: transparent;

  font-family:
    Inter,
    "Segoe UI",
    "Microsoft YaHei",
    sans-serif;

  color: #fff;
}

body {
  user-select: none;
}


/* ==================================================
   整体
   ================================================== */

.app {
  width: 100%;
  height: 100%;

  display: grid;

  grid-template-columns:
    104px 1fr;

  gap: 18px;

  padding:
    10px 12px;

  overflow: hidden;
}


/* ==================================================
   左侧分类
   ================================================== */

.sidebar {
  height: 100%;

  padding:
    8px 5px;

  display: flex;
  flex-direction: column;

  justify-content: center;

  gap: 2px;

  border-radius: 22px;

  background:
    rgba(
      20,
      24,
      32,
      0.10
    );

  border:
    1px solid
    rgba(
      255,
      255,
      255,
      0.08
    );

  box-shadow:
    inset 0 1px 0
    rgba(
      255,
      255,
      255,
      0.03
    );
}


.nav-item {
  width: 100%;
  height: 22px;

  appearance: none;

  border: 0;
  outline: 0;

  padding:
    0 9px;

  border-radius: 10px;

  background:
    transparent;

  color:
    rgba(
      255,
      255,
      255,
      0.48
    );

  font-family: inherit;

  font-size: 11px;

  cursor: pointer;

  display: flex;

  align-items: center;

  gap: 8px;

  transition:
    background 0.18s ease,
    color 0.18s ease,
    transform 0.18s ease;
}


.nav-item:hover {
  color:
    rgba(
      255,
      255,
      255,
      0.82
    );

  background:
    rgba(
      255,
      255,
      255,
      0.055
    );
}


.nav-item.active {
  color:
    rgba(
      255,
      255,
      255,
      0.96
    );

  background:
    rgba(
      255,
      255,
      255,
      0.09
    );
}


.nav-dot {
  width: 5px;
  height: 5px;

  border-radius: 50%;

  flex: 0 0 auto;

  background:
    rgba(
      255,
      255,
      255,
      0.18
    );

  transition:
    background 0.18s ease,
    box-shadow 0.18s ease,
    transform 0.18s ease;
}


.nav-item.active
.nav-dot {
  background:
    rgba(
      255,
      255,
      255,
      0.95
    );

  box-shadow:
    0 0 8px
    rgba(
      255,
      255,
      255,
      0.38
    );

  transform:
    scale(1.15);
}


/* ==================================================
   快捷方式区域
   ================================================== */

.content {
  min-width: 0;

  height: 100%;

  display: flex;

  align-items: center;

  justify-content: center;

  overflow: hidden;
}


.grid {
  width: 100%;

  display: grid;

  grid-template-columns:
    repeat(4, minmax(0, 1fr));

  grid-auto-rows:
    88px;

  gap:
    8px 9px;

  align-content: center;
}


.grid.animate-next {
  animation:
    enterNext
    0.25s
    cubic-bezier(.2,.75,.3,1);
}


.grid.animate-prev {
  animation:
    enterPrev
    0.25s
    cubic-bezier(.2,.75,.3,1);
}


@keyframes enterNext {

  from {
    opacity: 0;
    transform:
      translateY(12px);
  }

  to {
    opacity: 1;
    transform:
      translateY(0);
  }

}


@keyframes enterPrev {

  from {
    opacity: 0;
    transform:
      translateY(-12px);
  }

  to {
    opacity: 1;
    transform:
      translateY(0);
  }

}


/* ==================================================
   单个快捷图标
   ================================================== */

.shortcut {
  min-width: 0;

  text-decoration: none;

  color: inherit;

  border-radius: 18px;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  gap: 7px;

  padding:
    7px 6px 6px;

  background:
    rgba(
      255,
      255,
      255,
      0
    );

  border:
    1px solid
    rgba(
      255,
      255,
      255,
      0
    );

  cursor: pointer;

  transition:
    background 0.18s ease,
    border-color 0.18s ease,
    transform 0.18s ease,
    box-shadow 0.18s ease;
}


.shortcut:hover {
  background:
    rgba(
      255,
      255,
      255,
      0.085
    );

  border-color:
    rgba(
      255,
      255,
      255,
      0.10
    );

  box-shadow:
    0 7px 20px
    rgba(
      0,
      0,
      0,
      0.10
    );

  transform:
    translateY(-2px);
}


.icon-shell {
  width: 48px;
  height: 48px;

  border-radius: 15px;

  display: flex;

  align-items: center;
  justify-content: center;

  position: relative;

  overflow: hidden;

  background:
    rgba(
      255,
      255,
      255,
      0.13
    );

  border:
    1px solid
    rgba(
      255,
      255,
      255,
      0.12
    );

  box-shadow:
    0 5px 16px
    rgba(
      0,
      0,
      0,
      0.10
    ),
    inset 0 1px 0
    rgba(
      255,
      255,
      255,
      0.05
    );

  transition:
    transform 0.18s ease;
}


.shortcut:hover
.icon-shell {
  transform:
    scale(1.045);
}


.icon-shell img {
  width: 40px;
  height: 40px;

  object-fit: contain;

  display: block;
}


.fallback {
  position: absolute;

  inset: 0;

  display: none;

  align-items: center;
  justify-content: center;

  color:
    rgba(
      255,
      255,
      255,
      0.93
    );

  font-size: 20px;
  font-weight: 650;

  background:
    rgba(
      255,
      255,
      255,
      0.10
    );
}


.shortcut-label {
  width: 100%;

  padding:
    0 3px;

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;

  text-align: center;

  font-size: 11px;

  font-weight: 500;

  color:
    rgba(
      255,
      255,
      255,
      0.90
    );

  text-shadow:
    0 1px 3px
    rgba(
      0,
      0,
      0,
      0.50
    );
}


/* ==================================================
   下方极淡提示
   ================================================== */

.hint {
  position: absolute;

  left: 50%;
  bottom: 2px;

  transform:
    translateX(-50%);

  color:
    rgba(
      255,
      255,
      255,
      0.25
    );

  font-size: 8px;

  pointer-events: none;

  opacity: 0;

  transition:
    opacity 0.2s ease;
}


body:hover
.hint {
  opacity: 1;
}


/* ==================================================
   小屏适配
   ================================================== */

@media (max-width: 540px) {

  .app {
    grid-template-columns:
      90px 1fr;

    gap: 10px;

    padding:
      8px;
  }

  .grid {
    grid-template-columns:
      repeat(4, minmax(0, 1fr));

    grid-auto-rows:
      80px;

    gap: 5px;
  }

  .icon-shell {
    width: 43px;
    height: 43px;

    border-radius: 14px;
  }

  .icon-shell img {
    width: 35px;
    height: 35px;
  }

  .shortcut-label {
    font-size: 10px;
  }

}

</style>
</head>

/* ==================================================
   DOM
   ================================================== */

const sidebar =
  document.getElementById(
    "sidebar"
  );

const grid =
  document.getElementById(
    "grid"
  );


/* ==================================================
   当前分组
   ================================================== */

let current =
  Number(
    localStorage.getItem(
      STORAGE_KEY
    )
  );


if (
  !Number.isInteger(current)
  ||
  current < 0
  ||
  current >= groups.length
) {

  current = 0;

}


/* ==================================================
   建立左侧菜单
   ================================================== */

function buildSidebar() {

  sidebar.innerHTML =
    "";


  groups.forEach(
    (group, index) => {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "nav-item";


      if (
        index === current
      ) {

        button.classList.add(
          "active"
        );

      }


      button.innerHTML = `
        <span class="nav-dot"></span>
        <span>${group.label}</span>
      `;


      button.addEventListener(
        "click",
        () => {

          const direction =
            index > current
              ? 1
              : -1;


          switchGroup(
            index,
            direction
          );

        }
      );


      sidebar.appendChild(
        button
      );

    }
  );

}


/* ==================================================
   单个快捷方式
   ================================================== */

function shortcutHtml(
  key
) {

  const site =
    sites[key];


  if (!site) {
    return "";
  }


  const icon =
    iconUrl(
      site.icon
    );


  const first =
    site.label
      ?.trim()
      ?.charAt(0)
      ||
      "?";


  return `

    <a
      class="shortcut"

      href="${site.url}"

      target="_blank"

      rel="noopener noreferrer"

      title="${site.label}"
    >

      <div
        class="icon-shell"
      >

        <img
          src="${icon}"
          alt=""
          loading="lazy"

          onerror="
            this.style.display='none';
            this.nextElementSibling.style.display='flex';
          "
        >

        <span
          class="fallback"
        >
          ${first}
        </span>

      </div>


      <div
        class="shortcut-label"
      >
        ${site.label}
      </div>

    </a>

  `;

}


/* ==================================================
   渲染当前组
   ================================================== */

function renderGroup(
  direction = 1
) {

  const group =
    groups[current];


  grid.classList.remove(
    "animate-next",
    "animate-prev"
  );


  grid.innerHTML =
    group.items
      .map(shortcutHtml)
      .join("");


  void grid.offsetWidth;


  grid.classList.add(
    direction >= 0
      ? "animate-next"
      : "animate-prev"
  );


  buildSidebar();


  localStorage.setItem(
    STORAGE_KEY,
    String(current)
  );

}


/* ==================================================
   切换分组
   ================================================== */

function switchGroup(
  index,
  direction = 1
) {

  if (
    index < 0
  ) {

    index =
      groups.length - 1;

  }


  if (
    index >=
    groups.length
  ) {

    index = 0;

  }


  if (
    index === current
  ) {

    return;

  }


  current = index;


  renderGroup(
    direction
  );

}


/* ==================================================
   鼠标滚轮切换
   带阈值 + 防抖
   ================================================== */

let wheelSum = 0;

let wheelLocked =
  false;


document.addEventListener(

  "wheel",

  event => {

    event.preventDefault();


    if (
      wheelLocked
    ) {

      return;

    }


    wheelSum +=
      event.deltaY;


    if (
      Math.abs(
        wheelSum
      ) < 38
    ) {

      return;

    }


    const direction =
      wheelSum > 0
        ? 1
        : -1;


    wheelSum = 0;


    wheelLocked =
      true;


    switchGroup(
      current + direction,
      direction
    );


    setTimeout(
      () => {

        wheelLocked =
          false;

      },

      380
    );

  },

  {
    passive: false
  }

);


/* ==================================================
   键盘也可以切换
   ================================================== */

document.addEventListener(

  "keydown",

  event => {

    if (
      event.key ===
      "ArrowDown"
    ) {

      switchGroup(
        current + 1,
        1
      );

    }


    if (
      event.key ===
      "ArrowUp"
    ) {

      switchGroup(
        current - 1,
        -1
      );

    }

  }

);


/* ==================================================

renderGroup(1);
