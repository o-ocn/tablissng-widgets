  );

}


function undoDeletedShortcut() {

  const pending =
    pendingDeletedShortcut;


  if (!pending) {
    return;
  }


  pendingDeletedShortcut =
    null;


  /*
     5 秒内撤销：把刚记录的
     墓碑一并移除，就像从未删除过。
  */

  dropTrashEntry(
    pending.entry.key
  );


  customSites.splice(
    Math.min(
      pending.index,
      customSites.length
    ),
    0,
    pending.entry
  );


  if (pending.hadIconOverride) {

    iconOverrides[
      pending.entry.key
    ] = pending.iconOverride;

  }


  saveCustomSites();
  saveIconOverrides();


  applyCustomSitesToRuntime(
    customSites
  );


  touchGroupOrder(
    pending.entry.groupId,
    true
  );


  markSyncDirty();


  refreshShortcutGroups();


  showToast(
    "已恢复快捷方式"
  );

}


function deleteCustomShortcut(key) {

  const index =
    customSites.findIndex(
      entry =>
        entry.key === key
    );


  if (index < 0) {

    showToast(
      "没有找到要删除的快捷方式"
    );


    return;

  }


  const entry = {
    ...customSites[index]
  };


  const sourceGroup =
    groups.find(
      group =>
        group.items.includes(
          key
        )
    );


  const indexInGroup =
    sourceGroup
      ? sourceGroup.items.indexOf(
          key
        )
      : 0;


  const hadIconOverride =
    Object.prototype
      .hasOwnProperty.call(
        iconOverrides,
        key
      );


  const iconOverride =
    iconOverrides[key];


  customSites.splice(
    index,
    1
  );


  if (hadIconOverride) {

    delete iconOverrides[key];

  }


  if (
    !saveCustomSites()
    ||
    !saveIconOverrides()
  ) {

    customSites.splice(
      index,
      0,
      entry
    );


    if (hadIconOverride) {

      iconOverrides[key] =
        iconOverride;

    }


    saveCustomSites();
    saveIconOverrides();


    showToast(
      "删除失败：本地存储空间不足"
    );


    return;

  }


  clearStoredIcon(
    key
  );


  applyCustomSitesToRuntime(
    customSites
  );


  touchGroupOrder(
    entry.groupId,
    true
  );


  /*
     删除立即写入墓碑（回收站）。
     5 秒内撤销会把它一并移除；
     超时后墓碑随下次同步上传，
     其他设备就不会把该网站
     重新同步回来。
  */

  recordDeletedSite(
    entry,
    indexInGroup
  );


  refreshShortcutGroups();


  pendingDeletedShortcut = {

    entry,
    index,
    hadIconOverride,
    iconOverride

  };


  markSyncDirty(
    5400
  );


  showActionToast({

    message:
      `已删除「${entry.label}」`,

    actionLabel:
      "撤销",

    onAction:
      undoDeletedShortcut,

    duration:
      5000,

    onExpire: () => {

      pendingDeletedShortcut =
        null;

    }

  });

}


function applyIconOverride(
  key,
  value
) {

  const previous =
    iconOverrides[key];


  iconOverrides[key] =
    value;


  clearStoredIcon(
    key
  );


  if (!saveIconOverrides()) {

    if (previous) {

      iconOverrides[key] =
        previous;

    }

    else {

      delete iconOverrides[key];

    }


    showToast(
      "保存失败：本地存储空间不足"
    );


    return false;

  }


  /*
     图标也是网站内容的一部分：
     更新对应站点的更新时间，
     合并时才能按时间判定
     哪台设备的图标更新。
  */

  const entry =
    touchSiteEntry(
      key
    );


  if (entry) {

    saveCustomSites();

  }


  markSyncDirty();


  refreshShortcutGroups();


  return true;

}


function resetIconOverride(key) {

  if (!iconOverrides[key]) {

    showToast(
      "当前已经是自动图标"
    );


    return;

  }


  delete iconOverrides[key];


  clearStoredIcon(
    key
  );


  saveIconOverrides();


  const entry =
    touchSiteEntry(
      key
    );


  if (entry) {

    saveCustomSites();

  }


  markSyncDirty();


  refreshShortcutGroups();


  showToast(
    "已恢复自动图标"
  );

}


function readLocalIcon(file) {

  return new Promise(
    (resolve, reject) => {

      if (
        !file.type.startsWith(
          "image/"
        )
      ) {

        reject(
          new Error(
            "请选择图片文件"
          )
        );


        return;

      }


      if (
        file.size >
        5 * 1024 * 1024
      ) {

        reject(
          new Error(
            "图片不能超过 5 MB"
          )
        );


        return;

      }


      const reader =
        new FileReader();


      reader.onerror =
        () => {

          reject(
            new Error(
              "读取图片失败"
            )
          );

        };


      reader.onload =
        () => {

          const image =
            new Image();


          image.onerror =
            () => {

              reject(
                new Error(
                  "无法识别这张图片"
                )
              );

            };


          image.onload =
            () => {

              const maxSide =
                256;


              const scale =
                Math.min(
                  1,
                  maxSide
                  /
                  Math.max(
                    image.naturalWidth,
                    image.naturalHeight
                  )
                );


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                Math.max(
                  1,
                  Math.round(
                    image.naturalWidth
                    *
                    scale
                  )
                );


              canvas.height =
                Math.max(
                  1,
                  Math.round(
                    image.naturalHeight
                    *
                    scale
                  )
                );


              const context =
                canvas.getContext(
                  "2d"
                );


              context.drawImage(
                image,
                0,
                0,
                canvas.width,
                canvas.height
              );


              resolve(
                canvas.toDataURL(
                  "image/webp",
                  0.90
                )
              );

            };


          image.src =
            reader.result;

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}


function verifyRemoteIcon(url) {

  return new Promise(
    (resolve, reject) => {

      const image =
        new Image();


      const timer =
        setTimeout(
          () => {

            image.src =
              "";


            reject(
              new Error(
                "图标加载超时，请检查图片直链"
              )
            );

          },
          8000
        );


      image.onload =
        () => {

          clearTimeout(
            timer
          );


          resolve(url);

        };


      image.onerror =
        () => {

          clearTimeout(
            timer
          );


          reject(
            new Error(
              "这个链接没有返回可用图片"
            )
          );

        };


      image.referrerPolicy =
        "no-referrer";


      image.src =
        url;

    }
  );

}


/* ========================================
   文件夹管理与子项检索
   ======================================== */

function getFolderChildren(folderKey) {
  const fromGroup = customSites.filter(s => s.groupId === folderKey);
  if (fromGroup.length > 0) return fromGroup;

  const folder = customSites.find(s => s.key === folderKey);
  if (folder && folder.url && folder.url.includes("items=")) {
    try {
      const u = new URL(folder.url);
      const itemsStr = u.searchParams.get("items") || "";
      const keys = itemsStr.split(",").filter(Boolean);
      return keys.map(k => customSites.find(s => s.key === k) || sites[k]).filter(Boolean);
    } catch {}
  }
  return [];
}

function createFolderElement(key, site) {
  const link = document.createElement("div");
  link.className = "shortcut shortcut-folder";
  link.dataset.siteKey = key;
  link.title = site.label;

  if (dragReorderSupported) {
    link.draggable = true;
    link.addEventListener("dragstart", event => {
      dragShortcutKey = key;
      dragSourceGroupId = link.closest(".group-grid")?.dataset.group || "";
      if (event.dataTransfer) {
        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/plain", key);
      }
      link.classList.add("dragging");
    });
    link.addEventListener("dragend", () => {
      dragJustEnded = true;
      link.classList.remove("dragging");
      clearDropIndicator();
      clearFolderDropTarget();
      dragShortcutKey = "";
      dragSourceGroupId = "";
      setTimeout(() => {
        dragJustEnded = false;
      }, 0);
    });
  }

  const shell = document.createElement("div");
  shell.className = "icon-shell folder-icon-shell";

  const children = getFolderChildren(key);
  const previewChildren = children.slice(0, 4);

  previewChildren.forEach(child => {
    const mini = document.createElement("div");
    mini.className = "folder-mini-icon";
    const storedIcon = getStoredIcon(child.key, child);
    if (storedIcon) {
      const img = document.createElement("img");
      img.src = storedIcon;
      img.alt = "";
      mini.appendChild(img);
    } else {
      const fallback = document.createElement("span");
      fallback.textContent = (child.label || "").trim().charAt(0) || "·";
      mini.appendChild(fallback);
      resolveIcon(child.key, child).then(icon => {
        if (icon) {
          mini.innerHTML = "";
          const img = document.createElement("img");
          img.src = icon;
          img.alt = "";
          mini.appendChild(img);
        }
      });
    }
    shell.appendChild(mini);
  });

  const label = document.createElement("div");
  label.className = "shortcut-label";
  label.textContent = site.label;

  link.appendChild(shell);
  link.appendChild(label);

  link.addEventListener("click", event => {
    if (dragJustEnded) {
      event.preventDefault();
      event.stopPropagation();
      return;
    }
    openFolderModal(key);
  });

  link.addEventListener("contextmenu", event => {
    event.preventDefault();
    event.stopPropagation();
    selectedShortcutKey = key;
    updateShortcutMenu(key);
    openContextMenu(shortcutMenu, event.clientX, event.clientY);
  });

  return link;
}

function createFolderFromShortcuts(targetKey, draggedKey) {
  const currentGroup = groups.find(g => g.id === currentId);
  if (!currentGroup) return;

  const siteTarget = customSites.find(s => s.key === targetKey);
  const siteDragged = customSites.find(s => s.key === draggedKey);
  if (!siteTarget || !siteDragged) return;

  const folderId = `folder_${Date.now()}`;
  const now = new Date().toISOString();

  siteTarget.groupId = folderId;
  siteTarget.updatedAt = now;
  siteDragged.groupId = folderId;
  siteDragged.updatedAt = now;

  const folderSite = {
    key: folderId,
    label: "新建文件夹",
    url: `https://folder.local/?items=${encodeURIComponent(targetKey + "," + draggedKey)}`,
    groupId: currentId,
    icon: "",
    updatedAt: now
  };

  customSites.push(folderSite);

  const newItems = [];
  for (const k of currentGroup.items) {
    if (k === targetKey) {
      newItems.push(folderId);
    } else if (k !== draggedKey) {
      newItems.push(k);
    }
  }
  currentGroup.items = newItems;

  saveCustomSites(customSites);
  touchGroupOrder(currentId, true);
  touchGroupOrder(folderId, true);
  markSyncDirty();
  rebuildGroupGrid(currentId);
  showToast("已合并为文件夹");
}

function addShortcutToFolder(folderKey, draggedKey) {
  const currentGroup = groups.find(g => g.id === currentId);
  if (!currentGroup) return;

  const folder = customSites.find(s => s.key === folderKey);
  const siteDragged = customSites.find(s => s.key === draggedKey);
  if (!folder || !siteDragged) return;

  const now = new Date().toISOString();
  siteDragged.groupId = folderKey;
  siteDragged.updatedAt = now;

  const children = getFolderChildren(folderKey);
  const childKeys = [...new Set([...children.map(c => c.key), draggedKey])];
  folder.url = `https://folder.local/?items=${encodeURIComponent(childKeys.join(","))}`;
  folder.updatedAt = now;

  currentGroup.items = currentGroup.items.filter(k => k !== draggedKey);

  saveCustomSites(customSites);
  touchGroupOrder(currentId, true);
  touchGroupOrder(folderKey, true);
  markSyncDirty();
  rebuildGroupGrid(currentId);
  showToast(`已放入文件夹「${folder.label}」`);
}

function removeShortcutFromFolder(folderKey, childKey) {
  const currentGroup = groups.find(g => g.id === currentId);
  const child = customSites.find(s => s.key === childKey);
  const folder = customSites.find(s => s.key === folderKey);
  if (!child) return;

  const now = new Date().toISOString();
  child.groupId = currentId;
  child.updatedAt = now;

  if (currentGroup && !currentGroup.items.includes(childKey)) {
    currentGroup.items.push(childKey);
  }

  const remaining = getFolderChildren(folderKey).filter(c => c.key !== childKey);
  if (remaining.length === 0) {
    dissolveFolder(folderKey);
    return;
  }

  if (folder) {
    folder.url = `https://folder.local/?items=${encodeURIComponent(remaining.map(r => r.key).join(","))}`;
    folder.updatedAt = now;
  }

  saveCustomSites(customSites);
  touchGroupOrder(currentId, true);
  touchGroupOrder(folderKey, true);
  markSyncDirty();
  rebuildGroupGrid(currentId);
  openFolderModal(folderKey);
  showToast(`已将「${child.label}」移出文件夹`);
}

function dissolveFolder(folderKey) {
  const currentGroup = groups.find(g => g.id === currentId);
  const folder = customSites.find(s => s.key === folderKey);
  const children = getFolderChildren(folderKey);
  const now = new Date().toISOString();

  children.forEach(c => {
    c.groupId = currentId;
    c.updatedAt = now;
  });

  if (currentGroup) {
    const idx = currentGroup.items.indexOf(folderKey);
    const childKeys = children.map(c => c.key);
    if (idx >= 0) {
      currentGroup.items.splice(idx, 1, ...childKeys);
    } else {
      currentGroup.items.push(...childKeys);
    }
  }

  const folderIndex = customSites.findIndex(s => s.key === folderKey);
  if (folderIndex >= 0) {
    customSites.splice(folderIndex, 1);
  }

  if (folderModal) folderModal.hidden = true;
  currentOpenFolderKey = null;

  saveCustomSites(customSites);
  touchGroupOrder(currentId, true);
  markSyncDirty();
  rebuildGroupGrid(currentId);
  showToast(`已解散文件夹「${folder?.label || ""}」`);
}

function renameFolder(folderKey, newLabel) {
  const folder = customSites.find(s => s.key === folderKey);
  const trimmed = (newLabel || "").trim();
  if (!folder || !trimmed) return;
  folder.label = trimmed;
  folder.updatedAt = new Date().toISOString();
  saveCustomSites(customSites);
  markSyncDirty();
  rebuildGroupGrid(currentId);
}

let currentOpenFolderKey = null;

function openFolderModal(folderKey) {
  const folder = customSites.find(s => s.key === folderKey);
  if (!folder) return;

  currentOpenFolderKey = folderKey;

  if (folderTitleInput) folderTitleInput.value = folder.label;
  if (folderModalBody) {
    folderModalBody.innerHTML = "";
    const children = getFolderChildren(folderKey);
    children.forEach(child => {
      const wrapper = document.createElement("div");
      wrapper.className = "folder-item-wrapper";

      const sc = createShortcut(child.key);
      if (sc) {
        wrapper.appendChild(sc);
      }

      const removeBtn = document.createElement("button");
      removeBtn.type = "button";
      removeBtn.className = "folder-item-remove-btn";
      removeBtn.title = "移出文件夹";
      removeBtn.textContent = "✕";
      removeBtn.addEventListener("click", e => {
        e.stopPropagation();
        removeShortcutFromFolder(folderKey, child.key);
      });

      wrapper.appendChild(removeBtn);
      folderModalBody.appendChild(wrapper);
    });
  }

  if (folderModal) openModal(folderModal, folderTitleInput);
}

/* ========================================
   创建快捷方式
   ======================================== */

function createShortcut(key) {
  const site =
    customSites.find(s => s.key === key) ||
    sites[key];

  if (!site) {
    return null;
  }

  if (isFolderSite(site)) {
    return createFolderElement(key, site);
  }

  const link = document.createElement("a");
  link.className = "shortcut";
  link.href = site.url;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.title = site.label;
  link.dataset.siteKey = key;

  link.addEventListener("contextmenu", event => {
    event.preventDefault();
    event.stopPropagation();
    selectedShortcutKey = key;
    updateShortcutMenu(key);
    openContextMenu(shortcutMenu, event.clientX, event.clientY);
  });

  if (dragReorderSupported) {
    link.draggable = true;
    link.addEventListener("dragstart", event => {
      dragShortcutKey = key;
      dragSourceGroupId = link.closest(".group-grid")?.dataset.group || "";
      if (event.dataTransfer) {
        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/plain", key);
      }
      link.classList.add("dragging");
    });

    link.addEventListener("dragend", () => {
      dragJustEnded = true;
      link.classList.remove("dragging");
      clearDropIndicator();
      clearFolderDropTarget();
      dragShortcutKey = "";
      dragSourceGroupId = "";
      setTimeout(() => {
        dragJustEnded = false;
      }, 0);
    });
  }

  const shell = document.createElement("div");
  shell.className = "icon-shell";

  const img = document.createElement("img");
  img.alt = "";

  const fallback = document.createElement("span");
  fallback.className = "fallback";
  fallback.textContent = (site.label || "").trim().charAt(0);

  function showIcon(icon) {
    img.src = icon;
    img.style.display = "block";
    fallback.style.display = "none";
  }

  function showFallback() {
    img.src = DEFAULT_FALLBACK_ICON;
    img.style.display = "block";
    fallback.style.display = "none";
  }

  const storedIcon = getStoredIcon(key, site);
  if (storedIcon) {
    showIcon(storedIcon);
  } else {
    showFallback();
  }

  let retriedAfterError = false;
  img.addEventListener("error", () => {
    if (img.src.includes("default-fallback.png") || retriedAfterError) {
      img.style.display = "none";
      fallback.style.display = "flex";
      return;
    }
    retriedAfterError = true;
    showFallback();
    clearStoredIcon(key);
    resolveIcon(key, site, true).then(icon => {
      if (icon) {
        showIcon(icon);
      }
    });
  });

  shell.appendChild(img);
  shell.appendChild(fallback);

  const label = document.createElement("div");
  label.className = "shortcut-label";
  label.textContent = site.label;

  link.appendChild(shell);
  link.appendChild(label);

  resolveIcon(key, site).then(icon => {
    if (icon) {
      showIcon(icon);
    } else {
      showFallback();
    }
  });

  return link;
}

/* ========================================
   分组左右分页与网格构建
   ======================================== */

const ITEMS_PER_PAGE = 12;
const groupPageMap = new Map();

function getGroupCurrentPage(groupId) {
  return groupPageMap.get(groupId) || 0;
}

function getGroupTotalPages(groupId) {
  const group = groups.find(g => g.id === groupId);
  if (!group || !Array.isArray(group.items)) return 1;
  return Math.max(1, Math.ceil(group.items.length / ITEMS_PER_PAGE));
}

function setGroupPage(groupId, pageIndex) {
  const totalPages = getGroupTotalPages(groupId);
  const validPage = Math.max(0, Math.min(pageIndex, totalPages - 1));
  groupPageMap.set(groupId, validPage);

  const grid = groupElements.get(groupId);
  if (grid) {
    const track = grid.querySelector(".group-slider-track");
    if (track) {
      track.style.transform = `translateX(-${validPage * 100}%)`;
    }
  }

  updatePaginationUI(groupId);
}

function updatePaginationUI(groupId) {
  if (groupId !== currentId) return;

  const totalPages = getGroupTotalPages(groupId);
  const currentPage = getGroupCurrentPage(groupId);
  const pageDotsEl = document.getElementById("pageDots");
  const pageArrowPrev = document.getElementById("pageArrowPrev");
  const pageArrowNext = document.getElementById("pageArrowNext");

  if (!pageDotsEl) return;

  if (totalPages <= 1) {
    pageDotsEl.style.display = "none";
    pageDotsEl.innerHTML = "";
    if (pageArrowPrev) pageArrowPrev.classList.remove("visible");
    if (pageArrowNext) pageArrowNext.classList.remove("visible");
    return;
  }

  pageDotsEl.style.display = "flex";
  pageDotsEl.innerHTML = "";

  if (currentPage === 0 && pageArrowPrev) pageArrowPrev.classList.remove("visible");
  if (currentPage >= totalPages - 1 && pageArrowNext) pageArrowNext.classList.remove("visible");

  for (let i = 0; i < totalPages; i++) {
    const dot = document.createElement("span");
    dot.className = `page-dot ${i === currentPage ? "active" : ""}`;
    dot.title = `第 ${i + 1} 页`;
    dot.addEventListener("click", () => setGroupPage(groupId, i));
    pageDotsEl.appendChild(dot);
  }
}

function buildAllGroups() {
  content.querySelectorAll(".group-grid").forEach(el => el.remove());

  groups.forEach(group => {
    const grid = document.createElement("div");
    grid.className = "group-grid";
    grid.dataset.group = group.id;

    const track = document.createElement("div");
    track.className = "group-slider-track";

    const totalPages = Math.max(1, Math.ceil(group.items.length / ITEMS_PER_PAGE));
    const currentPage = Math.min(getGroupCurrentPage(group.id), totalPages - 1);
    track.style.transform = `translateX(-${currentPage * 100}%)`;

    for (let p = 0; p < totalPages; p++) {
      const pageDiv = document.createElement("div");
      pageDiv.className = "group-page";
      pageDiv.dataset.page = p;

      const pageItems = group.items.slice(p * ITEMS_PER_PAGE, (p + 1) * ITEMS_PER_PAGE);
      pageItems.forEach(key => {
        const shortcut = createShortcut(key);
        if (shortcut) {
          pageDiv.appendChild(shortcut);
        }
      });
      track.appendChild(pageDiv);
    }

    grid.appendChild(track);
    content.appendChild(grid);
    groupElements.set(group.id, grid);
  });

  updatePaginationUI(currentId);
}

function rebuildGroupGrid(groupId) {
  const grid = groupElements.get(groupId);
  const group = groups.find(item => item.id === groupId);

  if (!grid || !group) return;

  grid.replaceChildren();

  const track = document.createElement("div");
  track.className = "group-slider-track";

  const totalPages = Math.max(1, Math.ceil(group.items.length / ITEMS_PER_PAGE));
  let currentPage = getGroupCurrentPage(groupId);
  if (currentPage >= totalPages) {
    currentPage = totalPages - 1;
    groupPageMap.set(groupId, currentPage);
  }
  track.style.transform = `translateX(-${currentPage * 100}%)`;

  for (let p = 0; p < totalPages; p++) {
    const pageDiv = document.createElement("div");
    pageDiv.className = "group-page";
    pageDiv.dataset.page = p;

    const pageItems = group.items.slice(p * ITEMS_PER_PAGE, (p + 1) * ITEMS_PER_PAGE);
    pageItems.forEach(key => {
      const shortcut = createShortcut(key);
      if (shortcut) {
        pageDiv.appendChild(shortcut);
      }
    });
    track.appendChild(pageDiv);
  }

  grid.appendChild(track);
  updatePaginationUI(groupId);
}

/* ========================================
   快捷方式拖动排序与文件夹拖拽合并
   ======================================== */

let activeFolderDropTarget = null;

function setFolderDropTarget(target) {
  if (activeFolderDropTarget === target) return;
  clearFolderDropTarget();
  activeFolderDropTarget = target;
  target.classList.add("folder-drop-target");
}

function clearFolderDropTarget() {
  if (activeFolderDropTarget) {
    activeFolderDropTarget.classList.remove("folder-drop-target");
    activeFolderDropTarget = null;
  }
}

function clearDropIndicator() {
  if (dropIndicatorElement) {
    dropIndicatorElement.classList.remove("drop-before", "drop-after");
  }
  dropIndicatorElement = null;
  dropIndicatorSide = "";
}

function setDropIndicator(element, side) {
  if (dropIndicatorElement === element && dropIndicatorSide === side) {
    return;
  }
  clearDropIndicator();
  dropIndicatorElement = element;
  dropIndicatorSide = side;
  element.classList.add(side === "before" ? "drop-before" : "drop-after");
}

if (dragReorderSupported) {
  content.addEventListener("dragover", event => {
    if (!dragShortcutKey) return;

    const grid = event.target.closest(".group-grid");
    if (!grid || grid.dataset.group !== dragSourceGroupId) {
      clearDropIndicator();
      clearFolderDropTarget();
      return;
    }

    const target = event.target.closest(".shortcut");
    if (!target || target.dataset.siteKey === dragShortcutKey) {
      clearDropIndicator();
      clearFolderDropTarget();
      return;
    }

    event.preventDefault();
    event.dataTransfer.dropEffect = "move";

    const targetKey = target.dataset.siteKey;
    const draggedSite = customSites.find(s => s.key === dragShortcutKey) || sites[dragShortcutKey];
    const targetSite = customSites.find(s => s.key === targetKey) || sites[targetKey];

    const rect = target.getBoundingClientRect();
    const relX = event.clientX - rect.left;
    const relY = event.clientY - rect.top;

    const isDraggingFolder = isFolderSite(draggedSite);
    const canMerge = !isDraggingFolder;
    const isCenter = canMerge &&
      (relX > rect.width * 0.22 && relX < rect.width * 0.78) &&
      (relY > rect.height * 0.15 && relY < rect.height * 0.85);

    if (isCenter) {
      clearDropIndicator();
      setFolderDropTarget(target);
    } else {
      clearFolderDropTarget();
      setDropIndicator(target, relX > rect.width / 2 ? "after" : "before");
    }
  });

  content.addEventListener("drop", event => {
    if (!dragShortcutKey) return;

    const grid = event.target.closest(".group-grid");
    if (!grid || grid.dataset.group !== dragSourceGroupId) {
      clearDropIndicator();
      clearFolderDropTarget();
      return;
    }

    event.preventDefault();

    const group = groups.find(item => item.id === dragSourceGroupId);
    const target = event.target.closest(".shortcut");
    const key = dragShortcutKey;

    if (!group || !target || target.dataset.siteKey === key) {
      clearDropIndicator();
      clearFolderDropTarget();
      return;
    }

    const targetKey = target.dataset.siteKey;
    const targetSite = customSites.find(s => s.key === targetKey) || sites[targetKey];

    if (activeFolderDropTarget) {
      if (isFolderSite(targetSite)) {
        addShortcutToFolder(targetKey, key);
      } else {
        createFolderFromShortcuts(targetKey, key);
      }
    } else {
      const items = group.items.filter(item => item !== key);
      const targetIndex = items.indexOf(targetKey);

      if (targetIndex >= 0) {
        const rect = target.getBoundingClientRect();
        const insertAfter = event.clientX > rect.left + rect.width / 2;
        items.splice(insertAfter ? targetIndex + 1 : targetIndex, 0, key);
        group.items = items;

        touchGroupOrder(group.id, true);
        markSyncDirty();
        rebuildGroupGrid(group.id);
      }
    }

    clearDropIndicator();
    clearFolderDropTarget();
  });


  content.addEventListener(
    "dragleave",
    event => {

      const grid =
        event.target.closest(
          ".group-grid"
        );


      if (
        grid
        &&
        (
          !event.relatedTarget
          ||
          !grid.contains(
            event.relatedTarget
          )
        )
      ) {

        clearDropIndicator();

      }

    }
  );


  /*
     拖动结束后的第一次 click
     一律拦截，确保不会误触跳转。
  */

  document.addEventListener(
    "click",
    event => {

      if (!dragJustEnded) {

        return;

      }


      event.preventDefault();
      event.stopPropagation();

    },
    true
  );

}


/* ========================================
   分组拖拽排序与 CRUD 管理
   ======================================== */

let isDraggingGroup = false;
let groupDragTimer = null;
let groupDragStartIndex = -1;
let groupDragCurrentTargetIndex = -1;
let groupDragJustFinished = false;
let selectedGroupIdForMenu = null;
let pendingGroupAction = null;

let sidebarDropIndicator = null;
function getOrCreateDropIndicator() {
  if (!sidebarDropIndicator) {
    sidebarDropIndicator = document.createElement("div");
    sidebarDropIndicator.className = "sidebar-drop-indicator";
    sidebar.appendChild(sidebarDropIndicator);
  }
  return sidebarDropIndicator;
}

function calcGroupDropIndex(clientY) {
  const navItems = Array.from(
    sidebar.querySelectorAll(".nav-item:not(.nav-item-add)")
  );
  if (navItems.length === 0) {
    return 0;
  }

  for (let i = 0; i < navItems.length; i++) {
    const rect = navItems[i].getBoundingClientRect();
    const midY = rect.top + rect.height / 2;
    if (clientY < midY) {
      return i;
    }
  }

  return navItems.length;
}

function updateGroupDropIndicator(slotIdx) {
  const indicator = getOrCreateDropIndicator();
  const navItems = Array.from(
    sidebar.querySelectorAll(".nav-item:not(.nav-item-add)")
  );
  if (navItems.length === 0) {
    indicator.style.display = "none";
    return;
  }

  indicator.style.display = "block";
  if (slotIdx < navItems.length) {
    indicator.style.top = `${Math.max(0, navItems[slotIdx].offsetTop - 1)}px`;
  } else {
    const last = navItems[navItems.length - 1];
    indicator.style.top = `${last.offsetTop + last.offsetHeight + 1}px`;
  }
}

function startGroupDrag(event, groupId, button) {
  isDraggingGroup = true;
  groupDragStartIndex = groups.findIndex(g => g.id === groupId);
  if (groupDragStartIndex < 0) return;

  const group = groups[groupDragStartIndex];
  groupDragCurrentTargetIndex = groupDragStartIndex;

  if (navigator.vibrate) {
    try {
      navigator.vibrate(25);
    } catch {}
  }

  // 1. 创建跟随鼠标的圆角长条胶囊（实感长条）
  const dragAvatar = document.createElement("div");
  dragAvatar.className = "sidebar-drag-avatar";
  dragAvatar.innerHTML = `
    <span class="nav-dot" style="background:#0A84FF;box-shadow:0 0 8px #0A84FF;"></span>
    <span>${group.label}</span>
  `;
  document.body.appendChild(dragAvatar);
  dragAvatar.style.left = `${event.clientX}px`;
  dragAvatar.style.top = `${event.clientY}px`;

  // 2. 原始按钮半透明占位
  button.classList.add("nav-item-dragging");

  const navItems = Array.from(
    sidebar.querySelectorAll(".nav-item:not(.nav-item-add)")
  );
  // 记录未变换时的原始几何位置，避免连续 transform 导致计算抖动
  const itemRects = navItems.map(item => item.getBoundingClientRect());
  navItems.forEach(item => {
    item.style.transition = "transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1)";
  });

  const GAP_SIZE = 30; // 27px 按钮高 + 3px gap

  function applyAccordionDisplacements(slotIdx) {
    navItems.forEach((item, i) => {
      if (i === groupDragStartIndex) return;

      let offset = 0;
      if (slotIdx < groupDragStartIndex) {
        if (i >= slotIdx && i < groupDragStartIndex) {
          offset = GAP_SIZE;
        }
      } else if (slotIdx > groupDragStartIndex) {
        if (i > groupDragStartIndex && i <= slotIdx) {
          offset = -GAP_SIZE;
        }
      }
      item.style.transform = offset ? `translateY(${offset}px)` : "";
    });
  }

  function onDragPointerMove(e) {
    e.preventDefault();

    // 更新悬浮胶囊坐标
    dragAvatar.style.left = `${e.clientX}px`;
    dragAvatar.style.top = `${e.clientY}px`;

    const sidebarRect = sidebar.getBoundingClientRect();
    if (e.clientY < sidebarRect.top + 28) {
      sidebar.scrollTop -= 5;
    } else if (e.clientY > sidebarRect.bottom - 28) {
      sidebar.scrollTop += 5;
    }

    // 根据初始几何中心计算插入槽位
    let slotIdx = itemRects.length - 1;
    for (let i = 0; i < itemRects.length; i++) {
      const midY = itemRects[i].top + itemRects[i].height / 2;
      if (e.clientY < midY) {
        slotIdx = i;
        break;
      }
    }

    groupDragCurrentTargetIndex = slotIdx;
    applyAccordionDisplacements(slotIdx);
  }

  function onDragPointerUp() {
    window.removeEventListener("pointermove", onDragPointerMove);
    window.removeEventListener("pointerup", onDragPointerUp);
    window.removeEventListener("pointercancel", onDragPointerUp);

    // 移除悬浮胶囊
    if (dragAvatar) {
      dragAvatar.remove();
    }

    // 清理平移效果
    navItems.forEach(item => {
      item.style.transform = "";
      item.style.transition = "";
    });

    button.classList.remove("nav-item-dragging");

    isDraggingGroup = false;
    groupDragJustFinished = true;
    setTimeout(() => {
      groupDragJustFinished = false;
    }, 150);

    const targetIdx = groupDragCurrentTargetIndex;
    if (
      groupDragStartIndex >= 0
      &&
      targetIdx >= 0
      &&
      targetIdx !== groupDragStartIndex
      &&
      targetIdx < groups.length
    ) {
      const [movedGroup] = groups.splice(groupDragStartIndex, 1);
      groups.splice(targetIdx, 0, movedGroup);
      saveGroupsConfig();
      touchAllGroupOrders(false);
      buildSidebar();
      updateSidebarScrollControls();
      markSyncDirty();
    }
  }

  window.addEventListener("pointermove", onDragPointerMove, { passive: false });
  window.addEventListener("pointerup", onDragPointerUp, { once: true });
  window.addEventListener("pointercancel", onDragPointerUp, { once: true });
}

function openGroupContextMenu(event, groupId) {
  selectedGroupIdForMenu = groupId;
  hideContextMenus();

  const editBtn = groupMenu.querySelector('[data-action="edit-group"]');
  const deleteBtn = groupMenu.querySelector('[data-action="delete-group"]');
  const sep = groupMenu.querySelector(".context-menu-separator");

  if (groupId) {
    if (editBtn) editBtn.hidden = false;
    if (deleteBtn) {
      deleteBtn.hidden = false;
      deleteBtn.disabled = groups.length <= 1;
      if (groups.length <= 1) {
        deleteBtn.style.opacity = "0.4";
        deleteBtn.style.cursor = "not-allowed";
      } else {
        deleteBtn.style.opacity = "";
        deleteBtn.style.cursor = "";
      }
    }
    if (sep) sep.hidden = false;
  } else {
    if (editBtn) editBtn.hidden = true;
    if (deleteBtn) deleteBtn.hidden = true;
    if (sep) sep.hidden = true;
  }

  openContextMenu(groupMenu, event.clientX, event.clientY);
}

function openGroupModal(mode, groupId = null) {
  hideContextMenus();
  groupFormError.textContent = "";

  if (mode === "add") {
    pendingGroupAction = { mode: "add" };
    groupModalTitle.textContent = "新建分组";
    groupNameInput.value = "";
  } else {
    const group = groups.find(g => g.id === groupId);
    if (!group) return;
    pendingGroupAction = { mode: "edit", id: groupId };
    groupModalTitle.textContent = "编辑分组名称";
    groupNameInput.value = group.label;
  }

  openModal(groupModal, groupNameInput);
}

function deleteGroup(groupId) {
  if (groups.length <= 1) {
    showToast("至少需要保留一个分组");
    return;
  }

  const group = groups.find(g => g.id === groupId);
  if (!group) return;

  const fallbackGroup = groups.find(g => g.id !== groupId) || groups[0];
  const siteCount = group.items ? group.items.length : 0;

  const confirmMsg =
    siteCount > 0
      ? `确认删除分组「${group.label}」？\n\n该分组下的 ${siteCount} 个快捷方式将移至「${fallbackGroup.label}」。`
      : `确认删除分组「${group.label}」？`;

  if (!confirm(confirmMsg)) {
    return;
  }

  if (siteCount > 0) {
    let movedCount = 0;
    const now = new Date().toISOString();
    customSites.forEach(site => {
      if (site.groupId === groupId) {
        site.groupId = fallbackGroup.id;
        site.updatedAt = now;
        movedCount++;
      }
    });

    if (movedCount > 0) {
      saveCustomSites();
      touchGroupOrder(fallbackGroup.id, true);
    }
  }

  groups = groups.filter(g => g.id !== groupId);
  delete groupOrderState[groupId];
  saveGroupsConfig();
  saveGroupOrderState();

  if (currentId === groupId) {
    activateGroup(fallbackGroup.id);
  }

  buildSidebar();
  buildAllGroups();
  showToast(`已删除分组「${group.label}」`);
}


/* ========================================
   左侧菜单构建
   ======================================== */

function buildSidebar() {

  sidebar.innerHTML =
    "";


  groups.forEach(
    group => {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "nav-item";


      button.dataset.group =
        group.id;


      const dot =
        document.createElement(
          "span"
        );
      dot.className =
        "nav-dot";

      const labelSpan =
        document.createElement(
          "span"
        );
      labelSpan.textContent =
        group.label;

      button.append(
        dot,
        labelSpan
      );


      button.addEventListener(
        "click",
        event => {

          if (groupDragJustFinished) {

            event.preventDefault();
            event.stopPropagation();
            return;

          }

          activateGroup(
            group.id
          );

        }
      );


      button.addEventListener(
        "contextmenu",
        event => {

          event.preventDefault();
          event.stopPropagation();
          openGroupContextMenu(
            event,
            group.id
          );

        }
      );


      button.addEventListener(
        "pointerdown",
        event => {

          if (event.button !== 0) return;

          const startX = event.clientX;
          const startY = event.clientY;
          const groupId = group.id;

          clearTimeout(groupDragTimer);
          groupDragTimer = setTimeout(() => {
            startGroupDrag(event, groupId, button);
          }, 230);

          function cancelTimerIfMoved(e) {
            if (Math.hypot(e.clientX - startX, e.clientY - startY) > 6) {
              clearTimeout(groupDragTimer);
              window.removeEventListener("pointermove", cancelTimerIfMoved);
              window.removeEventListener("pointerup", cancelTimerOnUp);
            }
          }

          function cancelTimerOnUp() {
            clearTimeout(groupDragTimer);
            window.removeEventListener("pointermove", cancelTimerIfMoved);
            window.removeEventListener("pointerup", cancelTimerOnUp);
          }

          window.addEventListener("pointermove", cancelTimerIfMoved, { passive: true });
          window.addEventListener("pointerup", cancelTimerOnUp, { once: true });

        }
      );


      sidebar.appendChild(
        button
      );

    }
  );


  const addButton =
    document.createElement(
      "button"
    );
  addButton.type =
    "button";
  addButton.className =
    "nav-item nav-item-add";
  addButton.setAttribute(
    "aria-label",
    "新建分组"
  );
  addButton.title =
    "新建分组";
  addButton.innerHTML = `
    <span class="nav-dot" style="opacity:0.4;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;">+</span>
    <span>新建分组</span>
  `;
  addButton.addEventListener(
    "click",
    () => {

      openGroupModal("add");

    }
  );

  sidebar.appendChild(
    addButton
  );

  updateNav();
  requestAnimationFrame(
    updateSidebarScrollControls
  );

}

    ) {

    }

    event.preventDefault();

groupMenu.addEventListener(

      );

      button.dataset.action;

    ) {

    ) {

      );

groupForm.addEventListener(
  "submit",
  event => {

    event.preventDefault();

    const name =
      groupNameInput.value.trim();

    if (!name) {

      groupFormError.textContent =
        "请输入分组名称";
      return;

    }

    if (name.length > 20) {

      groupFormError.textContent =
        "分组名称不能超过 20 个字符";
      return;

    }


    if (pendingGroupAction.mode === "add") {

      if (
        groups.some(
          g => g.label === name
        )
      ) {

        groupFormError.textContent =
          "已存在同名分组";
        return;

      }

      const newId =
        "g_" + Date.now().toString(36);

      const newGroup = {
        id: newId,
        label: name,
        items: []
      };

      groups.push(newGroup);
      saveGroupsConfig();
      buildSidebar();
      buildAllGroups();
      activateGroup(newId);
      closeModal(groupModal);
      showToast(`已创建分组「${name}」`);

    } else if (
      pendingGroupAction.mode === "edit"
    ) {

      const group =
        groups.find(
          g =>
            g.id ===
            pendingGroupAction.id
        );

      if (!group) return;

      if (
        groups.some(
          g =>
            g.label === name
            &&
            g.id !== group.id
        )
      ) {

        groupFormError.textContent =
          "已存在同名分组";
        return;

      }

      group.label = name;
      saveGroupsConfig();
      buildSidebar();
      closeModal(groupModal);
      showToast(`已重命名分组为「${name}」`);

    }

  }
);


/* ========================================
   获取当前索引
   ======================================== */

function currentIndex() {

  return groups.findIndex(
    group =>
      group.id ===
      currentId
  );

}


/* ========================================
   循环索引
   ======================================== */

function wrapIndex(
  value
) {

  const count =
    groups.length;


  return (
    (
      value % count
    )
    +
    count
  )
  %
  count;

}


/* ========================================
   激活分组

   不重建 DOM，
   只切 active。
   ======================================== */

function activateGroup(
  id,
  direction = 1
) {

  if (
    id === currentId
  ) {

    updateNav();

    const same =
      groupElements.get(id);


    if (same) {

      same.classList.add(
        "active"
      );

    }

    updatePaginationUI(currentId);

    return;

  }


  const old =
    groupElements.get(
      currentId
    );


  const next =
    groupElements.get(
      id
    );


  if (old) {

    old.classList.remove(
      "active",
      "from-top"
    );

  }


  currentId =
    id;


  if (next) {

    next.classList.toggle(
      "from-top",
      direction < 0
    );


    next.classList.add(
      "active"
    );

  }


  updateNav();
  updatePaginationUI(currentId);


  localStorage.setItem(
    GROUP_STORAGE_KEY,
    currentId
  );

}


/* ========================================
   更新左侧状态
   ======================================== */

function updateNav() {

  let activeItem =
    null;


  document
    .querySelectorAll(
      ".nav-item"
    )
    .forEach(
      item => {

        item.classList.toggle(
          "active",
          item.dataset.group
          ===
          currentId
        );


        if (
          item.dataset.group
          ===
          currentId
        ) {

          activeItem =
            item;

        }

      }
    );


  if (activeItem) {

    activeItem.scrollIntoView({

      block: "nearest",
      behavior: "smooth"

    });

  }


  requestAnimationFrame(
    updateSidebarScrollControls
  );

}


/* ========================================
   左侧分组滚动提示
   ======================================== */

function updateSidebarScrollControls() {

  const maxScroll =
    Math.max(
      0,
      sidebar.scrollHeight
      -
      sidebar.clientHeight
    );


  sidebarScrollUp.hidden =
    sidebar.scrollTop <= 1;


  sidebarScrollDown.hidden =
    sidebar.scrollTop >=
    maxScroll - 1;

}


function scrollSidebar(direction) {

  sidebar.scrollTop =
    sidebar.scrollTop
    +
    direction
    *
    90;


  requestAnimationFrame(
    updateSidebarScrollControls
  );

}


sidebarScrollUp.addEventListener(
  "click",
  () => {

    scrollSidebar(-1);

  }
);


sidebarScrollDown.addEventListener(
  "click",
  () => {

    scrollSidebar(1);

  }
);


sidebar.addEventListener(
  "scroll",
  updateSidebarScrollControls,
  {
    passive: true
  }
);


sidebar.addEventListener(
  "wheel",
  event => {

    event.preventDefault();
    event.stopPropagation();


    sidebar.scrollTop +=
      normaliseWheel(
        event
      );


    updateSidebarScrollControls();

  },
  {
    passive: false
  }
);


window.addEventListener(
  "resize",
  updateSidebarScrollControls
);


/* ========================================
   按数量切换分组
   ======================================== */

function moveGroups(
  steps
) {

  if (!steps) {
    return;
  }


  const oldIndex =
    currentIndex();


  const nextIndex =
    wrapIndex(
      oldIndex + steps
    );


  activateGroup(
    groups[nextIndex].id,
    steps
  );

}

shortcutMenu.addEventListener(

      );

      ||
      !selectedShortcutKey
    ) {

      return;

    }


    const key =
      selectedShortcutKey;


    const action =
      button.dataset.action;


    hideContextMenus();


    if (
      action ===
      "open-folder"
    ) {

      openFolderModal(
        key
      );

      return;

    }


    if (
      action ===
      "rename-folder"
    ) {

      openFolderModal(
        key
      );

      setTimeout(() => {
        if (folderTitleInput) {
          folderTitleInput.focus();
          folderTitleInput.select();
        }
      }, 60);

      return;

    }


    if (
      action ===
      "dissolve-folder"
    ) {

      dissolveFolder(
        key
      );

      return;

    }


    if (
      action ===
      "edit-shortcut"
    ) {

      openShortcutEditor(
        key,
        "edit"
      );

    }


    if (
      action ===
      "move-shortcut"
    ) {

      openShortcutEditor(
        key,
        "move"
      );

    }


    if (
      action ===
      "upload-icon"
    ) {

      pendingIconKey =
        key;


      iconFileInput.value =
        "";


      iconFileInput.click();

    }


    if (
      action ===
      "icon-url"
    ) {

      pendingIconKey =
        key;


      iconUrlFormError.textContent =
        "";


      iconUrlInput.value =
        /^https:\/\//i.test(
          iconOverrides[key]
          ||
          ""
        )
        ?
        iconOverrides[key]
        :
        "";


      openModal(
        iconUrlModal,
        iconUrlInput
      );

    }


    if (
      action ===
      "reset-icon"
    ) {

      resetIconOverride(
        key
      );

    }


    if (
      action ===
      "delete-shortcut"
    ) {

      const site = customSites.find(s => s.key === key);
      if (isFolderSite(site)) {
        dissolveFolder(key);
      } else {
        deleteCustomShortcut(key);
      }

    }

  }
);


blankMenu.addEventListener(

editForm.addEventListener(
  "submit",
  event => {

    event.preventDefault();


    editFormError.textContent =
      "";


    try {

      const index =
        customSites.findIndex(
          entry =>
            entry.key ===
            pendingEditKey
        );


      if (index < 0) {

        throw new Error(
          "没有找到要编辑的快捷方式"
        );

      }


      const previous = {
        ...customSites[index]
      };


      const label =
        editShortcutNameInput.value
          .trim();


      if (!label) {

        throw new Error(
          "请填写名称"
        );

      }


      const url =
        normaliseShortcutUrl(
          editShortcutUrlInput.value
        );


      const group =
        groups.find(
          item =>
            item.id ===
            editShortcutGroupInput.value
        );


      if (!group) {

        throw new Error(
          "请选择有效分组"
        );

      }


      customSites[index] = {

        ...previous,
        label,
        url,
        groupId: group.id,
        icon:
          previous.url === url
            ? previous.icon
            : "",
        updatedAt:
          new Date().toISOString()

      };


      if (!saveCustomSites()) {

        customSites[index] =
          previous;


        throw new Error(
          "保存失败：本地存储空间不足"
        );

      }


      clearStoredIcon(
        previous.key
      );


      applyCustomSitesToRuntime(
        customSites
      );


      /*
         移动到其他分组会改变两个分组的
         成员，需要各自记录排序时间；
         仅改名、换链接不触碰排序。
      */

      if (
        previous.groupId !==
        group.id
      ) {

        touchGroupOrder(
          previous.groupId,
          true
        );


        touchGroupOrder(
          group.id,
          true
        );


        currentId =
          group.id;


        localStorage.setItem(
          GROUP_STORAGE_KEY,
          currentId
        );

      }


      markSyncDirty();


      closeModal(
        editModal
      );


      refreshShortcutGroups();


      showToast(
        previous.groupId !== group.id
          ? `已移动到「${group.label}」`
          : "快捷方式已保存"
      );


      pendingEditKey =
        "";

    }


    catch (error) {

      editFormError.textContent =
        error.message
        ||
        "无法保存快捷方式";

    }

  }
);


syncForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    syncFormError.textContent =
      "";


    const token =
      syncTokenInput.value.trim();


    if (!token) {

      syncFormError.textContent =
        "请填写同步口令";


      return;

    }


    try {

      const success =
        await pushCloudSync({

          token,
          notify: true

        });


      if (success) {

        setSyncToken(token);


        closeModal(
          syncModal
        );

      }

    }

    catch (error) {

      syncFormError.textContent =
        error.message
        ||
        "无法启用同步";

    }

  }
);


syncPullButton.addEventListener(
  "click",
  async () => {

    syncFormError.textContent =
      "";


    const token =
      syncTokenInput.value.trim();


    if (!token) {

      syncFormError.textContent =
        "请填写同步口令";


      return;

    }


    try {

      /*
         恢复按钮：先读取云端并与本机
         自动合并（有冲突时弹窗，
         默认合并不丢数据），
         再把结果上传云端。
      */

      const resolved =
        await reconcileCloudConflict(
          token
        );


      if (!resolved) {

        closeModal(
          syncModal
        );


        showToast(
          "已取消：存在需要处理的同步冲突"
        );


        return;

      }


      setSyncToken(token);


      const uploaded =
        await pushCloudSync({

          token,
          notify: true

        });


      if (uploaded) {

        closeModal(
          syncModal
        );

      }

    }

    catch (error) {

      syncFormError.textContent =
        error.message
        ||
        "无法从云端恢复";

    }

  }
);


syncDisableButton.addEventListener(
  "click",
  () => {

    clearTimeout(
      syncTimer
    );


    localStorage.removeItem(
      SYNC_TOKEN_STORAGE_KEY
    );


    localStorage.removeItem(
      SYNC_META_STORAGE_KEY
    );


    syncTokenInput.value =
      "";


    closeModal(
      syncModal
    );


    showToast(
      "已在本机停用同步，云端数据仍保留"
    );

  }
);

    const file =
      iconFileInput.files[0];

      pendingIconKey;


    if (

      !key

          key,

    finally {

      pendingIconKey =

    try {

  event => {

    addFormError.textContent =

    try {

      const group =
        groups.find(
          item =>

        );


      if (!group) {

        throw new Error(
          "没有找到当前分类"

      }

      const key =

      touchGroupOrder(

      closeModal(
        addModal

        error.message
        ||
        "无法添加快捷方式";

);

/* ========================================
   鼠标滚轮

   滚得越快 / 越远，
   一次可切越多组。

   完全取消之前的锁定等待。
   ======================================== */

let wheelAccumulator =
  0;


let resetTimer =
  null;


/*
   越小越灵敏。

   普通鼠标滚一格一般约 100px，
   所以 65 会比较跟手。
*/

const WHEEL_THRESHOLD =
  65;


/*
   一次极大的滚动事件
   最多跨 6 个组。
*/

const MAX_STEPS =
  6;


function normaliseWheel(
  event
) {

  let delta =
    event.deltaY;


  /*
     deltaMode:
     0 = pixel
     1 = line
     2 = page
  */

  if (
    event.deltaMode === 1
  ) {

    delta *= 16;

  }


  else if (
    event.deltaMode === 2
  ) {

    delta *= 300;

  }


  return delta;

}


document.addEventListener(

  "wheel",

  event => {

    event.preventDefault();


    if (
      !addModal.hidden
      ||
      !editModal.hidden
      ||
      !iconUrlModal.hidden
      ||
      !syncModal.hidden
      ||
      !conflictModal.hidden
      ||
      !trashModal.hidden
      ||
      !folderModal.hidden
    ) {

      return;

    }


    wheelAccumulator +=
      normaliseWheel(
        event
      );


    let steps =
      Math.trunc(
        wheelAccumulator
        /
        WHEEL_THRESHOLD
      );


    if (!steps) {

      clearTimeout(
        resetTimer
      );


      resetTimer =
        setTimeout(
          () => {

            wheelAccumulator =
              0;

          },
          90
        );


      return;

    }


    steps =
      Math.max(
        -MAX_STEPS,
        Math.min(
          MAX_STEPS,
          steps
        )
      );


    wheelAccumulator -=
      steps
      *
      WHEEL_THRESHOLD;


    moveGroups(
      steps
    );


    clearTimeout(
      resetTimer
    );


    resetTimer =
      setTimeout(
        () => {

          wheelAccumulator =
            0;

        },
        90
      );

  },

  {
    passive: false
  }

);


/* ========================================
   上下方向键
   ======================================== */

document.addEventListener(

  "keydown",

  event => {

    if (
      event.key ===
      "Escape"
    ) {

      hideContextMenus();


      if (activeConflictResolver) {

        activeConflictResolver(
          "cancel"
        );

      }


      closeModal(
        addModal
      );


      closeModal(
        iconUrlModal
      );


      closeModal(
        syncModal
      );


      closeModal(
        conflictModal
      );


      closeModal(
        trashModal
      );


      closeModal(
        folderModal
      );


      pendingIconKey =
        "";


      return;

    }


    if (
      !addModal.hidden
      ||
      !iconUrlModal.hidden
      ||
      !syncModal.hidden
      ||
      !conflictModal.hidden
      ||
      !trashModal.hidden
      ||
      !folderModal.hidden
      ||
      /^(INPUT|TEXTAREA)$/.test(
        document.activeElement.tagName
      )
    ) {

      return;

    }

    if (
      event.key ===
      "ArrowDown"
    ) {

      moveGroups(1);

    }


    if (
      event.key ===
      "ArrowUp"
    ) {

      moveGroups(-1);

    }

  }

);


/* ========================================
   左右分页箭头与文件夹事件绑定
   ======================================== */

if (pageArrowPrev) {
  pageArrowPrev.addEventListener("click", () => {
    const cur = getGroupCurrentPage(currentId);
    setGroupPage(currentId, cur - 1);
  });
}

if (pageArrowNext) {
  pageArrowNext.addEventListener("click", () => {
    const cur = getGroupCurrentPage(currentId);
    setGroupPage(currentId, cur + 1);
  });
}

content.addEventListener("mousemove", e => {
  const totalPages = getGroupTotalPages(currentId);
  if (totalPages <= 1) {
    if (pageArrowPrev) pageArrowPrev.classList.remove("visible");
    if (pageArrowNext) pageArrowNext.classList.remove("visible");
    return;
  }
  const rect = content.getBoundingClientRect();
  const curPage = getGroupCurrentPage(currentId);
  const x = e.clientX;
  const THRESHOLD = 75;

  const nearLeft = x >= rect.left && x <= rect.left + THRESHOLD;
  const nearRight = x >= rect.right - THRESHOLD && x <= rect.right;

  if (pageArrowPrev) {
    pageArrowPrev.classList.toggle("visible", nearLeft && curPage > 0);
  }
  if (pageArrowNext) {
    pageArrowNext.classList.toggle("visible", nearRight && curPage < totalPages - 1);
  }
});

content.addEventListener("mouseleave", () => {
  if (pageArrowPrev) pageArrowPrev.classList.remove("visible");
  if (pageArrowNext) pageArrowNext.classList.remove("visible");
});

let lastWheelPageTime = 0;
content.addEventListener("wheel", event => {
  if (Math.abs(event.deltaX) > 25 && Math.abs(event.deltaX) > Math.abs(event.deltaY)) {
    const now = Date.now();
    if (now - lastWheelPageTime < 300) return;
    lastWheelPageTime = now;
    const cur = getGroupCurrentPage(currentId);
    if (event.deltaX > 0) {
      setGroupPage(currentId, cur + 1);
    } else {
      setGroupPage(currentId, cur - 1);
    }
  }
}, { passive: true });

if (folderTitleInput) {
  folderTitleInput.addEventListener("input", () => {
    if (!currentOpenFolderKey) return;
    const trimmed = folderTitleInput.value.trim();
    if (trimmed) {
      renameFolder(currentOpenFolderKey, trimmed);
    }
  });
}

if (folderCloseBtn) {
  folderCloseBtn.addEventListener("click", () => {
    closeModal(folderModal);
  });
}

if (folderDissolveBtn) {
  folderDissolveBtn.addEventListener("click", () => {
    if (currentOpenFolderKey) {
      dissolveFolder(currentOpenFolderKey);
    }
  });
}


/* ========================================
   初始化
   ======================================== */

buildSidebar();

buildAllGroups();


const initial =
  groupElements.get(
    currentId
  );


if (initial) {

  initial.classList.add(
    "active"
  );

}


updateNav();

warmPersistentIconCache();

initialiseCloudSync();

</script>
