<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shortcuts</title>

<style>
* {
  box-sizing: border-box;
}

html {
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

:root,
html,
body {
  position: fixed;
  inset: 0;
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  overflow: hidden !important;
  overscroll-behavior: none !important;
  scrollbar-width: none !important;
  -ms-overflow-style: none !important;
  background: transparent;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Text",
    "SF Pro Display",
    "PingFang SC",
    "Segoe UI",
    "Microsoft YaHei",
    sans-serif;

  color: #fff;
}

::-webkit-scrollbar {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
  background: transparent !important;
}

body {
  user-select: none;
}


/* ========================================
   整体布局
   ======================================== */

.app {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  box-sizing: border-box;

  display: grid;
  grid-template-columns: 106px 1fr;

  gap: 16px;

  padding: 10px 14px;

  overflow: hidden;
}


/* ========================================
   左侧分组
   大字号 + 独立滚动区域
   ======================================== */

.sidebar-shell {
  position: relative;
  height: 100%;
  min-height: 0;
  padding: 17px 0;
  overflow: hidden;
}

.sidebar {
  position: relative;
  height: 100%;
  min-height: 0;

  display: flex;
  flex-direction: column;
  justify-content: flex-start;

  gap: 3px;

  padding: 2px 3px;

  background: transparent;
  border: 0;
  box-shadow: none;

  overflow-x: hidden;
  overflow-y: hidden;
  scroll-behavior: smooth;
  scrollbar-width: none !important;
  overscroll-behavior: contain;
}

.sidebar::-webkit-scrollbar {
  display: none;
}

.sidebar-scroll {
  position: absolute;
  left: 50%;
  z-index: 12;

  width: 42px;
  height: 17px;
  margin: 0;
  padding: 0;

  transform: translateX(-50%);

  appearance: none;
  border: 0;
  outline: 0;
  background: transparent;

  color: rgba(255, 255, 255, 0.64);
  cursor: pointer;

  opacity: 0;
  visibility: hidden;
  pointer-events: none;

  display: flex;
  align-items: center;
  justify-content: center;

  transition:
    color 0.16s ease,
    opacity 0.18s ease,
    visibility 0s linear 0.18s;
}

.app:hover .sidebar-scroll:not([hidden]),
.app:focus-within .sidebar-scroll:not([hidden]) {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;

  transition:
    color 0.16s ease,
    opacity 0.18s ease,
    visibility 0s linear 0s;
}

.sidebar-scroll:hover {
  color: rgba(255, 255, 255, 0.94);
}

.sidebar-scroll-up {
  top: 0;
}

.sidebar-scroll-down {
  bottom: 0;
}

.sidebar-scroll svg {
  width: 16px;
  height: 11px;
  display: block;
}

.sidebar-scroll path {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.05;
  stroke-linecap: round;
  stroke-linejoin: round;
}


/* ========================================
   分组按钮
   ======================================== */

.nav-item {
  width: 100%;
  height: 27px;
  flex: 0 0 27px;
  box-sizing: border-box;

  appearance: none;

  border: 1px solid transparent;
  outline: 0;

  padding: 0 10px;

  background: transparent;

  border-radius: 999px;

  color:
    rgba(
      255,
      255,
      255,
      0.72
    );

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Text",
    "PingFang SC",
    "Segoe UI",
    "Microsoft YaHei",
    sans-serif;

  font-size: 13px;
  font-weight: 500;

  letter-spacing: 0.1px;

  cursor: pointer;
  touch-action: pan-y;

  display: flex;
  align-items: center;

  gap: 8px;

  text-align: left;

  transition:
    color 0.16s ease,
    background 0.16s ease,
    border-color 0.16s ease,
    box-shadow 0.16s ease;
}


.nav-item:hover {
  color:
    rgba(
      255,
      255,
      255,
      0.95
    );
  background:
    rgba(
      255,
      255,
      255,
      0.08
    );
}


.nav-item.active {
  color: #ffffff;
  font-weight: 600;

  border-radius: 999px;

  background:
    rgba(
      255,
      255,
      255,
      0.18
    );

  border-color:
    rgba(
      255,
      255,
      255,
      0.22
    );

  box-shadow:
    0 2px 8px rgba(0, 0, 0, 0.10),
    inset 0 1px 0 rgba(255, 255, 255, 0.14);
}

.nav-item.nav-item-dragging {
  opacity: 0.65;
  transform: scale(1.03);
  background: rgba(255, 255, 255, 0.16);
  border-color: rgba(255, 255, 255, 0.22);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.24);
  z-index: 20;
}

.nav-item-add {
  margin-top: 4px;
  opacity: 0.55;
  border-style: dashed;
  border-color: rgba(255, 255, 255, 0.18);
  justify-content: center;
  gap: 4px;
  font-size: 12px;
}

.nav-item-add:hover {
  opacity: 0.95;
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.32);
}

.sidebar-drop-indicator {
  position: absolute;
  left: 6px;
  right: 6px;
  height: 2px;
  background: #0A84FF;
  border-radius: 999px;
  box-shadow: 0 0 8px rgba(10, 132, 255, 0.8);
  pointer-events: none;
  z-index: 30;
  display: none;
  transition: top 0.08s ease;
}


/* ========================================
   分组左侧圆点
   ======================================== */

.nav-dot {
  width: 5px;
  height: 5px;

  flex: 0 0 auto;

  border-radius: 50%;

  background:
    rgba(
      255,
      255,
      255,
      0.20
    );

  transition:
    background 0.16s ease,
    box-shadow 0.16s ease,
    transform 0.16s ease;
}


/* Apple System Blue */

.nav-item.active
.nav-dot {
  background: #0A84FF;

  box-shadow:
    0 0 7px
    rgba(
      10,
      132,
      255,
      0.65
    );

  transform: scale(1.25);
}


/* ========================================
   右侧内容区域
   ======================================== */

.content {
  position: relative;

  width: 100%;
  height: 100%;

  min-width: 0;

  overflow: hidden;
}


/* ========================================
   每个分组都一直存在
   只切换显示状态

   这样切回来时：
   图片节点不会重新创建
   ======================================== */

.group-grid {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;
  overflow: hidden;

  opacity: 0;

  visibility: hidden;

  pointer-events: none;

  transform:
    translateY(10px);

  transition:
    opacity 0.20s ease,
    transform 0.22s
    cubic-bezier(.2,.75,.3,1),
    visibility 0.20s;
}


.group-grid.active {
  opacity: 1;

  visibility: visible;

  pointer-events: auto;

  transform:
    translateY(0);
}


.group-grid.from-top {
  transform:
    translateY(-10px);
}


.group-grid.active.from-top {
  transform:
    translateY(0);
}

.group-slider-track {
  display: flex;
  width: 100%;
  height: 100%;
  transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
  will-change: transform;
}

.group-page {
  flex: 0 0 100%;
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-auto-rows: 88px;
  gap: 8px 9px;
  align-content: center;
  box-sizing: border-box;
}

/* 左右分页小箭头：悬浮边缘显现 */
.page-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.28);
  background: rgba(45, 50, 65, 0.78);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 25;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.22s ease, transform 0.22s ease, background 0.18s ease;
  user-select: none;
  padding: 0;
}

.page-arrow-prev {
  left: 4px;
}

.page-arrow-next {
  right: 4px;
}

.page-arrow.visible {
  opacity: 1;
  pointer-events: auto;
}

.page-arrow:hover {
  background: rgba(255, 255, 255, 0.30);
  transform: translateY(-50%) scale(1.10);
}

.page-arrow:active {
  transform: translateY(-50%) scale(0.95);
}

.page-dots {
  position: absolute;
  bottom: 4px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 6px;
  z-index: 20;
  pointer-events: auto;
}

.page-dot {
  width: 6px;
  height: 6px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.35);
  cursor: pointer;
  transition: width 0.22s ease, background 0.22s ease;
}

.page-dot.active {
  width: 16px;
  background: rgba(255, 255, 255, 0.95);
  box-shadow: 0 0 6px rgba(255, 255, 255, 0.5);
}

/* 文件夹与拖动合并样式 */
.shortcut.shortcut-folder {
  cursor: pointer;
}

.shortcut.shortcut-folder .icon-shell {
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 17px;
  display: grid;
  grid-template-columns: repeat(2, 22px);
  grid-template-rows: repeat(2, 22px);
  gap: 3px;
  align-items: center;
  justify-content: center;
  padding: 5px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.16);
}

.folder-mini-icon {
  width: 22px;
  height: 22px;
  border-radius: 5px;
  object-fit: contain;
  background: rgba(255, 255, 255, 0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 600;
  color: #fff;
  overflow: hidden;
}

.folder-mini-icon img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.shortcut.folder-drop-target .icon-shell {
  box-shadow: 0 0 0 3px #0A84FF, 0 6px 20px rgba(10, 132, 255, 0.5) !important;
  transform: scale(1.08);
  border-color: rgba(10, 132, 255, 0.8) !important;
}


/* ========================================
   单个快捷方式
   ======================================== */

.shortcut {
  min-width: 0;

  color: inherit;

  text-decoration: none;

  border-radius: 17px;

  padding:
    7px 5px 6px;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  gap: 7px;

  background: transparent;

  border:
    1px solid
    transparent;

  cursor: pointer;

  transition:
    background 0.16s ease,
    border-color 0.16s ease,
    transform 0.16s ease,
    box-shadow 0.16s ease;
}


.shortcut:hover {
  background:
    rgba(
      255,
      255,
      255,
      0.07
    );

  border-color:
    rgba(
      255,
      255,
      255,
      0.08
    );

  transform:
    translateY(-2px);

  box-shadow:
    0 6px 18px
    rgba(
      0,
      0,
      0,
      0.08
    );
}


/* ========================================
   图标
   ======================================== */

.icon-shell {
  width: 50px;
  height: 50px;

  position: relative;

  display: flex;

  align-items: center;
  justify-content: center;

  overflow: hidden;

  border-radius: 15px;

  background:
    transparent;

  border:
    1px solid
    transparent;

  box-shadow:
    none;

  transition:
    transform 0.16s ease,
    background 0.16s ease;
}


.shortcut:hover
.icon-shell {
  transform:
    scale(1.055);

  background:
    transparent;
}


.icon-shell img {
  width: 39px;
  height: 39px;

  display: block;

  object-fit: contain;

  image-rendering: -webkit-optimize-contrast;
}


/* ========================================
   图标全部失败时才显示文字
   ======================================== */

.fallback {
  position: absolute;

  inset: 0;

  display: none;

  align-items: center;
  justify-content: center;

  color:
    rgba(
      255,
      255,
      255,
      0.95
    );

  font-size: 19px;

  font-weight: 650;
}


/* ========================================
   拖动排序

   拖动中的卡片轻微透明，
   放置位置用一根细的蓝色圆条提示，
   不加大面积卡片、不加阴影。
   ======================================== */

.shortcut {
  position: relative;
}

.shortcut.dragging {
  opacity: 0.4;
}

.shortcut.drop-before::before,
.shortcut.drop-after::after {
  content: "";

  position: absolute;

  top: 16%;
  bottom: 16%;

  width: 3px;

  border-radius: 3px;

  background:
    rgba(
      10,
      132,
      255,
      0.9
    );
}

.shortcut.drop-before::before {
  left: 0;
}

.shortcut.drop-after::after {
  right: 0;
}


/* ========================================
   快捷方式名称
   ======================================== */

.shortcut-label {
  width: 100%;

  padding:
    0 3px;

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;

  text-align: center;

  font-size: 11px;

  font-weight: 500;

  color:
    rgba(
      255,
      255,
      255,
      0.90
    );

  text-shadow:
    0 1px 3px
    rgba(
      0,
      0,
      0,
      0.50
    );
}


/* ========================================
   右键菜单与编辑窗口

   菜单文字使用清晰的系统字体栈，
   去掉发虚的 text-shadow，
   也不在菜单或其祖先上做
   缩放 transform（那是缩放场景下
   文字模糊的根源）。
   ======================================== */

[hidden] {
  display: none !important;
}

.context-menu {
  position: fixed;
  z-index: 300;
  width: 168px;
  max-height: calc(100vh - 20px);
  overflow-y: auto;
  scrollbar-width: none;
  padding: 5px;
  border-radius: 18px;
  background: rgba(30, 34, 44, 0.94);
  border: 1px solid rgba(255, 255, 255, 0.16);
  box-shadow:
    0 12px 40px rgba(0, 0, 0, 0.35),
    inset 0 1px 0 rgba(255, 255, 255, 0.08);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "PingFang SC",
    "Microsoft YaHei",
    "Segoe UI",
    sans-serif;
}

.context-menu::-webkit-scrollbar {
  display: none;
}

.context-menu button {
  width: 100%;
  height: 32px;
  padding: 0 10px;
  border: 0;
  border-radius: 12px;
  background: transparent;
  color: rgba(255, 255, 255, 0.97);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.2;
  text-align: left;
  cursor: pointer;
}

.context-menu button:hover {
  background: rgba(255, 255, 255, 0.095);
}

.context-menu-separator {
  height: 1px;
  margin: 4px 8px;
  background: rgba(255, 255, 255, 0.11);
}

#blankMenu {
  padding: 4px;
  border-radius: 18px;
}

#blankMenu button {
  border-radius: 12px;
}

.context-menu .danger {
  color: #ff9b96;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 400;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px;
  background: rgba(5, 8, 14, 0.50);
}

.modal-card {
  width: min(320px, 100%);
  padding: 16px;
  border-radius: 17px;
  background: rgba(30, 32, 39, 0.965);
  border: 1px solid rgba(255, 255, 255, 0.15);
  box-shadow:
    0 16px 40px rgba(0, 0, 0, 0.25),
    inset 0 1px 0 rgba(255, 255, 255, 0.06);
}

.modal-title {
  margin: 0 0 12px;
  color: rgba(255, 255, 255, 0.96);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.1px;
}

.field {
  display: block;
  margin-top: 9px;
}

.field span {
  display: block;
  margin: 0 0 5px 1px;
  color: rgba(255, 255, 255, 0.70);
  font-size: 10.5px;
  font-weight: 500;
}

.field input,
.field select {
  width: 100%;
  height: 34px;
  padding: 0 10px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 10px;
  outline: 0;
  background: rgba(255, 255, 255, 0.075);
  color: #fff;
  font: inherit;
  font-size: 11.5px;
  user-select: text;
}

.field select {
  appearance: none;
  -webkit-appearance: none;
  padding-right: 30px;
  background-image:
    linear-gradient(45deg, transparent 50%, rgba(255, 255, 255, 0.72) 50%),
    linear-gradient(135deg, rgba(255, 255, 255, 0.72) 50%, transparent 50%);
  background-position:
    calc(100% - 15px) 14px,
    calc(100% - 10px) 14px;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
}

.field select option {
  color: #fff;
  background: #242730;
}

.field input:focus,
.field select:focus {
  border-color: rgba(10, 132, 255, 0.72);
  box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.14);
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 7px;
  margin-top: 13px;
}

.modal-actions button {
  height: 30px;
  padding: 0 14px;
  border: 0;
  border-radius: 9px;
  color: #fff;
  font: inherit;
  font-size: 11.5px;
  font-weight: 500;
  cursor: pointer;
}

.button-secondary {
  background: rgba(255, 255, 255, 0.10);
}

.button-primary {
  background: #0A84FF;
}

.modal-note {
  margin: -4px 0 10px;
  color: rgba(255, 255, 255, 0.62);
  font-size: 10px;
  line-height: 1.55;
}

.sync-status {
  min-height: 16px;
  margin-top: 8px;
  color: rgba(255, 255, 255, 0.66);
  font-size: 9.5px;
  line-height: 1.45;
}

.sync-actions {
  flex-wrap: wrap;
}

.sync-actions .button-secondary,
.sync-actions .button-primary {
  padding: 0 11px;
}

.sync-disable {
  display: block;
  margin: 10px auto 0;
  padding: 2px 6px;
  border: 0;
  background: transparent;
  color: rgba(255, 255, 255, 0.48);
  font: inherit;
  font-size: 9.5px;
  cursor: pointer;
}

.sync-disable:hover {
  color: #ff9b96;
}

.form-error {
  min-height: 12px;
  margin-top: 6px;
  color: #ff9b96;
  font-size: 9.5px;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 12px;
  z-index: 500;
  max-width: calc(100% - 32px);
  padding: 8px 13px;
  border-radius: 999px;
  transform: translateX(-50%);
  background: rgba(28, 31, 39, 0.94);
  border: 1px solid rgba(255, 255, 255, 0.18);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
  color: rgba(255, 255, 255, 0.94);
  font-size: 11px;
  white-space: nowrap;
}

.toast-action {
  display: inline-flex;
  align-items: center;
  gap: 10px;
}

.toast-action button {
  padding: 0;
  border: 0;
  background: transparent;
  color: #66b5ff;
  font: inherit;
  font-weight: 650;
  cursor: pointer;
}

.conflict-list {
  max-height: 108px;
  margin: 0 0 10px;
  padding: 6px 10px;
  overflow-y: auto;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.055);
  color: rgba(255, 255, 255, 0.82);
  font-size: 10.5px;
  line-height: 1.55;
  list-style: none;
}

.conflict-list li + li {
  margin-top: 4px;
}

.conflict-actions {
  justify-content: stretch;
}

.conflict-actions .button-secondary,
.conflict-actions .button-primary {
  flex: 1;
}

.conflict-confirm {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 10px;
  color: rgba(255, 255, 255, 0.62);
  font-size: 10px;
  line-height: 1.45;
  cursor: pointer;
}

.conflict-confirm input {
  flex: 0 0 auto;
  accent-color: #0A84FF;
}

.trash-list {
  max-height: 190px;
  margin: 0 0 4px;
  padding: 2px;
  overflow-y: auto;
}

.trash-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 7px;
  border-radius: 10px;
}

.trash-row + .trash-row {
  margin-top: 2px;
}

.trash-row:hover {
  background: rgba(255, 255, 255, 0.06);
}

.trash-info {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.trash-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: rgba(255, 255, 255, 0.92);
  font-size: 11px;
  font-weight: 600;
}

.trash-meta {

<script>

/* ========================================
   保存键
   ======================================== */

const GROUP_STORAGE_KEY =
  "tabliss-shortcuts-group-v3";


/*
   这里已经预留给以后
   “本地上传自定义图标”
   使用。

   后面可以做成：

   右键快捷方式
   → 更换图标
   → 选择本地图片
   → 保存
*/

const ICON_OVERRIDE_KEY =
  "tabliss-shortcuts-icon-overrides-v1";


/*
   已验证图标地址的持久缓存。

   图标文件本身继续交给浏览器 HTTP 缓存；
   localStorage 只记录最终可用地址，
   避免每次刷新都重新探测多组 favicon。
*/

const ICON_CACHE_STORAGE_KEY =
  "tabliss-shortcuts-resolved-icons-v1";


const CUSTOM_SITES_STORAGE_KEY =
  "tabliss-shortcuts-custom-sites-v1";


const SITE_MODEL_VERSION_KEY =
  "tabliss-shortcuts-site-model-version";


/*
   版本 3：每条快捷方式带 updatedAt，
   分组排序独立保存在 groupOrder，
   删除走 trash 墓碑。
   版本 1 / 2 的本地与云端数据都会
   自动升级，不会误判为已删除。
*/

const SITE_MODEL_VERSION =
  3;


const GROUP_ORDER_STORAGE_KEY =
  "tabliss-shortcuts-group-order-v1";


const TRASH_STORAGE_KEY =
  "tabliss-shortcuts-trash-v1";


const SYNC_TOKEN_STORAGE_KEY =
  "tabliss-shortcuts-sync-token-v1";


const SYNC_META_STORAGE_KEY =
  "tabliss-shortcuts-sync-meta-v1";


const SYNC_ENDPOINT =
  "https://tablissng-sync.o-ous.workers.dev/sync";


/* ========================================
   自定义图标覆盖
   ======================================== */

let iconOverrides = {};


try {

  iconOverrides =
    JSON.parse(
      localStorage.getItem(
        ICON_OVERRIDE_KEY
      )
      ||
      "{}"
    );

}

catch {

  iconOverrides = {};

}


function saveIconOverrides() {

  try {

    localStorage.setItem(
      ICON_OVERRIDE_KEY,
      JSON.stringify(
        iconOverrides
      )
    );


    return true;

  }

  catch (error) {

    console.warn(
      "Unable to save custom icon",
      error
    );


    return false;

  }

}


let customSites = [];


try {

  const parsed =
    JSON.parse(
      localStorage.getItem(
        CUSTOM_SITES_STORAGE_KEY
      )
      ||
      "[]"
    );


  if (Array.isArray(parsed)) {

    customSites = parsed;

  }

}

catch {

  customSites = [];

}


/*
   分组排序与回收站是版本 3 的
   两个新数据块，都在本地保存、
   也都会加密同步到 GitHub。
*/

let groupOrderState = {};


try {

  const parsed =
    JSON.parse(
      localStorage.getItem(
        GROUP_ORDER_STORAGE_KEY
      )
      ||
      "{}"
    );


  groupOrderState =
    TablissSyncModel.normaliseGroupOrder(
      parsed
    );

}

catch {

  groupOrderState = {};

}


let trashEntries = [];


try {

  const parsed =
    JSON.parse(
      localStorage.getItem(
        TRASH_STORAGE_KEY
      )
      ||
      "[]"
    );


  trashEntries =
    TablissSyncModel.normaliseTrashEntries(
      parsed
    );

}

catch {

  trashEntries = [];

}


function saveGroupOrderState() {

  try {

    localStorage.setItem(
      GROUP_ORDER_STORAGE_KEY,
      JSON.stringify(
        groupOrderState
      )
    );


    return true;

  }

  catch (error) {

    console.warn(
      "Unable to save group order",
      error
    );


    return false;

  }

}


function saveTrashEntries() {

  try {

    localStorage.setItem(
      TRASH_STORAGE_KEY,
      JSON.stringify(
        trashEntries
      )
    );


    return true;

  }

  catch (error) {

    console.warn(
      "Unable to save deleted shortcuts",
      error
    );


    return false;

  }

}


function saveCustomSites() {

  try {

    localStorage.setItem(
      CUSTOM_SITES_STORAGE_KEY,
      JSON.stringify(
        customSites
      )
    );


    return true;

  }

  catch (error) {

    console.warn(
      "Unable to save custom shortcut",
      error
    );


    return false;

  }

}


/* ========================================
   图标两级缓存

   第一层：当前页面的 Map
   第二层：localStorage
   ======================================== */

const iconResolutionCache =
  new Map();


let storedIconCache = {};


try {

  const parsed =
    JSON.parse(
      localStorage.getItem(
        ICON_CACHE_STORAGE_KEY
      )
      ||
      "{}"
    );


  if (
    parsed
    &&
    typeof parsed === "object"
    &&
    !Array.isArray(parsed)
  ) {

    storedIconCache =
      parsed;

  }

}

catch {

  storedIconCache = {};

}


function iconCacheSignature(
  key,
  site
) {

  return JSON.stringify([

    iconOverrides[key]
      || "",

    site.customIcon
      || "",

    site.icon
      || "",

    site.url
      || ""

  ]);

}


function getStoredIcon(
  key,
  site
) {

  const entry =
    storedIconCache[key];


  if (
    !entry
    ||
    typeof entry.src !== "string"
    ||
    entry.signature !==
      iconCacheSignature(
        key,
        site
      )
  ) {

    return "";

  }


  /*
     若旧缓存保存的是低清 16x16 / 32x32 的 .ico，
     主动忽略该缓存，触发重新走高解析度链路（Apple Touch Icon / Google 128px）。
  */
  if (
    entry.src.toLowerCase().includes(".ico")
    ||
    entry.src.includes("icons.duckduckgo.com")
  ) {

    return "";

  }


  return entry.src;

}


function saveStoredIcon(
  key,
  site,
  src
) {

  if (!src) {
    return;
  }


  /*
     data URL 已由 iconOverrides 持久保存，
     这里不重复存一份，避免占用双倍空间。
  */

  if (
    src.startsWith("data:")
    ||
    src.startsWith("blob:")
  ) {

    return;

  }


  storedIconCache[key] = {

    src,

    signature:
      iconCacheSignature(
        key,
        site
      )

  };


  try {

    localStorage.setItem(
      ICON_CACHE_STORAGE_KEY,
      JSON.stringify(
        storedIconCache
      )
    );

  }

  catch (error) {

    console.warn(
      "Unable to save icon cache",
      error
    );

  }

}


function clearStoredIcon(key) {

  iconResolutionCache.delete(
    key
  );


  if (
    !Object.prototype
      .hasOwnProperty.call(
        storedIconCache,
        key
      )
  ) {

    return;

  }


  delete storedIconCache[key];


  try {

    localStorage.setItem(
      ICON_CACHE_STORAGE_KEY,
      JSON.stringify(
        storedIconCache
      )
    );

  }

  catch (error) {

    console.warn(
      "Unable to update icon cache",
      error
    );

  }

}


function getHostname(url) {

  try {

    return (
      new URL(url).hostname
    );

  }

  catch {

    return "";

  }

}


function normaliseIcon(url) {

  if (!url) {
    return "";
  }


  if (
    url.startsWith("/")
  ) {

    return (
      "https://web.gotab.cn"
      +
      url
    );

  }


  return url;

}


function ownFavicon(url) {

  try {

    const parsed =
      new URL(url);


    if (
      parsed.protocol !==
      "https:"
    ) {

      return "";

    }


    return (
      parsed.origin
      +
      "/favicon.ico"
    );

  }

  catch {

    return "";

  }

}


/* ========================================
   Apple Touch Icon (Retina 高清 PNG，通常为 180x180)
   ======================================== */

function appleTouchIcon(url) {

  try {

    const parsed =
      new URL(url);


    if (
      parsed.protocol !== "https:"
      &&
      parsed.protocol !== "http:"
    ) {

      return "";

    }


    return (
      parsed.origin
      +
      "/apple-touch-icon.png"
    );

  }

  catch {

    return "";

  }

}


function googleFavicon(url) {

  return (
    "https://www.google.com/s2/favicons?sz=128&domain_url="
    +
    encodeURIComponent(url)
  );

}


const DEFAULT_FALLBACK_ICON =
  "https://o-ocn.github.io/icons/icons/default-fallback.png";


function duckFavicon(url) {

  const hostname =
    getHostname(url);


  if (!hostname) {
    return "";
  }


  return (
    "https://icons.duckduckgo.com/ip3/"
    +
    hostname
    +
    ".ico"
  );

}


/* ========================================
   检查一个图标是否可以加载且具备有效尺寸
   ======================================== */

function probeImage(url) {

  return new Promise(
    resolve => {

      if (!url) {

        resolve(false);

        return;

      }


      const img =
        new Image();


      img.onload =
        () => {

          resolve(
            img.naturalWidth > 0
            &&
            img.naturalHeight > 0
          );

        };


      img.onerror =
        () => {

          resolve(false);

        };


      img.src =
        url;

    }
  );

}


/* ========================================
   解析网站图标

   高清晰度优先：
   1 自定义本地图标（用户手动上传/链接）
   2 预设高清图标（SVG 或 PNG）
   3 网站官方 Apple Touch Icon (180x180 PNG)
   4 Google Favicon (sz=128 高清缓存)
   5 预设 .ico 图标
   6 网站默认 /favicon.ico (通常仅 16x16)
   7 DuckDuckGo 兜底图标
   ======================================== */

function resolveIcon(
  key,
  site,
  forceRefresh = false
) {

  if (
    !forceRefresh
    &&
    iconResolutionCache
      .has(key)
  ) {

    return (
      iconResolutionCache
        .get(key)
    );

  }


  if (!forceRefresh) {

    const storedIcon =
      getStoredIcon(
        key,
        site
      );


    if (storedIcon) {

      const cachedPromise =
        Promise.resolve(
          storedIcon
        );


      iconResolutionCache.set(
        key,
        cachedPromise
      );


      return cachedPromise;

    }

  }


  const promise =
    (async () => {

      const candidates =
        [...new Set([

        iconOverrides[key]
          || "",

        normaliseIcon(
          site.customIcon
        ),

        site.icon && !site.icon.toLowerCase().endsWith(".ico")
          ? normaliseIcon(site.icon)
          : "",

        appleTouchIcon(
          site.url
        ),

        googleFavicon(
          site.url
        ),

        site.icon && site.icon.toLowerCase().endsWith(".ico")
          ? normaliseIcon(site.icon)
          : "",

        ownFavicon(
          site.url
        )

      ])];


      for (
        const candidate
        of candidates
      ) {

        if (!candidate) {
          continue;
        }


        const success =
          await probeImage(
            candidate
          );


        if (success) {

          saveStoredIcon(
            key,
            site,
            candidate
          );


          return candidate;

        }

      }


      return DEFAULT_FALLBACK_ICON;

    })();


  iconResolutionCache.set(
    key,
    promise
  );


  return promise;

}

   分组配置持久化（支持拖拽排序、增删改）
   ======================================== */

const GROUPS_STORAGE_KEY =
  "tabliss-shortcuts-groups-config-v1";

function loadGroupsConfig() {
  try {
    const raw =
      localStorage.getItem(
        GROUPS_STORAGE_KEY
      );

    if (raw) {
      const parsed =
        JSON.parse(raw);

      if (
        Array.isArray(parsed)
        &&
        parsed.length > 0
      ) {
        return parsed
          .filter(
            g =>
              g
              &&
              typeof g.id === "string"
              &&
              g.id.trim()
              &&
              typeof g.label === "string"
          )
          .map(
            g => ({
              id: g.id.slice(0, 50),
              label: g.label.slice(0, 50),
              items: []
            })
          );
      }
    }
  } catch (error) {
    console.warn(
      "Unable to load groups configuration",
      error
    );
  }

  return DEFAULT_PRESET_GROUPS.map(
    g => ({
      id: g.id,
      label: g.label,
      items: []
    })
  );
}

let groups =
  loadGroupsConfig();

function saveGroupsConfig() {
  try {
    const data =
      groups.map(
        g => ({
          id: g.id,
          label: g.label
        })
      );

    localStorage.setItem(
      GROUPS_STORAGE_KEY,
      JSON.stringify(data)
    );

      "Unable to save groups configuration",
      error
    );
  }
}


/* ========================================
   统一快捷方式数据

   预设只用于第一次初始化。
   初始化后，所有快捷方式都采用同一种
   可编辑、可移动、可删除的数据结构。
   ======================================== */


function normaliseCustomSites(
  entries
) {

  if (!Array.isArray(entries)) {

    return [];

  }


  const seenKeys =
    new Set();


  return entries
    .filter(
      entry => {

        if (
          !entry
          ||
          typeof entry.key !== "string"
          ||
          !entry.key.trim()
          ||
          seenKeys.has(entry.key)
          ||
          typeof entry.label !== "string"
          ||
          !entry.label.trim()
          ||
          typeof entry.url !== "string"
          ||
          !/^https?:\/\//i.test(entry.url)
          ||
          typeof entry.groupId !== "string"
        ) {

          return false;

        }


        seenKeys.add(
          entry.key
        );


        return true;

      }
    )
    .slice(0, 200)
    .map(
      entry => ({

        key: entry.key.slice(0, 100),
        label: entry.label.trim().slice(0, 50),
        url: entry.url.slice(0, 2048),
        groupId: entry.groupId.slice(0, 50),
        icon:
          typeof entry.icon === "string"
          &&
          /^https:\/\//i.test(entry.icon)
            ? entry.icon.slice(0, 2048)
            : "",
        updatedAt:
          typeof entry.updatedAt === "string"
          &&
          entry.updatedAt
          &&
          entry.updatedAt.length <= 40
            ? entry.updatedAt
            : ""

      })
    );

}


function buildDefaultManagedSites() {

  const seenSiteKeys =
    new Set();


  return DEFAULT_PRESET_GROUPS.flatMap(
    group =>
      group.items
        .map(
          siteKey => {

            const site =
              sites[siteKey];


            if (!site) {
              return null;
            }


            const key =
              seenSiteKeys.has(siteKey)
                ? `preset-${group.id}-${siteKey}`
                : siteKey;


            seenSiteKeys.add(
              siteKey
            );


            return {

              key,
              sourceKey: siteKey,
              label: site.label,
              url: site.url,
              groupId: group.id,
              icon:
                normaliseIcon(
                  site.customIcon
                )
                ||
                normaliseIcon(
                  site.icon
                )

            };

          }
        )
        .filter(Boolean)
  );

}


const defaultManagedSites =
  buildDefaultManagedSites();


const ORIGINAL_PRESET_ICONS =
  Object.fromEntries(
    Object.entries(sites).map(
      ([k, s]) => [k, s.icon || ""]
    )
  );


/*
   仅 v1 数据使用：预设重复出现时
   （preset-<组>-<键>），把旧 sourceKey 上的
   自定义图标复制到新 key。

   v2 及以上的数据键已统一，
   绝不能执行这个迁移。
*/

function migrateLegacyIconOverrides(
  sourceIconOverrides
) {

  defaultManagedSites.forEach(
    entry => {

      if (
        entry.key !==
          entry.sourceKey
        &&
        sourceIconOverrides[
          entry.sourceKey
        ]
        &&
        !sourceIconOverrides[
          entry.key
        ]
      ) {

        sourceIconOverrides[
          entry.key
        ] = sourceIconOverrides[
          entry.sourceKey
        ];

      }

    }
  );

}


function applyCustomSitesToRuntime(
  entries
) {

  groups.forEach(
    group => {

      group.items = [];

    }
  );


  Object.keys(sites).forEach(
    key => {

      delete sites[key];

    }
  );


  customSites =
    normaliseCustomSites(entries);


  let customSitesDirty = false;
  customSites.forEach(
    entry => {

      const sourceKey =
        entry.sourceKey
        ||
        entry.key.replace(/^preset-[^-]+-/, "");

      const presetIcon =
        ORIGINAL_PRESET_ICONS[sourceKey]
        ||
        ORIGINAL_PRESET_ICONS[entry.key];

      if (presetIcon && !iconOverrides[entry.key]) {
        if (
          !entry.icon
          ||
          entry.icon.includes("files.codelife.cc")
          ||
          entry.icon.includes("dbbqb.com")
          ||
          entry.icon.includes("mengma.moe")
          ||
          entry.icon.includes("tieba.svg")
          ||
          entry.icon !== presetIcon
        ) {
          entry.icon = presetIcon;
          customSitesDirty = true;
        }
      }

      if (entry.groupId && entry.groupId.startsWith("folder_")) {
        sites[entry.key] = {
          label: entry.label,
          url: entry.url,
          icon: entry.icon || presetIcon || ""
        };
        return;
      }

      let group =
        groups.find(
          item =>
            item.id ===
            entry.groupId
        );

      if (!group) {
        group = {
          id: entry.groupId,
          label: entry.groupId,
          items: []
        };
        groups.push(group);
        saveGroupsConfig();
      }


      sites[entry.key] = {

        label: entry.label,
        url: entry.url,
        icon: entry.icon || presetIcon || ""

      };


      if (!group.items.includes(entry.key)) {

        group.items.push(entry.key);

      }

    }
  );

  if (customSitesDirty) {
    saveCustomSites();
  }

  let cacheCleaned = false;
  Object.keys(storedIconCache).forEach(k => {
    const cached = storedIconCache[k];
    if (cached && typeof cached.src === "string") {
      if (
        cached.src.includes("files.codelife.cc")
        ||
        cached.src.includes("duckduckgo.com")
        ||
        cached.src.includes("google.com/s2/favicons")
        ||
        cached.src.includes("dbbqb.com")
        ||
        cached.src.includes("mengma.moe")
        ||
        cached.src.includes("tieba.svg")
      ) {
        delete storedIconCache[k];
        cacheCleaned = true;
      }
    }
  });
  if (cacheCleaned) {
    try {
      localStorage.setItem(
        ICON_CACHE_STORAGE_KEY,
        JSON.stringify(storedIconCache)
      );
    } catch(e) {}
  }


  applyGroupOrderToRuntime();

}


/*
   把持久化的分组排序应用到运行时。
   排序里已不存在的 key 会被剔除，
   排序里缺失的 key 保留在末尾，
   因此新旧数据混用时也不会丢网站。
*/

function applyGroupOrderToRuntime() {

  groups.forEach(
    group => {

      const order =
        groupOrderState[
          group.id
        ];


      if (
        !order
        ||
        !Array.isArray(
          order.items
        )
      ) {

        return;

      }


      const ordered =
        order.items.filter(
          key =>
            group.items.includes(
              key
            )
        );


      group.items.forEach(
        key => {

          if (
            !ordered.includes(
              key
            )
          ) {

            ordered.push(
              key
            );

          }

        }
      );


      group.items =
        ordered;

    }
  );

}


/*
   把某个分组当前的实际顺序
   写回持久化排序。

   touch = true 只用于真正的
   排序变化（拖动、增删、移动）。
   改名、换链接不会触碰排序，
   也就不会覆盖另一台设备的排序。
*/

function touchGroupOrder(
  groupId,
  touch = true
) {

  const group =
    groups.find(
      item =>
        item.id ===
        groupId
    );


  if (!group) {

    return;

  }


  const previous =
    groupOrderState[
      groupId
    ];


  const unchanged =
    previous
    &&
    previous.items.length ===
      group.items.length
    &&
    previous.items.every(
      (key, index) =>
        key ===
        group.items[index]
    );


  groupOrderState[groupId] = {

    items: [
      ...group.items
    ],

    updatedAt:
      touch
      &&
      !unchanged
        ? new Date().toISOString()
        : previous?.updatedAt
          || ""

  };


  saveGroupOrderState();

}


function touchAllGroupOrders(
  touch = false
) {

  groups.forEach(
    group => {

      touchGroupOrder(
        group.id,
        touch
      );

    }
  );

}


function touchSiteEntry(
  key
) {

  const entry =
    customSites.find(
      item =>
        item.key ===
        key
    );


  if (entry) {

    entry.updatedAt =
      new Date().toISOString();

  }


  return entry;

}


function recordDeletedSite(
  entry,
  indexInGroup
) {

  trashEntries = [

    {

      key: entry.key,
      label: entry.label,
      url: entry.url,
      groupId: entry.groupId,
      icon: entry.icon || "",
      deletedAt:
        new Date().toISOString(),
      originalGroupId:
        entry.groupId,
      originalIndex:
        Math.max(
          0,
          indexInGroup
        ),
      purged: false

    },

    ...trashEntries.filter(
      item =>
        item.key !==
        entry.key
    )

  ];


  trashEntries =
    TablissSyncModel.pruneTrashEntries(
      trashEntries
    );


  saveTrashEntries();

}


function dropTrashEntry(
  key
) {

  trashEntries =
    trashEntries.filter(
      item =>
        item.key !==
        key
    );


  saveTrashEntries();

}


/*
   升级到版本 3。

   - v1（storedModelVersion < 2）：
     旧数据只包含用户自建网站，
     需要并入预设（含 sourceKey 图标迁移）。
   - v2 → v3：customSites 已经是
     统一管理的权威数据。用户改名、改链接、
     移动分组、删除预设的结果全部原样保留，
     绝不重新并入预设。

   两种情况都只补更新时间、构建排序、
   建立空回收站，不产生删除记录。

   时间戳优先使用本机最后一次同步时间，
   让另一台设备上更新的修改在合并时获胜。
*/

const storedModelVersion =
  Number(
    localStorage.getItem(
      SITE_MODEL_VERSION_KEY
    )
    ||
    0
  );


if (
  storedModelVersion <
    SITE_MODEL_VERSION
) {

  const upgradeStamp =
    readSyncMeta()
      .lastSyncedAt
    ||
    new Date()
      .toISOString();


  if (
    storedModelVersion < 2
  ) {

    migrateLegacyIconOverrides(
      iconOverrides
    );

  }


  const upgraded =
    TablissSyncModel.upgradeCustomSitesToV3(

      storedModelVersion,

      customSites,

      storedModelVersion < 2
        ? defaultManagedSites
        : [],

      {
        timestamp:
          upgradeStamp
      }

    );


  customSites =
    upgraded.sites;


  groupOrderState =
    upgraded.groupOrder;


  trashEntries = [];


  saveCustomSites();
  saveIconOverrides();
  saveGroupOrderState();
  saveTrashEntries();


  localStorage.setItem(
    SITE_MODEL_VERSION_KEY,
    String(
      SITE_MODEL_VERSION
    )
  );

}


applyCustomSitesToRuntime(
  customSites
);

function renderTrashList() {

  /*

    empty.className =
      "trash-empty";


    empty.textContent =

    trashList.replaceChildren(

    return;

  }


  trashList.replaceChildren(

    ...restorable.map(
      entry => {

        const row =
          document.createElement(

          );


        row.className =
          "trash-row";


        const info =
          document.createElement(
            "div"
          );


        info.className =

        const name =

          );

        const meta =

        meta.className =
          "trash-meta";


        meta.textContent =
          `${getGroupLabel(entry.originalGroupId)} · ${formatDeletedTime(entry.deletedAt)} 删除`;


        info.appendChild(
          name
        );


        info.appendChild(
          meta
        );


        const actions =
          document.createElement(
            "div"
          );


        actions.className =
          "trash-actions";


        const restoreButton =
          document.createElement(
            "button"
          );


        restoreButton.type =
          "button";


        restoreButton.className =
          "trash-restore";


        restoreButton.textContent =
          "恢复";


        restoreButton.addEventListener(
          "click",
          () => {

            restoreFromTrash(
              entry.key
            );


            renderTrashList();

          }
        );


        const purgeButton =
          document.createElement(
            "button"
          );


        purgeButton.type =
          "button";


        purgeButton.className =
          "trash-purge";


        purgeButton.textContent =
          "永久删除";


        /*
           永久删除的二次确认：
           第一次点击只切换成
           “确认永久删除”，
           4 秒内再次点击才真正删除。
        */

        purgeButton.addEventListener(
          "click",
          () => {

            if (
              purgeButton.dataset.confirm !==
              "1"
            ) {

              purgeButton.dataset.confirm =
                "1";


              purgeButton.classList.add(
                "confirming"
              );


              purgeButton.textContent =
                "确认永久删除";


              setTimeout(
                () => {

                  if (
                    purgeButton.isConnected
                  ) {

                    purgeButton.dataset.confirm =
                      "";


                    purgeButton.classList.remove(
                      "confirming"
                    );


                    purgeButton.textContent =
                      "永久删除";

                  }

                },
                4000
              );


              return;

            }


            purgeFromTrash(
              entry.key
            );


            renderTrashList();

          }
        );


        actions.appendChild(
          restoreButton
        );


        actions.appendChild(
          purgeButton
        );


        row.appendChild(
          info
        );


        row.appendChild(
          actions
        );


        return row;

      }
    )

  );

}

/*
   从回收站恢复：
   尽量回到原分组、原位置
   （originalIndex 是删除时
   在分组内的下标）。
*/

function restoreFromTrash(
  key
) {

  const entry =
    trashEntries.find(
      item =>
        item.key ===
        key
    );


  if (!entry) {

    return;

  }


  /*
     永久删除（purged）的记录不可恢复；
     正常情况下界面不会提供入口。
  */

  if (entry.purged) {

    showToast(
      "该快捷方式已永久删除，无法恢复"
    );


    return;

  }


  if (
    getCustomSiteEntry(
      key
    )
  ) {

    dropTrashEntry(
      key
    );


    return;

  }


  const targetGroupId =
    groups.some(
      group =>
        group.id ===
        entry.originalGroupId
    )
      ? entry.originalGroupId
      : groups[0].id;


  const restored = {

    key: entry.key,
    label: entry.label,
    url: entry.url,
    groupId: targetGroupId,
    icon: entry.icon || "",
    updatedAt:
      new Date().toISOString()

  };


  customSites.push(
    restored
  );


  if (!saveCustomSites()) {

    customSites.pop();


    showToast(
      "恢复失败：本地存储空间不足"
    );


    return;

  }


  /*
     把 key 插回该分组的排序，
     位置尽量等于删除时的下标。
  */

  const order =
    groupOrderState[
      targetGroupId
    ]
    ||
    {

      items: [],
      updatedAt: ""

    };


  const items =
    order.items.filter(
      item =>
        item !==
        key
    );


  const insertIndex =
    Math.min(
      entry.originalIndex || 0,
      items.length
    );


  items.splice(
    insertIndex,
    0,
    key
  );


  groupOrderState[targetGroupId] = {

    items,
    updatedAt:
      new Date().toISOString()

  };


  saveGroupOrderState();


  dropTrashEntry(
    key
  );


  applyCustomSitesToRuntime(
    customSites
  );


  refreshShortcutGroups();


  markSyncDirty();


  showToast(
    `已恢复「${entry.label}」`
  );

}


function purgeFromTrash(
  key
) {

  const entry =
    trashEntries.find(
      item =>
        item.key ===
        key
    );


  if (!entry) {

    return;

  }


  /*
     永久删除后不彻底移除记录，而是
     转成精简的同步删除标记（purged 墓碑）：
     只保留 key 与时间戳，不再可恢复，
     也不携带名称、链接、图标等内容。

     它随同步上传，用于阻止仍保存该网站的
     离线旧设备在下次合并时把它复活。
  */

  const purgedAt =
    new Date().toISOString();


  trashEntries = [

    {

      key: entry.key,
      deletedAt: entry.deletedAt,
      purged: true,
      purgedAt

    },

    ...trashEntries.filter(
      item =>
        item.key !==
        entry.key
    )

  ];


  saveTrashEntries();


  clearStoredIcon(
    key
  );


  markSyncDirty();


  showToast(
    `已永久删除「${entry.label}」`
  );

}

/* ========================================
   持久图标缓存

   Service Worker 会保存实际图片响应，
   后续新标签页直接读取本机缓存。
   ======================================== */

async function warmPersistentIconCache() {

  if (
    !("serviceWorker" in navigator)
    ||
    location.protocol !== "https:"
  ) {

    return;

  }


  try {

    const registration =
      await navigator.serviceWorker.register(
        "./sw.js",
        {
          scope: "./",
          updateViaCache: "none"
        }
      );


    await navigator.serviceWorker.ready;


    const urls =
      [...new Set([

        ...Object.values(
          storedIconCache
        )
          .map(entry => entry?.src),

        ...Object.values(sites)
          .flatMap(site => [

            normaliseIcon(site.customIcon),
            normaliseIcon(site.icon),
            googleFavicon(site.url)

          ])

      ])]
        .filter(url =>
          typeof url === "string"
          &&
          /^https:\/\//i.test(url)
        );


    registration.active?.postMessage({

      type: "WARM_ICON_CACHE",
      urls

    });

  }

  catch (error) {

    console.warn(
      "Unable to initialise persistent icon cache",
      error
    );

  }

}

/* ========================================
   GitHub 安全同步

   同步口令只保存在当前浏览器。
   GitHub 中保存的是 Worker 加密后的数据。
   ======================================== */

function getSyncToken() {

  return (
    localStorage.getItem(
      SYNC_TOKEN_STORAGE_KEY
    )
    ||
    ""
  ).trim();

}


function setSyncToken(token) {

  localStorage.setItem(
    SYNC_TOKEN_STORAGE_KEY,
    token.trim()
  );

}


function readSyncMeta() {

  try {

    return JSON.parse(
      localStorage.getItem(
        SYNC_META_STORAGE_KEY
      )
      ||
      "{}"
    );

  }

  catch {

    return {};

  }

}


function writeSyncMeta(value) {

  localStorage.setItem(
    SYNC_META_STORAGE_KEY,
    JSON.stringify(value)
  );

}


function updateSyncStatus(message) {

  syncStatus.textContent =
    message;

}


function normaliseIconOverrides(
  value
) {

  if (
    !value
    ||
    typeof value !== "object"
    ||
    Array.isArray(value)
  ) {

    return {};

  }


  return Object.fromEntries(
    Object.entries(value)
      .filter(
        ([key, icon]) =>
          typeof key === "string"
          &&
          typeof icon === "string"
          &&
          (
            icon.startsWith("data:image/")
            ||
            /^https:\/\//i.test(icon)
          )
      )
      .slice(0, 300)
  );

}


/*
   组装上传用的版本 3 文档。
   customSites 按当前实际显示顺序输出，
   这样即使被旧版页面覆盖，
   顺序也能最大程度保留。
*/

function orderedCustomSitesForSync() {

  const orderedKeys =
    groups.flatMap(
      group =>
        group.items
    );


  const keyed =
    new Map(
      customSites.map(
        entry =>
          [
            entry.key,
            entry
          ]
      )
    );


  const ordered = [];


  orderedKeys.forEach(
    key => {

      const entry =
        keyed.get(
          key
        );


      if (entry) {

        ordered.push(
          entry
        );


        keyed.delete(
          key
        );

      }

    }
  );


  keyed.forEach(
    entry => {

      ordered.push(
        entry
      );

    }
  );


  return ordered;

}


function currentSyncDocument() {

  return {

    modelVersion:
      SITE_MODEL_VERSION,

    customSites:
      normaliseCustomSites(
        orderedCustomSitesForSync()
      ),

    iconOverrides:
      normaliseIconOverrides(
        iconOverrides
      ),

    groupOrder:
      TablissSyncModel.normaliseGroupOrder(
        groupOrderState
      ),

    trash:
      TablissSyncModel.normaliseTrashEntries(
        trashEntries
      )

  };

}


function buildSyncUploadBody() {

  const meta =
    readSyncMeta();


  return {

    ...currentSyncDocument(),

    expectedRevision:
      typeof meta.revision === "string"
        ? meta.revision
        : ""

  };

}


async function syncFetch(
  method,
  token,
  body
) {

  const response =
    await fetch(
      SYNC_ENDPOINT,
      {
        method,
        headers: {

          Authorization:
            `Bearer ${token}`,

          ...(body
            ? {
                "Content-Type":
                  "application/json"
              }
            : {})

        },
        cache: "no-store",
        body:
          body
            ? JSON.stringify(body)
            : undefined
      }
    );


  let result = {};


  try {

    result =
      await response.json();

  }

  catch {

    result = {};

  }


  if (!response.ok) {

    const message =
      response.status === 401
        ? "同步口令不正确"
        : response.status === 409
          ? "云端有其他设备写入的更新"
          : result.error
            ||
            "云端同步暂时不可用";


    const error =
      new Error(
        message
      );


    error.status =
      response.status;


    error.body =
      result;


    throw error;

  }


  return result;

}


async function pushCloudSync({

  token = getSyncToken(),
  notify = false

} = {}) {

  if (!token) {

    return false;

  }


  if (syncInFlight) {

    scheduleCloudSync();
    return false;

  }


  syncInFlight =
    true;


  const startedRevision =
    syncRevision;


  updateSyncStatus(
    "正在上传加密数据…"
  );


  try {

    let result =
      null;


    /*
       乐观锁上传：带上 expectedRevision
       （本机最后一次读取到的云端版本）。

       Worker 发现云端已被其他设备更新时
       返回 409 且不写入；此时本机重新
       读取云端、自动合并（必要时弹出
       冲突窗口），再用最新版本号重试，
       最多 3 轮。
    */

    for (

      let attempt = 0;
      attempt < 3;
      attempt += 1

    ) {

      try {

        result =
          await syncFetch(
            "PUT",
            token,
            buildSyncUploadBody()
          );


        break;

      }

      catch (error) {

        if (
          error.status !== 409
          ||
          attempt === 2
        ) {

          throw error;

        }


        const resolved =
          await reconcileCloudConflict(
            token
          );


        if (!resolved) {

          writeSyncMeta({

            ...readSyncMeta(),
            dirty: true

          });


          updateSyncStatus(
            "存在需要处理的同步冲突，已暂停上传"
          );


          return false;

        }

      }

    }


    const changedDuringUpload =
      syncRevision !==
      startedRevision;


    writeSyncMeta({

      dirty:
        changedDuringUpload,

      lastSyncedAt:
        result.updatedAt
        ||
        new Date().toISOString(),

      revision:
        result.revision
        ||
        result.sha
        ||
        readSyncMeta().revision
        ||
        ""

    });


    updateSyncStatus(
      "已安全同步到 GitHub"
    );


    if (notify) {

      showToast(
        "已安全同步到 GitHub"
      );

    }


    if (changedDuringUpload) {

      scheduleCloudSync();

    }


    return true;

  }

  catch (error) {

    writeSyncMeta({

      ...readSyncMeta(),
      dirty: true

    });


    updateSyncStatus(
      error.message
      ||
      "同步失败"
    );


    if (notify) {

      throw error;

    }


    console.warn(
      "Unable to sync shortcuts",
      error
    );


    return false;

  }

  finally {

    syncInFlight =
      false;

  }

}


/*
   409 之后的合并流程：

   1. 读取云端最新数据与版本号。
   2. 云端为空 → 直接用本机数据上传。
   3. 能按稳定键 + 更新时间自动合并
      → 应用合并结果。
   4. 无法判定 → 弹出冲突窗口
      （默认选项是非破坏性的合并）。
   5. 合并结果写回本机，
      由调用方带着最新版本号重试上传。
*/

async function reconcileCloudConflict(token) {

  const cloud =
    await syncFetch(
      "GET",
      token
    );


  const hasCloudDocument =
    Array.isArray(
      cloud.customSites
    );


  if (
    !hasCloudDocument
    ||
    !cloud.revision
  ) {

    updateSyncStatus(
      "云端还没有数据，将上传本机数据"
    );


    return true;

  }


  const local =
    currentSyncDocument();


  const merged =
    TablissSyncModel.mergeSyncDocuments(
      local,
      cloud,
      {
        now:
          Date.now()
      }
    );


  let document =
    merged.document;


  if (
    merged.conflicts.length
  ) {

    const choice =
      await showSyncConflictModal(
        merged.conflicts
      );


    if (choice === "cancel") {

      return false;

    }


    document =
      TablissSyncModel.applyConflictStrategy(
        choice,
        local,
        cloud,
        {
          now:
            Date.now()
        }
      )
      .document;

  }


  applySyncedDocument(
    document
  );


  writeSyncMeta({

    ...readSyncMeta(),
    revision:
      cloud.revision

  });


  updateSyncStatus(
    "已合并双方更改，正在重新上传…"
  );


  return true;

}


async function pullCloudSync({

  token = getSyncToken(),
  notify = false

} = {}) {

  if (!token) {

    return false;

  }


  updateSyncStatus(
    "正在读取云端数据…"
  );


  try {

    const result =
      await syncFetch(
        "GET",
        token
      );


    const cloudIsV3 =
      Number(
        result.version
        ||
        1
      ) >= SITE_MODEL_VERSION;


    let document;


    if (cloudIsV3) {

      document =
        TablissSyncModel.normaliseV3Document(
          result,
          {
            now:
              Date.now()
          }
        );

    }

    else {

      /*
         旧版云端数据升级到 v3。

         云端 version=1：customSites 只含用户
         自建网站，需要并入预设。
         云端 version=2：customSites 已是统一
         管理的权威数据 —— 用户改名、改链接、
         移动分组、删除预设的结果全部原样
         保留，绝不重新并入预设。

         两种情况都只补更新时间、构建排序，
         回收站为空，绝不误判删除。
      */

      const cloudStoredVersion =
        Number(
          result.version
          ||
          1
        );


      const nextIconOverrides =
        normaliseIconOverrides(
          result.iconOverrides
        );


      if (
        cloudStoredVersion < 2
      ) {

        migrateLegacyIconOverrides(
          nextIconOverrides
        );

      }


      const upgraded =
        TablissSyncModel.upgradeCustomSitesToV3(

          cloudStoredVersion,

          result.customSites
          ||
          [],

          cloudStoredVersion < 2
            ? defaultManagedSites
            : [],

          {
            timestamp:
              result.updatedAt
              ||
              new Date().toISOString()
          }

        );


      document = {

        version:
          SITE_MODEL_VERSION,

        updatedAt:
          result.updatedAt
          ||
          new Date().toISOString(),

        customSites:
          upgraded.sites,

        iconOverrides:
          nextIconOverrides,

        groupOrder:
          upgraded.groupOrder,

        trash: []

      };

    }


    applySyncedDocument(
      document
    );


    writeSyncMeta({

      dirty:
        !cloudIsV3,

      lastSyncedAt:
        result.updatedAt
        ||
        new Date().toISOString(),

      revision:
        result.revision
        ||
        ""

    });


    if (!cloudIsV3) {

      markSyncDirty();

    }


    updateSyncStatus(
      cloudIsV3
        ? "已从云端恢复"
        : "已从云端恢复，正在升级同步数据…"
    );


    if (notify) {

      showToast(
        "已从云端恢复快捷方式"
      );

    }


    return true;

  }

  catch (error) {

    updateSyncStatus(
      error.message
      ||
      "读取云端数据失败"
    );


    if (notify) {

      throw error;

    }


    console.warn(
      "Unable to restore shortcuts",
      error
    );


    return false;

  }

}


/*
   把同步来的版本 3 文档
   完整落到本机状态。
*/

function applySyncedDocument(
  document
) {

  customSites =
    normaliseCustomSites(
      document.customSites
    );


  iconOverrides =
    normaliseIconOverrides(
      document.iconOverrides
    );


  groupOrderState =
    TablissSyncModel.normaliseGroupOrder(
      document.groupOrder
    );


  trashEntries =
    TablissSyncModel.normaliseTrashEntries(
      document.trash
    );


  if (
    !saveCustomSites()
    ||
    !saveIconOverrides()
    ||
    !saveGroupOrderState()
    ||
    !saveTrashEntries()
  ) {

    throw new Error(
      "本地存储空间不足"
    );

  }


  localStorage.setItem(
    SITE_MODEL_VERSION_KEY,
    String(
      SITE_MODEL_VERSION
    )
  );


  applyCustomSitesToRuntime(
    customSites
  );


  refreshShortcutGroups();

}


function scheduleCloudSync(
  delay = 650
) {

  clearTimeout(
    syncTimer
  );


  if (!getSyncToken()) {

    return;

  }


  syncTimer =
    setTimeout(
      () => {

        pushCloudSync();

      },
      delay
    );

}


function markSyncDirty(
  delay = 650
) {

  syncRevision += 1;


  writeSyncMeta({

    ...readSyncMeta(),
    dirty: true

  });


  scheduleCloudSync(
    delay
  );

}


async function initialiseCloudSync() {

  if (!getSyncToken()) {

    updateSyncStatus(
      "尚未在本机启用同步"
    );


    return;

  }


  const meta =
    readSyncMeta();


  if (meta.dirty) {

    /*
       本机有未上传的更改：
       先走受保护的上传。
       云端若被其他设备更新过，
       会自动合并（必要时弹冲突窗口），
       不会直接覆盖云端。
    */

    await pushCloudSync();

  }

  else {

    await pullCloudSync();

  }

}


/*
   同步冲突窗口。

   返回 "merge" | "cloud" | "local" | "cancel"。

   默认（直接回车或点主按钮）是
   “合并并保留双方更改” —— 非破坏性。
   “保留本机版本”必须先勾选
   确认复选框才会启用。
*/

function showSyncConflictModal(
  conflicts
) {

  conflictList
    .replaceChildren(

      ...conflicts.map(
        conflict => {

          const item =
            document.createElement(
              "li"
            );


          item.textContent =
            conflict.message;


          return item;

        }
      )

    );


  conflictFormError.textContent =
    "";


  conflictOverwriteConfirm.checked =
    false;


  conflictKeepLocalButton.disabled =
    true;


  conflictModal.hidden =
    false;


  requestAnimationFrame(
    () => {

      conflictMergeButton.focus();

    }
  );


  return new Promise(
    resolve => {

      let settled =
        false;


      function finish(
        choice
      ) {

        if (settled) {

          return;

        }


        settled =
          true;


        activeConflictResolver =
          null;


        closeModal(
          conflictModal
        );


        resolve(
          choice
        );

      }


      activeConflictResolver =
        finish;


      conflictForm.onsubmit =
        event => {

          event.preventDefault();


          finish(
            "merge"
          );

        };


      conflictUseCloudButton.onclick =
        () => {

          finish(
            "cloud"
          );

        };


      conflictKeepLocalButton.onclick =
        () => {

          if (
            !conflictOverwriteConfirm.checked
          ) {

            return;

          }


          finish(
            "local"
          );

        };


      conflictOverwriteConfirm.onchange =
        () => {

          conflictKeepLocalButton.disabled =
            !conflictOverwriteConfirm.checked;

        };


      conflictModal.onpointerdown =
        event => {

          if (
            event.target ===
            conflictModal
          ) {

            finish(
              "cancel"
            );

          }

        };

    }
  );

}


function closeModal(modal) {

  modal.hidden =
    true;

  if (modal === folderModal) {
    currentOpenFolderKey = null;
  }

function openModal(

) {

function normaliseShortcutUrl(value) {

  let input =
    value.trim();


  if (
    !/^[a-z][a-z\d+.-]*:/i
      .test(input)
  ) {

    input =
      `https://${input}`;

  }


  const parsed =
    new URL(input);


  if (
    parsed.protocol !== "https:"
    &&
    parsed.protocol !== "http:"
  ) {

    throw new Error(
      "只支持 HTTP 或 HTTPS 网站链接"
    );

  }


  return parsed.href;

}


function normaliseRemoteIconUrl(value) {

  const parsed =
    new URL(
      normaliseShortcutUrl(
        value
      )
    );


  if (
    parsed.protocol !== "https:"
  ) {

    throw new Error(
      "图标链接需要使用 HTTPS"
    );

  }


  return parsed.href;

}

function populateEditGroupOptions(
  selectedGroupId,
  shortcutKey
) {

  editShortcutGroupInput
    .replaceChildren();


  groups.forEach(
    group => {

      const option =
        document.createElement(
          "option"
        );


      const alreadyHere =
        group.items.includes(
          shortcutKey
        );


      option.value =
        group.id;


      option.textContent =
        group.label;


      option.disabled =
        false;


      option.selected =
        group.id ===
        selectedGroupId;


      editShortcutGroupInput
        .appendChild(
          option
        );

    }
  );

}


function openShortcutEditor(
  key,
  mode = "edit"
) {

  const entry =

    );


  if (!entry) {

      ? "移动快捷方式"
      : "编辑快捷方式";
