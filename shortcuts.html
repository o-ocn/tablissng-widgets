<meta charset="UTF-8">

<title>Shortcuts</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  background: transparent;

  font-family:
    Inter,
    "Segoe UI",
    "Microsoft YaHei",
    sans-serif;

  color: #fff;
}

body {
  user-select: none;
}


/* ==================================================
   整体布局
   ================================================== */

.app {
  width: 100%;
  height: 100%;

  display: grid;

  grid-template-columns:
    104px 1fr;

  gap: 18px;

  padding:
    10px 12px;

  overflow: hidden;
}


/* ==================================================
   左侧分组
   不再额外覆盖一层磨砂背景
   ================================================== */

.sidebar {
  height: 100%;

  padding:
    8px 5px;

  display: flex;
  flex-direction: column;

  justify-content: center;

  gap: 2px;

  background: transparent;

  border: 0;

  box-shadow: none;
}


/* ==================================================
   分组项目
   ================================================== */

.nav-item {
  width: 100%;
  height: 22px;

  appearance: none;

  border: 0;
  outline: 0;

  padding:
    0 9px;

  border-radius: 10px;

  background: transparent;

  color:
    rgba(
      255,
      255,
      255,
      0.48
    );

  /*
     先试楷体
  */
  font-family:
    "KaiTi",
    "STKaiti",
    "Kaiti SC",
    "楷体",
    serif;

  font-size: 12px;

  font-weight: 500;

  cursor: pointer;

  display: flex;

  align-items: center;

  gap: 8px;

  transition:
    background 0.18s ease,
    color 0.18s ease,
    transform 0.18s ease;
}


.nav-item:hover {
  color:
    rgba(
      255,
      255,
      255,
      0.84
    );

  background:
    rgba(
      255,
      255,
      255,
      0.035
    );
}


.nav-item.active {
  color:
    rgba(
      255,
      255,
      255,
      0.98
    );

  background:
    rgba(
      255,
      255,
      255,
      0.075
    );
}


.nav-dot {
  width: 5px;
  height: 5px;

  border-radius: 50%;

  flex: 0 0 auto;

  background:
    rgba(
      255,
      255,
      255,
      0.17
    );

  transition:
    background 0.18s ease,
    box-shadow 0.18s ease,
    transform 0.18s ease;
}


.nav-item.active
.nav-dot {
  background:
    rgba(
      255,
      255,
      255,
      0.96
    );

  box-shadow:
    0 0 8px
    rgba(
      255,
      255,
      255,
      0.38
    );

  transform:
    scale(1.18);
}


/* ==================================================
   快捷方式区域
   ================================================== */

.content {
  min-width: 0;

  height: 100%;

  display: flex;

  align-items: center;

  justify-content: center;

  overflow: hidden;
}


.grid {
  width: 100%;

  display: grid;

  grid-template-columns:
    repeat(4, minmax(0, 1fr));

  grid-auto-rows:
    88px;

  gap:
    8px 9px;

  align-content: center;
}


/* ==================================================
   分组切换动画
   ================================================== */

.grid.animate-next {
  animation:
    enterNext
    0.22s
    cubic-bezier(.2,.75,.3,1);
}


.grid.animate-prev {
  animation:
    enterPrev
    0.22s
    cubic-bezier(.2,.75,.3,1);
}


@keyframes enterNext {
  from {
    opacity: 0;
    transform:
      translateY(10px);
  }

  to {
    opacity: 1;
    transform:
      translateY(0);
  }
}


@keyframes enterPrev {
  from {
    opacity: 0;
    transform:
      translateY(-10px);
  }

  to {
    opacity: 1;
    transform:
      translateY(0);
  }
}


/* ==================================================
   单个快捷方式
   ================================================== */

.shortcut {
  min-width: 0;

  text-decoration: none;

  color: inherit;

  border-radius: 18px;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  gap: 7px;

  padding:
    7px 6px 6px;

  background:
    transparent;

  border:
    1px solid transparent;

  cursor: pointer;

  transition:
    background 0.18s ease,
    border-color 0.18s ease,
    transform 0.18s ease,
    box-shadow 0.18s ease;
}


.shortcut:hover {
  background:
    rgba(
      255,
      255,
      255,
      0.075
    );

  border-color:
    rgba(
      255,
      255,
      255,
      0.09
    );

  box-shadow:
    0 7px 20px
    rgba(
      0,
      0,
      0,
      0.09
    );

  transform:
    translateY(-2px);
}


/* ==================================================
   图标
   ================================================== */

.icon-shell {
  width: 50px;
  height: 50px;

  border-radius: 15px;

  display: flex;

  align-items: center;

  justify-content: center;

  position: relative;

  overflow: hidden;

  /*
     不再强制给每个图标铺一个明显灰底。
     网站本身有图标就直接显示。
  */

  background:
    rgba(
      255,
      255,
      255,
      0.055
    );

  border:
    1px solid
    rgba(
      255,
      255,
      255,
      0.075
    );

  box-shadow:
    0 4px 13px
    rgba(
      0,
      0,
      0,
      0.08
    );

  transition:
    transform 0.18s ease,
    background 0.18s ease;
}


.shortcut:hover
.icon-shell {
  transform:
    scale(1.055);

  background:
    rgba(
      255,
      255,
      255,
      0.09
    );
}


.icon-shell img {
  width: 38px;
  height: 38px;

  object-fit: contain;

  display: block;
}


/* 最后的文字兜底 */

.fallback {
  position: absolute;

  inset: 0;

  display: none;

  align-items: center;

  justify-content: center;

  color:
    rgba(
      255,
      255,
      255,
      0.95
    );

  font-size: 20px;

  font-weight: 650;

  background:
    rgba(
      255,
      255,
      255,
      0.08
    );
}


/* ==================================================
   名称
   ================================================== */

.shortcut-label {
  width: 100%;

  padding:
    0 3px;

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;

  text-align: center;

  font-size: 11px;

  font-weight: 500;

  color:
    rgba(
      255,
      255,
      255,
      0.90
    );

  text-shadow:
    0 1px 3px
    rgba(
      0,
      0,
      0,
      0.50
    );
}


/* ==================================================
   小屏
   ================================================== */

@media (max-width: 540px) {

  .app {
    grid-template-columns:
      90px 1fr;

    gap: 10px;

    padding:
      8px;
  }


  .grid {
    grid-template-columns:
      repeat(4, minmax(0, 1fr));

    grid-auto-rows:
      80px;

    gap: 5px;
  }


  .icon-shell {
    width: 44px;
    height: 44px;

    border-radius: 13px;
  }


  .icon-shell img {
    width: 34px;
    height: 34px;
  }


  .shortcut-label {
    font-size: 10px;
  }

}

</style>

/* ==================================================

function normaliseIcon(url) {

  if (!url) {
    return "";
  }


  if (
    url.startsWith("/")
  ) {

    return (
      "https://web.gotab.cn"
      +
      url
    );

  }


  return url;

}


function getHostname(url) {

  try {

    return (
      new URL(url).hostname
    );

  }

  catch {

    return "";

  }

}


function getOriginFavicon(url) {

  try {

    const parsed =
      new URL(url);


    /*
       GitHub Pages 是 HTTPS。
       HTTP favicon 会被浏览器作为 mixed content 拦截，
       所以只直接使用 HTTPS 网站 favicon。
    */

    if (
      parsed.protocol !==
      "https:"
    ) {

      return "";

    }


    return (
      parsed.origin
      +
      "/favicon.ico"
    );

  }

  catch {

    return "";

  }

}


function getGoogleFavicon(url) {

  return (
    "https://www.google.com/s2/favicons?sz=128&domain_url="
    +
    encodeURIComponent(url)
  );

}


function getDuckFavicon(url) {

  const host =
    getHostname(url);


  if (!host) {
    return "";
  }


  return (
    "https://icons.duckduckgo.com/ip3/"
    +
    host
    +
    ".ico"
  );

}

/* ==================================================
   DOM
   ================================================== */

const sidebar =
  document.getElementById(
    "sidebar"
  );

const grid =
  document.getElementById(
    "grid"
  );


/* ==================================================
   当前分组
   ================================================== */

let current =
  Number(
    localStorage.getItem(
      STORAGE_KEY
    )
  );


if (
  !Number.isInteger(current)
  ||
  current < 0
  ||
  current >= groups.length
) {

  current = 0;

}


/* ==================================================
   左侧菜单
   ================================================== */

function buildSidebar() {

  sidebar.innerHTML =
    "";


  groups.forEach(
    (group, index) => {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "nav-item";


      if (
        index === current
      ) {

        button.classList.add(
          "active"
        );

      }


      button.innerHTML = `
        <span class="nav-dot"></span>
        <span>${group.label}</span>
      `;


      button.addEventListener(
        "click",
        () => {

          const difference =
            index - current;


          switchGroupBy(
            difference
          );

        }
      );


      sidebar.appendChild(
        button
      );

    }
  );

}


/* ==================================================
   创建图标
   ================================================== */

function createIcon(
  site,
  img,
  fallback
) {

  const candidates = [];


  /* 1. 导出时保存的图标 */

  if (
    site.icon
  ) {

    candidates.push(
      normaliseIcon(
        site.icon
      )
    );

  }


  /* 2. 网站自己的 favicon */

  const originIcon =
    getOriginFavicon(
      site.url
    );


  if (
    originIcon
  ) {

    candidates.push(
      originIcon
    );

  }


  /* 3. Google favicon */

  candidates.push(
    getGoogleFavicon(
      site.url
    )
  );


  /* 4. DuckDuckGo favicon */

  candidates.push(
    getDuckFavicon(
      site.url
    )
  );


  let index = 0;


  function tryNext() {

    /*
       清除无效地址
    */

    while (
      index < candidates.length
      &&
      !candidates[index]
    ) {

      index++;

    }


    if (
      index >=
      candidates.length
    ) {

      img.style.display =
        "none";


      fallback.style.display =
        "flex";


      return;

    }


    img.src =
      candidates[index];


    index++;

  }


  img.onload =
    () => {

      img.style.display =
        "block";


      fallback.style.display =
        "none";

    };


  img.onerror =
    () => {

      tryNext();

    };


  tryNext();

}


/* ==================================================
   单个快捷方式
   ================================================== */

function createShortcut(
  key
) {

  const site =
    sites[key];


  if (!site) {

    return null;

  }


  const link =
    document.createElement(
      "a"
    );


  link.className =
    "shortcut";


  link.href =
    site.url;


  link.target =
    "_blank";


  link.rel =
    "noopener noreferrer";


  link.title =
    site.label;


  const iconShell =
    document.createElement(
      "div"
    );


  iconShell.className =
    "icon-shell";


  const img =
    document.createElement(
      "img"
    );


  img.alt =
    "";


  const fallback =
    document.createElement(
      "span"
    );


  fallback.className =
    "fallback";


  fallback.textContent =
    site.label
      ?.trim()
      ?.charAt(0)
      ||
      "?";


  iconShell.appendChild(
    img
  );


  iconShell.appendChild(
    fallback
  );


  const label =
    document.createElement(
      "div"
    );


  label.className =
    "shortcut-label";


  label.textContent =
    site.label;


  link.appendChild(
    iconShell
  );


  link.appendChild(
    label
  );


  createIcon(
    site,
    img,
    fallback
  );


  return link;

}


/* ==================================================
   渲染当前分组
   ================================================== */

function renderGroup(
  direction = 1
) {

  const group =
    groups[current];


  grid.classList.remove(
    "animate-next",
    "animate-prev"
  );


  grid.innerHTML =
    "";


  group.items.forEach(
    key => {

      const element =
        createShortcut(
          key
        );


      if (
        element
      ) {

        grid.appendChild(
          element
        );

      }

    }
  );


  void grid.offsetWidth;


  grid.classList.add(
    direction >= 0
      ? "animate-next"
      : "animate-prev"
  );


  buildSidebar();


  localStorage.setItem(
    STORAGE_KEY,
    String(current)
  );

}


/* ==================================================
   循环索引
   ================================================== */

function wrapIndex(
  index
) {

  const count =
    groups.length;


  return (
    (
      index % count
    )
    +
    count
  )
  %
  count;

}


/* ==================================================
   一次可以跨多个分组
   ================================================== */

function switchGroupBy(
  steps
) {

  if (
    !steps
  ) {

    return;

  }


  const direction =
    steps > 0
      ? 1
      : -1;


  current =
    wrapIndex(
      current + steps
    );


  renderGroup(
    direction
  );

}


/* ==================================================
   新滚轮逻辑

   慢滚：
   每达到一个阈值切一组

   快滚：
   可以一次跨多个分组

   不再使用 380ms 整体锁定
   ================================================== */

let wheelAccumulator = 0;

let wheelResetTimer = null;


/*
   数字越小越灵敏。
   目前 70 比之前明显跟手。
*/

const WHEEL_THRESHOLD = 70;


/*
   单个 wheel 事件最多跨 4 组，
   防止某些高灵敏鼠标瞬间跳完整圈。
*/

const MAX_STEPS_PER_EVENT = 4;


document.addEventListener(

  "wheel",

  event => {

    event.preventDefault();


    wheelAccumulator +=
      event.deltaY;


    let steps =
      Math.trunc(
        wheelAccumulator
        /
        WHEEL_THRESHOLD
      );


    if (
      steps === 0
    ) {

      clearTimeout(
        wheelResetTimer
      );


      wheelResetTimer =
        setTimeout(
          () => {

            wheelAccumulator =
              0;

          },

          120
        );


      return;

    }


    steps =
      Math.max(
        -MAX_STEPS_PER_EVENT,
        Math.min(
          MAX_STEPS_PER_EVENT,
          steps
        )
      );


    wheelAccumulator -=
      steps
      *
      WHEEL_THRESHOLD;


    switchGroupBy(
      steps
    );


    clearTimeout(
      wheelResetTimer
    );


    wheelResetTimer =
      setTimeout(
        () => {

          wheelAccumulator =
            0;

        },

        120
      );

  },

  {
    passive: false
  }

);


/* ==================================================
   键盘
   ================================================== */

document.addEventListener(

  "keydown",

  event => {

    if (
      event.key ===
      "ArrowDown"
    ) {

      switchGroupBy(1);

    }


    if (
      event.key ===
      "ArrowUp"
    ) {

      switchGroupBy(-1);

    }

  }

);


/* ==================================================
   初始化
   ================================================== */

renderGroup(1);

</script>
