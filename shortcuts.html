<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shortcuts</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Text",
    "SF Pro Display",
    "PingFang SC",
    "Segoe UI",
    "Microsoft YaHei",
    sans-serif;

  color: #fff;
}

body {
  user-select: none;
}


/* ========================================
   整体布局
   ======================================== */

.app {
  width: 100%;
  height: 100%;

  display: grid;
  grid-template-columns: 100px 1fr;

  gap: 16px;

  padding: 8px 10px;

  overflow: hidden;
}


/* ========================================
   左侧分组
   完全透明，不再有单独蒙版
   ======================================== */

.sidebar {
  height: 100%;

  display: flex;
  flex-direction: column;
  justify-content: center;

  gap: 2px;

  padding: 6px 3px;

  background: transparent;
  border: 0;
  box-shadow: none;
}


/* ========================================
   分组按钮
   ======================================== */

.nav-item {
  width: 100%;
  height: 22px;

  appearance: none;

  border: 0;
  outline: 0;

  padding: 0 8px;

  background: transparent;

  color:
    rgba(
      255,
      255,
      255,
      0.46
    );

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Text",
    "PingFang SC",
    "Segoe UI",
    "Microsoft YaHei",
    sans-serif;

  font-size: 11px;
  font-weight: 500;

  letter-spacing: 0.1px;

  cursor: pointer;

  display: flex;
  align-items: center;

  gap: 8px;

  text-align: left;

  transition:
    color 0.16s ease,
    transform 0.16s ease;
}


.nav-item:hover {
  color:
    rgba(
      255,
      255,
      255,
      0.78
    );
}


.nav-item.active {
  color:
    rgba(
      255,
      255,
      255,
      0.98
    );

  font-weight: 600;
}


/* ========================================
   分组左侧圆点
   ======================================== */

.nav-dot {
  width: 5px;
  height: 5px;

  flex: 0 0 auto;

  border-radius: 50%;

  background:
    rgba(
      255,
      255,
      255,
      0.20
    );

  transition:
    background 0.16s ease,
    box-shadow 0.16s ease,
    transform 0.16s ease;
}


/* Apple System Blue */

.nav-item.active
.nav-dot {
  background: #0A84FF;

  box-shadow:
    0 0 7px
    rgba(
      10,
      132,
      255,
      0.65
    );

  transform: scale(1.25);
}


/* ========================================
   右侧内容区域
   ======================================== */

.content {
  position: relative;

  width: 100%;
  height: 100%;

  min-width: 0;

  overflow: hidden;
}


/* ========================================
   每个分组都一直存在
   只切换显示状态

   这样切回来时：
   图片节点不会重新创建
   ======================================== */

.group-grid {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  display: grid;

  grid-template-columns:
    repeat(4, minmax(0, 1fr));

  grid-auto-rows: 88px;

  gap:
    8px 9px;

  align-content: center;

  opacity: 0;

  visibility: hidden;

  pointer-events: none;

  transform:
    translateY(10px);

  transition:
    opacity 0.20s ease,
    transform 0.22s
    cubic-bezier(.2,.75,.3,1),
    visibility 0.20s;
}


.group-grid.active {
  opacity: 1;

  visibility: visible;

  pointer-events: auto;

  transform:
    translateY(0);
}


.group-grid.from-top {
  transform:
    translateY(-10px);
}


.group-grid.active.from-top {
  transform:
    translateY(0);
}


/* ========================================
   单个快捷方式
   ======================================== */

.shortcut {
  min-width: 0;

  color: inherit;

  text-decoration: none;

  border-radius: 17px;

  padding:
    7px 5px 6px;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  gap: 7px;

  background: transparent;

  border:
    1px solid
    transparent;

  cursor: pointer;

  transition:
    background 0.16s ease,
    border-color 0.16s ease,
    transform 0.16s ease,
    box-shadow 0.16s ease;
}


.shortcut:hover {
  background:
    rgba(
      255,
      255,
      255,
      0.07
    );

  border-color:
    rgba(
      255,
      255,
      255,
      0.08
    );

  transform:
    translateY(-2px);

  box-shadow:
    0 6px 18px
    rgba(
      0,
      0,
      0,
      0.08
    );
}


/* ========================================
   图标
   ======================================== */

.icon-shell {
  width: 50px;
  height: 50px;

  position: relative;

  display: flex;

  align-items: center;
  justify-content: center;

  overflow: hidden;

  border-radius: 15px;

  background:
    rgba(
      255,
      255,
      255,
      0.065
    );

  border:
    1px solid
    rgba(
      255,
      255,
      255,
      0.08
    );

  box-shadow:
    0 4px 13px
    rgba(
      0,
      0,
      0,
      0.07
    );

  transition:
    transform 0.16s ease,
    background 0.16s ease;
}


.shortcut:hover
.icon-shell {
  transform:
    scale(1.055);

  background:
    rgba(
      255,
      255,
      255,
      0.095
    );
}


.icon-shell img {
  width: 39px;
  height: 39px;

  display: block;

  object-fit: contain;
}


/* ========================================
   图标全部失败时才显示文字
   ======================================== */

.fallback {
  position: absolute;

  inset: 0;

  display: none;

  align-items: center;
  justify-content: center;

  color:
    rgba(
      255,
      255,
      255,
      0.95
    );

  font-size: 19px;

  font-weight: 650;
}


/* ========================================
   快捷方式名称
   ======================================== */

.shortcut-label {
  width: 100%;

  padding:
    0 3px;

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;

  text-align: center;

  font-size: 11px;

  font-weight: 500;

  color:
    rgba(
      255,
      255,
      255,
      0.90
    );

  text-shadow:
    0 1px 3px
    rgba(
      0,
      0,
      0,
      0.50
    );
}

</style>
</head>

<div class="app">

  <nav

  <main

<script>

/* ========================================
   保存键
   ======================================== */

const GROUP_STORAGE_KEY =
  "tabliss-shortcuts-group-v3";


/*
   这里已经预留给以后
   “本地上传自定义图标”
   使用。

   后面可以做成：

   右键快捷方式
   → 更换图标
   → 选择本地图片
   → 保存
*/

const ICON_OVERRIDE_KEY =
  "tabliss-shortcuts-icon-overrides-v1";


/*
   已验证图标地址的持久缓存。

   图标文件本身继续交给浏览器 HTTP 缓存；
   localStorage 只记录最终可用地址，
   避免每次刷新都重新探测多组 favicon。
*/

const ICON_CACHE_STORAGE_KEY =
  "tabliss-shortcuts-resolved-icons-v1";


/* ========================================
   自定义图标覆盖
   ======================================== */

let iconOverrides = {};


try {

  iconOverrides =
    JSON.parse(
      localStorage.getItem(
        ICON_OVERRIDE_KEY
      )
      ||
      "{}"
    );

}

catch {

  iconOverrides = {};

}


/* ========================================
   图标两级缓存

   第一层：当前页面的 Map
   第二层：localStorage
   ======================================== */

const iconResolutionCache =
  new Map();


let storedIconCache = {};


try {

  const parsed =
    JSON.parse(
      localStorage.getItem(
        ICON_CACHE_STORAGE_KEY
      )
      ||
      "{}"
    );


  if (
    parsed
    &&
    typeof parsed === "object"
    &&
    !Array.isArray(parsed)
  ) {

    storedIconCache =
      parsed;

  }

}

catch {

  storedIconCache = {};

}


function iconCacheSignature(
  key,
  site
) {

  return JSON.stringify([

    iconOverrides[key]
      || "",

    site.customIcon
      || "",

    site.icon
      || "",

    site.url
      || ""

  ]);

}


function getStoredIcon(
  key,
  site
) {

  const entry =
    storedIconCache[key];


  if (
    !entry
    ||
    typeof entry.src !== "string"
    ||
    entry.signature !==
      iconCacheSignature(
        key,
        site
      )
  ) {

    return "";

  }


  return entry.src;

}


function saveStoredIcon(
  key,
  site,
  src
) {

  if (!src) {
    return;
  }


  /*
     data URL 已由 iconOverrides 持久保存，
     这里不重复存一份，避免占用双倍空间。
  */

  if (
    src.startsWith("data:")
    ||
    src.startsWith("blob:")
  ) {

    return;

  }


  storedIconCache[key] = {

    src,

    signature:
      iconCacheSignature(
        key,
        site
      )

  };


  try {

    localStorage.setItem(
      ICON_CACHE_STORAGE_KEY,
      JSON.stringify(
        storedIconCache
      )
    );

  }

  catch (error) {

    console.warn(
      "Unable to save icon cache",
      error
    );

  }

}


function clearStoredIcon(key) {

  iconResolutionCache.delete(
    key
  );


  if (
    !Object.prototype
      .hasOwnProperty.call(
        storedIconCache,
        key
      )
  ) {

    return;

  }


  delete storedIconCache[key];


  try {

    localStorage.setItem(
      ICON_CACHE_STORAGE_KEY,
      JSON.stringify(
        storedIconCache
      )
    );

  }

  catch (error) {

    console.warn(
      "Unable to update icon cache",
      error
    );

  }

}


function getHostname(url) {

  try {

    return (
      new URL(url).hostname
    );

  }

  catch {

    return "";

  }

}


function normaliseIcon(url) {

  if (!url) {
    return "";
  }


  if (
    url.startsWith("/")
  ) {

    return (
      "https://web.gotab.cn"
      +
      url
    );

  }


  return url;

}


function ownFavicon(url) {

  try {

    const parsed =
      new URL(url);


    if (
      parsed.protocol !==
      "https:"
    ) {

      return "";

    }


    return (
      parsed.origin
      +
      "/favicon.ico"
    );

  }

  catch {

    return "";

  }

}


function googleFavicon(url) {

  return (
    "https://www.google.com/s2/favicons?sz=128&domain_url="
    +
    encodeURIComponent(url)
  );

}


function duckFavicon(url) {

  const hostname =
    getHostname(url);


  if (!hostname) {
    return "";
  }


  return (
    "https://icons.duckduckgo.com/ip3/"
    +
    hostname
    +
    ".ico"
  );

}


/* ========================================
   检查一个图标是否可以加载
   ======================================== */

function probeImage(url) {

  return new Promise(
    resolve => {

      if (!url) {

        resolve(false);

        return;

      }


      const img =
        new Image();


      img.onload =
        () => {

          resolve(true);

        };


      img.onerror =
        () => {

          resolve(false);

        };


      img.src =
        url;

    }
  );

}


/* ========================================
   解析网站图标

   优先级：

   1 自定义本地图标
   2 我们指定的图标
   3 网站 favicon
   4 Google favicon
   5 DuckDuckGo favicon
   ======================================== */

function resolveIcon(
  key,
  site,
  forceRefresh = false
) {

  if (
    !forceRefresh
    &&
    iconResolutionCache
      .has(key)
  ) {

    return (
      iconResolutionCache
        .get(key)
    );

  }


  if (!forceRefresh) {

    const storedIcon =
      getStoredIcon(
        key,
        site
      );


    if (storedIcon) {

      const cachedPromise =
        Promise.resolve(
          storedIcon
        );


      iconResolutionCache.set(
        key,
        cachedPromise
      );


      return cachedPromise;

    }

  }


  const promise =
    (async () => {

      const candidates =
        [...new Set([

        iconOverrides[key]
          || "",

        normaliseIcon(
          site.customIcon
        ),

        normaliseIcon(
          site.icon
        ),

        ownFavicon(
          site.url
        ),

        googleFavicon(
          site.url
        ),

        duckFavicon(
          site.url
        )

      ])];


      for (
        const candidate
        of candidates
      ) {

        if (!candidate) {
          continue;
        }


        const success =
          await probeImage(
            candidate
          );


        if (success) {

          saveStoredIcon(
            key,
            site,
            candidate
          );


          return candidate;

        }

      }


      return "";

    })();


  iconResolutionCache.set(
    key,
    promise
  );


  return promise;

}

/* ========================================
   创建快捷方式
   ======================================== */

function createShortcut(
  key
) {

  const site =
    sites[key];


  if (!site) {

    return null;

  }


  const link =
    document.createElement(
      "a"
    );


  link.className =
    "shortcut";


  link.href =
    site.url;


  link.target =
    "_blank";


  link.rel =
    "noopener noreferrer";


  link.title =
    site.label;


  const shell =
    document.createElement(
      "div"
    );


  shell.className =
    "icon-shell";


  const img =
    document.createElement(
      "img"
    );


  img.alt =
    "";


  const fallback =
    document.createElement(
      "span"
    );


  fallback.className =
    "fallback";


  fallback.textContent =
    site.label
      .trim()
      .charAt(0);


  function showIcon(icon) {

    img.src =
      icon;


    img.style.display =
      "block";


    fallback.style.display =
      "none";

  }


  function showFallback() {

    img.style.display =
      "none";


    fallback.style.display =
      "flex";

  }


  const storedIcon =
    getStoredIcon(
      key,
      site
    );


  if (storedIcon) {

    showIcon(
      storedIcon
    );

  }

  else {

    showFallback();

  }


  let retriedAfterError =
    false;


  img.addEventListener(
    "error",
    () => {

      if (retriedAfterError) {

        showFallback();

        return;

      }


      retriedAfterError =
        true;


      showFallback();


      clearStoredIcon(
        key
      );


      resolveIcon(
        key,
        site,
        true
      )
      .then(
        icon => {

          if (icon) {

            showIcon(
              icon
            );

          }

        }
      );

    }
  );


  shell.appendChild(
    img
  );


  shell.appendChild(
    fallback
  );


  const label =
    document.createElement(
      "div"
    );


  label.className =
    "shortcut-label";


  label.textContent =
    site.label;


  link.appendChild(
    shell
  );


  link.appendChild(
    label
  );


  /*
     每个网站图标只解析一次。

     同一个 Outlook 即使同时存在：
     主页 + 邮箱

     resolveIcon 也只真正执行一次。
  */

  resolveIcon(
    key,
    site
  )
  .then(
    icon => {

      if (icon) {

        showIcon(
          icon
        );

      }

      else {

        showFallback();

      }

    }
  );


  return link;

}


/* ========================================
   启动时一次性创建全部分组

   后面滚轮切换时不再重建。
   ======================================== */

function buildAllGroups() {

  content.innerHTML =
    "";


  groups.forEach(
    group => {

      const grid =
        document.createElement(
          "div"
        );


      grid.className =
        "group-grid";


      grid.dataset.group =
        group.id;


      group.items.forEach(
        key => {

          const shortcut =
            createShortcut(
              key
            );


          if (shortcut) {

            grid.appendChild(
              shortcut
            );

          }

        }
      );


      content.appendChild(
        grid
      );


      groupElements.set(
        group.id,
        grid
      );

    }
  );

}

  );

}


/* ========================================
   获取当前索引
   ======================================== */

function currentIndex() {

  return groups.findIndex(
    group =>
      group.id ===
      currentId
  );

}


/* ========================================
   循环索引
   ======================================== */

function wrapIndex(
  value
) {

  const count =
    groups.length;


  return (
    (
      value % count
    )
    +
    count
  )
  %
  count;

}


/* ========================================
   激活分组

   不重建 DOM，
   只切 active。
   ======================================== */

function activateGroup(
  id,
  direction = 1
) {

  if (
    id === currentId
  ) {

    updateNav();

    const same =
      groupElements.get(id);


    if (same) {

      same.classList.add(
        "active"
      );

    }


    return;

  }


  const old =
    groupElements.get(
      currentId
    );


  const next =
    groupElements.get(
      id
    );


  if (old) {

    old.classList.remove(
      "active",
      "from-top"
    );

  }


  currentId =
    id;


  if (next) {

    next.classList.toggle(
      "from-top",
      direction < 0
    );


    next.classList.add(
      "active"
    );

  }


  updateNav();


  localStorage.setItem(
    GROUP_STORAGE_KEY,
    currentId
  );

}


/* ========================================
   更新左侧状态
   ======================================== */

function updateNav() {

  document
    .querySelectorAll(
      ".nav-item"
    )
    .forEach(
      item => {

        item.classList.toggle(
          "active",
          item.dataset.group
          ===
          currentId
        );

      }
    );

}


/* ========================================
   按数量切换分组
   ======================================== */

function moveGroups(
  steps
) {

  if (!steps) {
    return;
  }


  const oldIndex =
    currentIndex();


  const nextIndex =
    wrapIndex(
      oldIndex + steps
    );


  activateGroup(
    groups[nextIndex].id,
    steps
  );

}


/* ========================================
   鼠标滚轮

   滚得越快 / 越远，
   一次可切越多组。

   完全取消之前的锁定等待。
   ======================================== */

let wheelAccumulator =
  0;


let resetTimer =
  null;


/*
   越小越灵敏。

   普通鼠标滚一格一般约 100px，
   所以 65 会比较跟手。
*/

const WHEEL_THRESHOLD =
  65;


/*
   一次极大的滚动事件
   最多跨 6 个组。
*/

const MAX_STEPS =
  6;


function normaliseWheel(
  event
) {

  let delta =
    event.deltaY;


  /*
     deltaMode:
     0 = pixel
     1 = line
     2 = page
  */

  if (
    event.deltaMode === 1
  ) {

    delta *= 16;

  }


  else if (
    event.deltaMode === 2
  ) {

    delta *= 300;

  }


  return delta;

}


document.addEventListener(

  "wheel",

  event => {

    event.preventDefault();


    wheelAccumulator +=
      normaliseWheel(
        event
      );


    let steps =
      Math.trunc(
        wheelAccumulator
        /
        WHEEL_THRESHOLD
      );


    if (!steps) {

      clearTimeout(
        resetTimer
      );


      resetTimer =
        setTimeout(
          () => {

            wheelAccumulator =
              0;

          },
          90
        );


      return;

    }


    steps =
      Math.max(
        -MAX_STEPS,
        Math.min(
          MAX_STEPS,
          steps
        )
      );


    wheelAccumulator -=
      steps
      *
      WHEEL_THRESHOLD;


    moveGroups(
      steps
    );


    clearTimeout(
      resetTimer
    );


    resetTimer =
      setTimeout(
        () => {

          wheelAccumulator =
            0;

        },
        90
      );

  },

  {
    passive: false
  }

);


/* ========================================
   上下方向键
   ======================================== */

document.addEventListener(

  "keydown",

  event => {

    if (
      event.key ===
      "ArrowDown"
    ) {

      moveGroups(1);

    }


    if (
      event.key ===
      "ArrowUp"
    ) {

      moveGroups(-1);

    }

  }

);

  initial.classList.add(
    "active"
  );

}
