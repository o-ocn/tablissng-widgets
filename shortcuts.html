    editModal,
    mode === "move"
      ? editShortcutGroupInput
      : editShortcutNameInput
  );

}


function undoDeletedShortcut() {

  const pending =
    pendingDeletedShortcut;


  if (!pending) {
    return;
  }


  pendingDeletedShortcut =
    null;


  /*
     5 秒内撤销：把刚记录的
     墓碑一并移除，就像从未删除过。
  */

  dropTrashEntry(
    pending.entry.key
  );


  customSites.splice(
    Math.min(
      pending.index,
      customSites.length
    ),
    0,
    pending.entry
  );


  if (pending.hadIconOverride) {

    iconOverrides[
      pending.entry.key
    ] = pending.iconOverride;

  }


  saveCustomSites();
  saveIconOverrides();


  applyCustomSitesToRuntime(
    customSites
  );


  touchGroupOrder(
    pending.entry.groupId,
    true
  );


  markSyncDirty();


  refreshShortcutGroups();


  showToast(
    "已恢复快捷方式"
  );

}


function deleteCustomShortcut(key) {

  const index =
    customSites.findIndex(
      entry =>
        entry.key === key
    );


  if (index < 0) {

    showToast(
      "没有找到要删除的快捷方式"
    );


    return;

  }


  const entry = {
    ...customSites[index]
  };


  const sourceGroup =
    groups.find(
      group =>
        group.items.includes(
          key
        )
    );


  const indexInGroup =
    sourceGroup
      ? sourceGroup.items.indexOf(
          key
        )
      : 0;


  const hadIconOverride =
    Object.prototype
      .hasOwnProperty.call(
        iconOverrides,
        key
      );


  const iconOverride =
    iconOverrides[key];


  customSites.splice(
    index,
    1
  );


  if (hadIconOverride) {

    delete iconOverrides[key];

  }


  if (
    !saveCustomSites()
    ||
    !saveIconOverrides()
  ) {

    customSites.splice(
      index,
      0,
      entry
    );


    if (hadIconOverride) {

      iconOverrides[key] =
        iconOverride;

    }


    saveCustomSites();
    saveIconOverrides();


    showToast(
      "删除失败：本地存储空间不足"
    );


    return;

  }


  clearStoredIcon(
    key
  );


  applyCustomSitesToRuntime(
    customSites
  );


  touchGroupOrder(
    entry.groupId,
    true
  );


  /*
     删除立即写入墓碑（回收站）。
     5 秒内撤销会把它一并移除；
     超时后墓碑随下次同步上传，
     其他设备就不会把该网站
     重新同步回来。
  */

  recordDeletedSite(
    entry,
    indexInGroup
  );


  refreshShortcutGroups();


  pendingDeletedShortcut = {

    entry,
    index,
    hadIconOverride,
    iconOverride

  };


  markSyncDirty(
    5400
  );


  showActionToast({

    message:
      `已删除「${entry.label}」`,

    actionLabel:
      "撤销",

    onAction:
      undoDeletedShortcut,

    duration:
      5000,

    onExpire: () => {

      pendingDeletedShortcut =
        null;

    }

  });

}


function applyIconOverride(
  key,
  value
) {

  const previous =
    iconOverrides[key];


  iconOverrides[key] =
    value;


  clearStoredIcon(
    key
  );


  if (!saveIconOverrides()) {

    if (previous) {

      iconOverrides[key] =
        previous;

    }

    else {

      delete iconOverrides[key];

    }


    showToast(
      "保存失败：本地存储空间不足"
    );


    return false;

  }


  /*
     图标也是网站内容的一部分：
     更新对应站点的更新时间，
     合并时才能按时间判定
     哪台设备的图标更新。
  */

  const entry =
    touchSiteEntry(
      key
    );


  if (entry) {

    saveCustomSites();

  }


  markSyncDirty();


  refreshShortcutGroups();


  return true;

}


function resetIconOverride(key) {

  if (!iconOverrides[key]) {

    showToast(
      "当前已经是自动图标"
    );


    return;

  }


  delete iconOverrides[key];


  clearStoredIcon(
    key
  );


  saveIconOverrides();


  const entry =
    touchSiteEntry(
      key
    );


  if (entry) {

    saveCustomSites();

  }


  markSyncDirty();


  refreshShortcutGroups();


  showToast(
    "已恢复自动图标"
  );

}


function readLocalIcon(file) {

  return new Promise(
    (resolve, reject) => {

      if (
        !file.type.startsWith(
          "image/"
        )
      ) {

        reject(
          new Error(
            "请选择图片文件"
          )
        );


        return;

      }


      if (
        file.size >
        5 * 1024 * 1024
      ) {

        reject(
          new Error(
            "图片不能超过 5 MB"
          )
        );


        return;

      }


      const reader =
        new FileReader();


      reader.onerror =
        () => {

          reject(
            new Error(
              "读取图片失败"
            )
          );

        };


      reader.onload =
        () => {

          const image =
            new Image();


          image.onerror =
            () => {

              reject(
                new Error(
                  "无法识别这张图片"
                )
              );

            };


          image.onload =
            () => {

              const maxSide =
                256;


              const scale =
                Math.min(
                  1,
                  maxSide
                  /
                  Math.max(
                    image.naturalWidth,
                    image.naturalHeight
                  )
                );


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                Math.max(
                  1,
                  Math.round(
                    image.naturalWidth
                    *
                    scale
                  )
                );


              canvas.height =
                Math.max(
                  1,
                  Math.round(
                    image.naturalHeight
                    *
                    scale
                  )
                );


              const context =
                canvas.getContext(
                  "2d"
                );


              context.drawImage(
                image,
                0,
                0,
                canvas.width,
                canvas.height
              );


              resolve(
                canvas.toDataURL(
                  "image/webp",
                  0.90
                )
              );

            };


          image.src =
            reader.result;

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}


function verifyRemoteIcon(url) {

  return new Promise(
    (resolve, reject) => {

      const image =
        new Image();


      const timer =
        setTimeout(
          () => {

            image.src =
              "";


            reject(
              new Error(
                "图标加载超时，请检查图片直链"
              )
            );

          },
          8000
        );


      image.onload =
        () => {

          clearTimeout(
            timer
          );


          resolve(url);

        };


      image.onerror =
        () => {

          clearTimeout(
            timer
          );


          reject(
            new Error(
              "这个链接没有返回可用图片"
            )
          );

        };


      image.referrerPolicy =
        "no-referrer";


      image.src =
        url;

    }
  );

}


/* ========================================
   创建快捷方式
   ======================================== */

function createShortcut(
  key
) {

  const site =
    sites[key];


  if (!site) {

    return null;

  }


  const link =
    document.createElement(
      "a"
    );


  link.className =
    "shortcut";


  link.href =
    site.url;


  link.target =
    "_blank";


  link.rel =
    "noopener noreferrer";


  link.title =
    site.label;


  link.dataset.siteKey =
    key;


  link.addEventListener(
    "contextmenu",
    event => {

      event.preventDefault();
      event.stopPropagation();


      selectedShortcutKey =
        key;


      updateShortcutMenu(
        key
      );


      openContextMenu(
        shortcutMenu,
        event.clientX,
        event.clientY
      );

    }
  );


  /*
     拖动排序（同一分组内）。

     拖动由 dragstart/dragover/drop 驱动，
     全程不会触发点击跳转；
     拖动结束后的一瞬间，
     兜底拦截一次 click。
  */

  if (dragReorderSupported) {

    link.draggable =
      true;


    link.addEventListener(
      "dragstart",
      event => {

        dragShortcutKey =
          key;


        dragSourceGroupId =
          link.closest(".group-grid")?.dataset.group
          ||
          "";


        if (event.dataTransfer) {

          event.dataTransfer.effectAllowed =
            "move";


          event.dataTransfer.setData(
            "text/plain",
            key
          );

        }


        link.classList.add(
          "dragging"
        );

      }
    );


    link.addEventListener(
      "dragend",
      () => {

        dragJustEnded =
          true;


        link.classList.remove(
          "dragging"
        );


        clearDropIndicator();


        dragShortcutKey =
          "";


        dragSourceGroupId =
          "";


        setTimeout(
          () => {

            dragJustEnded =
              false;

          },
          0
        );

      }
    );

  }


  const shell =
    document.createElement(
      "div"
    );


  shell.className =
    "icon-shell";


  const img =
    document.createElement(
      "img"
    );


  img.alt =
    "";


  const fallback =
    document.createElement(
      "span"
    );


  fallback.className =
    "fallback";


  fallback.textContent =
    site.label
      .trim()
      .charAt(0);


  function showIcon(icon) {

    img.src =
      icon;


    img.style.display =
      "block";


    fallback.style.display =
      "none";

  }


  function showFallback() {

    img.style.display =
      "none";


    fallback.style.display =
      "flex";

  }


  const storedIcon =
    getStoredIcon(
      key,
      site
    );


  if (storedIcon) {

    showIcon(
      storedIcon
    );

  }

  else {

    showFallback();

  }


  let retriedAfterError =
    false;


  img.addEventListener(
    "error",
    () => {

      if (retriedAfterError) {

        showFallback();

        return;

      }


      retriedAfterError =
        true;


      showFallback();


      clearStoredIcon(
        key
      );


      resolveIcon(
        key,
        site,
        true
      )
      .then(
        icon => {

          if (icon) {

            showIcon(
              icon
            );

          }

        }
      );

    }
  );


  shell.appendChild(
    img
  );


  shell.appendChild(
    fallback
  );


  const label =
    document.createElement(
      "div"
    );


  label.className =
    "shortcut-label";


  label.textContent =
    site.label;


  link.appendChild(
    shell
  );


  link.appendChild(
    label
  );


  /*
     每个网站图标只解析一次。

     同一个 Outlook 即使同时存在：
     主页 + 邮箱

     resolveIcon 也只真正执行一次。
  */

  resolveIcon(
    key,
    site
  )
  .then(
    icon => {

      if (icon) {

        showIcon(
          icon
        );

      }

      else {

        showFallback();

      }

    }
  );


  return link;

}


/* ========================================
   启动时一次性创建全部分组

   后面滚轮切换时不再重建。
   ======================================== */

function buildAllGroups() {

  content.innerHTML =
    "";


  groups.forEach(
    group => {

      const grid =
        document.createElement(
          "div"
        );


      grid.className =
        "group-grid";


      grid.dataset.group =
        group.id;


      group.items.forEach(
        key => {

          const shortcut =
            createShortcut(
              key
            );


          if (shortcut) {

            grid.appendChild(
              shortcut
            );

          }

        }
      );


      content.appendChild(
        grid
      );


      groupElements.set(
        group.id,
        grid
      );

    }
  );

}


/*
   只重建一个分组的网格，
   拖动结束后按新的稳定键顺序
   重新渲染，图标走内存缓存，
   不会闪烁。
*/

function rebuildGroupGrid(
  groupId
) {

  const grid =
    groupElements.get(
      groupId
    );


  const group =
    groups.find(
      item =>
        item.id ===
        groupId
    );


  if (!grid || !group) {

    return;

  }


  grid.replaceChildren();


  group.items.forEach(
    key => {

      const shortcut =
        createShortcut(
          key
        );


      if (shortcut) {

        grid.appendChild(
          shortcut
        );

      }

    }
  );

}


/* ========================================
   拖动排序事件

   只允许在同一分组内拖动。
   放置位置提示是目标卡片
   左/右边缘的一根细蓝条。
   ======================================== */

function clearDropIndicator() {

  if (dropIndicatorElement) {

    dropIndicatorElement.classList.remove(
      "drop-before",
      "drop-after"
    );

  }


  dropIndicatorElement =
    null;


  dropIndicatorSide =
    "";

}


function setDropIndicator(
  element,
  side
) {

  if (
    dropIndicatorElement ===
      element
    &&
    dropIndicatorSide ===
      side
  ) {

    return;

  }


  clearDropIndicator();


  dropIndicatorElement =
    element;


  dropIndicatorSide =
    side;


  element.classList.add(
    side === "before"
      ? "drop-before"
      : "drop-after"
  );

}


if (dragReorderSupported) {

  content.addEventListener(
    "dragover",
    event => {

      if (!dragShortcutKey) {

        return;

      }


      const grid =
        event.target.closest(
          ".group-grid"
        );


      if (
        !grid
        ||
        grid.dataset.group !==
          dragSourceGroupId
      ) {

        clearDropIndicator();

        return;

      }


      event.preventDefault();


      event.dataTransfer.dropEffect =
        "move";


      const target =
        event.target.closest(
          ".shortcut"
        );


      if (
        !target
        ||
        target.dataset.siteKey ===
          dragShortcutKey
      ) {

        clearDropIndicator();

        return;

      }


      const rect =
        target.getBoundingClientRect();


      setDropIndicator(
        target,
        event.clientX >
          rect.left + rect.width / 2
          ? "after"
          : "before"
      );

    }
  );


  content.addEventListener(
    "drop",
    event => {

      if (!dragShortcutKey) {

        return;

      }


      const grid =
        event.target.closest(
          ".group-grid"
        );


      clearDropIndicator();


      if (
        !grid
        ||
        grid.dataset.group !==
          dragSourceGroupId
      ) {

        return;

      }


      event.preventDefault();


      const group =
        groups.find(
          item =>
            item.id ===
            dragSourceGroupId
        );


      const target =
        event.target.closest(
          ".shortcut"
        );


      const key =
        dragShortcutKey;


      if (
        !group
        ||
        !target
        ||
        target.dataset.siteKey ===
          key
      ) {

        return;

      }


      const targetKey =
        target.dataset.siteKey;


      const items =
        group.items.filter(
          item =>
            item !==
            key
        );


      const targetIndex =
        items.indexOf(
          targetKey
        );


      if (targetIndex < 0) {

        return;

      }


      const rect =
        target.getBoundingClientRect();


      const insertAfter =
        event.clientX >
        rect.left + rect.width / 2;


      items.splice(
        insertAfter
          ? targetIndex + 1
          : targetIndex,
        0,
        key
      );


      group.items =
        items;


      /*
         排序按稳定键写入 groupOrder，
         只更新这一组的排序时间，
         然后走受保护的自动同步。
      */

      touchGroupOrder(
        group.id,
        true
      );


      markSyncDirty();


      rebuildGroupGrid(
        group.id
      );

    }
  );


  content.addEventListener(
    "dragleave",
    event => {

      const grid =
        event.target.closest(
          ".group-grid"
        );


      if (
        grid
        &&
        (
          !event.relatedTarget
          ||
          !grid.contains(
            event.relatedTarget
          )
        )
      ) {

        clearDropIndicator();

      }

    }
  );


  /*
     拖动结束后的第一次 click
     一律拦截，确保不会误触跳转。
  */

  document.addEventListener(
    "click",
    event => {

      if (!dragJustEnded) {

        return;

      }


      event.preventDefault();
      event.stopPropagation();

    },
    true
  );

}


/* ========================================
   左侧菜单
   ======================================== */

function buildSidebar() {

  sidebar.innerHTML =
    "";


  groups.forEach(
    group => {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "nav-item";


      button.dataset.group =
        group.id;


      button.innerHTML = `

        <span
          class="nav-dot"
        ></span>

        <span>
          ${group.label}
        </span>

      `;


      button.addEventListener(
        "click",
        () => {

          activateGroup(
            group.id
          );

        }
      );


      sidebar.appendChild(
        button
      );

    }
  );

}


/* ========================================
   获取当前索引
   ======================================== */

function currentIndex() {

  return groups.findIndex(
    group =>
      group.id ===
      currentId
  );

}


/* ========================================
   循环索引
   ======================================== */

function wrapIndex(
  value
) {

  const count =
    groups.length;


  return (
    (
      value % count
    )
    +
    count
  )
  %
  count;

}


/* ========================================
   激活分组

   不重建 DOM，
   只切 active。
   ======================================== */

function activateGroup(
  id,
  direction = 1
) {

  if (
    id === currentId
  ) {

    updateNav();

    const same =
      groupElements.get(id);


    if (same) {

      same.classList.add(
        "active"
      );

    }


    return;

  }


  const old =
    groupElements.get(
      currentId
    );


  const next =
    groupElements.get(
      id
    );


  if (old) {

    old.classList.remove(
      "active",
      "from-top"
    );

  }


  currentId =
    id;


  if (next) {

    next.classList.toggle(
      "from-top",
      direction < 0
    );


    next.classList.add(
      "active"
    );

  }


  updateNav();


  localStorage.setItem(
    GROUP_STORAGE_KEY,
    currentId
  );

}


/* ========================================
   更新左侧状态
   ======================================== */

function updateNav() {

  let activeItem =
    null;


  document
    .querySelectorAll(
      ".nav-item"
    )
    .forEach(
      item => {

        item.classList.toggle(
          "active",
          item.dataset.group
          ===
          currentId
        );


        if (
          item.dataset.group
          ===
          currentId
        ) {

          activeItem =
            item;

        }

      }
    );


  if (activeItem) {

    activeItem.scrollIntoView({

      block: "nearest",
      behavior: "smooth"

    });

  }


  requestAnimationFrame(
    updateSidebarScrollControls
  );

}


/* ========================================
   左侧分组滚动提示
   ======================================== */

function updateSidebarScrollControls() {

  const maxScroll =
    Math.max(
      0,
      sidebar.scrollHeight
      -
      sidebar.clientHeight
    );


  sidebarScrollUp.hidden =
    sidebar.scrollTop <= 1;


  sidebarScrollDown.hidden =
    sidebar.scrollTop >=
    maxScroll - 1;

}


function scrollSidebar(direction) {

  sidebar.scrollTop =
    sidebar.scrollTop
    +
    direction
    *
    90;


  requestAnimationFrame(
    updateSidebarScrollControls
  );

}


sidebarScrollUp.addEventListener(
  "click",
  () => {

    scrollSidebar(-1);

  }
);


sidebarScrollDown.addEventListener(
  "click",
  () => {

    scrollSidebar(1);

  }
);


sidebar.addEventListener(
  "scroll",
  updateSidebarScrollControls,
  {
    passive: true
  }
);


sidebar.addEventListener(
  "wheel",
  event => {

    event.preventDefault();
    event.stopPropagation();


    sidebar.scrollTop +=
      normaliseWheel(
        event
      );


    updateSidebarScrollControls();

  },
  {
    passive: false
  }
);


window.addEventListener(
  "resize",
  updateSidebarScrollControls
);


/* ========================================
   按数量切换分组
   ======================================== */

function moveGroups(
  steps
) {

  if (!steps) {
    return;
  }


  const oldIndex =
    currentIndex();


  const nextIndex =
    wrapIndex(
      oldIndex + steps
    );


  activateGroup(
    groups[nextIndex].id,
    steps
  );

}


/* ========================================
   右键菜单事件
   ======================================== */

content.addEventListener(
  "contextmenu",
  event => {

    if (
      event.target.closest(
        ".shortcut"
      )
    ) {

      return;

    }


    event.preventDefault();


    selectedShortcutKey =
      "";


    openContextMenu(
      blankMenu,
      event.clientX,
      event.clientY
    );

  }
);


shortcutMenu.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        "button[data-action]"
      );


    if (
      !button
      ||
      !selectedShortcutKey
    ) {

      return;

    }


    const key =
      selectedShortcutKey;


    const action =
      button.dataset.action;


    hideContextMenus();


    if (
      action ===
      "edit-shortcut"
    ) {

      openShortcutEditor(
        key,
        "edit"
      );

    }


    if (
      action ===
      "move-shortcut"
    ) {

      openShortcutEditor(
        key,
        "move"
      );

    }


    if (
      action ===
      "upload-icon"
    ) {

      pendingIconKey =
        key;


      iconFileInput.value =
        "";


      iconFileInput.click();

    }


    if (
      action ===
      "icon-url"
    ) {

      pendingIconKey =
        key;


      iconUrlFormError.textContent =
        "";


      iconUrlInput.value =
        /^https:\/\//i.test(
          iconOverrides[key]
          ||
          ""
        )
        ?
        iconOverrides[key]
        :
        "";


      openModal(
        iconUrlModal,
        iconUrlInput
      );

    }


    if (
      action ===
      "reset-icon"
    ) {

      resetIconOverride(
        key
      );

    }


    if (
      action ===
      "delete-shortcut"
    ) {

      deleteCustomShortcut(
        key
      );

    }

  }
);


blankMenu.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        "button[data-action]"
      );


    if (!button) {

      return;

    }


    const action =
      button.dataset.action;


    hideContextMenus();


    if (
      action ===
      "add-shortcut"
    ) {

      shortcutNameInput.value =
        "";


      shortcutUrlInput.value =
        "";


      addFormError.textContent =
        "";


      openModal(
        addModal,
        shortcutNameInput
      );

    }


    if (
      action ===
      "recent-deleted"
    ) {

      openTrashModal();

    }


    if (
      action ===
      "sync-settings"
    ) {

      syncTokenInput.value =
        getSyncToken();


      syncFormError.textContent =
        "";


      const meta =
        readSyncMeta();


      updateSyncStatus(
        getSyncToken()
          ? meta.dirty
            ? "本机有等待上传的更改"
            : "本机已启用自动同步"
          : "尚未在本机启用同步"
      );


      openModal(
        syncModal,
        syncTokenInput
      );

    }

  }
);


editForm.addEventListener(
  "submit",
  event => {

    event.preventDefault();


    editFormError.textContent =
      "";


    try {

      const index =
        customSites.findIndex(
          entry =>
            entry.key ===
            pendingEditKey
        );


      if (index < 0) {

        throw new Error(
          "没有找到要编辑的快捷方式"
        );

      }


      const previous = {
        ...customSites[index]
      };


      const label =
        editShortcutNameInput.value
          .trim();


      if (!label) {

        throw new Error(
          "请填写名称"
        );

      }


      const url =
        normaliseShortcutUrl(
          editShortcutUrlInput.value
        );


      const group =
        groups.find(
          item =>
            item.id ===
            editShortcutGroupInput.value
        );


      if (!group) {

        throw new Error(
          "请选择有效分组"
        );

      }


      if (
        previous.groupId !==
          group.id
        &&
        group.items.length >= 12
      ) {

        throw new Error(
          "目标分组已满，最多可放 12 个快捷方式"
        );

      }


      customSites[index] = {

        ...previous,
        label,
        url,
        groupId: group.id,
        icon:
          previous.url === url
            ? previous.icon
            : "",
        updatedAt:
          new Date().toISOString()

      };


      if (!saveCustomSites()) {

        customSites[index] =
          previous;


        throw new Error(
          "保存失败：本地存储空间不足"
        );

      }


      clearStoredIcon(
        previous.key
      );


      applyCustomSitesToRuntime(
        customSites
      );


      /*
         移动到其他分组会改变两个分组的
         成员，需要各自记录排序时间；
         仅改名、换链接不触碰排序。
      */

      if (
        previous.groupId !==
        group.id
      ) {

        touchGroupOrder(
          previous.groupId,
          true
        );


        touchGroupOrder(
          group.id,
          true
        );


        currentId =
          group.id;


        localStorage.setItem(
          GROUP_STORAGE_KEY,
          currentId
        );

      }


      markSyncDirty();


      closeModal(
        editModal
      );


      refreshShortcutGroups();


      showToast(
        previous.groupId !== group.id
          ? `已移动到「${group.label}」`
          : "快捷方式已保存"
      );


      pendingEditKey =
        "";

    }


    catch (error) {

      editFormError.textContent =
        error.message
        ||
        "无法保存快捷方式";

    }

  }
);


syncForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    syncFormError.textContent =
      "";


    const token =
      syncTokenInput.value.trim();


    if (!token) {

      syncFormError.textContent =
        "请填写同步口令";


      return;

    }


    try {

      const success =
        await pushCloudSync({

          token,
          notify: true

        });


      if (success) {

        setSyncToken(token);


        closeModal(
          syncModal
        );

      }

    }

    catch (error) {

      syncFormError.textContent =
        error.message
        ||
        "无法启用同步";

    }

  }
);


syncPullButton.addEventListener(
  "click",
  async () => {

    syncFormError.textContent =
      "";


    const token =
      syncTokenInput.value.trim();


    if (!token) {

      syncFormError.textContent =
        "请填写同步口令";


      return;

    }


    try {

      /*
         恢复按钮：先读取云端并与本机
         自动合并（有冲突时弹窗，
         默认合并不丢数据），
         再把结果上传云端。
      */

      const resolved =
        await reconcileCloudConflict(
          token
        );


      if (!resolved) {

        closeModal(
          syncModal
        );


        showToast(
          "已取消：存在需要处理的同步冲突"
        );


        return;

      }


      setSyncToken(token);


      const uploaded =
        await pushCloudSync({

          token,
          notify: true

        });


      if (uploaded) {

        closeModal(
          syncModal
        );

      }

    }

    catch (error) {

      syncFormError.textContent =
        error.message
        ||
        "无法从云端恢复";

    }

  }
);


syncDisableButton.addEventListener(
  "click",
  () => {

    clearTimeout(
      syncTimer
    );


    localStorage.removeItem(
      SYNC_TOKEN_STORAGE_KEY
    );


    localStorage.removeItem(
      SYNC_META_STORAGE_KEY
    );


    syncTokenInput.value =
      "";


    closeModal(
      syncModal
    );


    showToast(
      "已在本机停用同步，云端数据仍保留"
    );

  }
);


iconFileInput.addEventListener(
  "change",
  async () => {

    const file =
      iconFileInput.files[0];


    const key =
      pendingIconKey;


    if (
      !file
      ||
      !key
    ) {

      return;

    }


    try {

      const dataUrl =
        await readLocalIcon(
          file
        );


      if (
        applyIconOverride(
          key,
          dataUrl
        )
      ) {

        showToast(
          "本地图标已保存"
        );

      }

    }

    catch (error) {

      showToast(
        error.message
        ||
        "图标处理失败"
      );

    }


    finally {

      pendingIconKey =
        "";


      iconFileInput.value =
        "";

    }

  }
);


iconUrlForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    iconUrlFormError.textContent =
      "";


    try {

      const key =
        pendingIconKey;


      if (!key) {

        throw new Error(
          "没有找到要修改的快捷方式"
        );

      }


      const url =
        normaliseRemoteIconUrl(
          iconUrlInput.value
        );


      await verifyRemoteIcon(
        url
      );


      if (
        applyIconOverride(
          key,
          url
        )
      ) {

        closeModal(
          iconUrlModal
        );


        pendingIconKey =
          "";


        showToast(
          "图标链接已保存"
        );

      }

    }

    catch (error) {

      iconUrlFormError.textContent =
        error.message
        ||
        "图标链接不可用";

    }

  }
);


addForm.addEventListener(
  "submit",
  event => {

    event.preventDefault();


    addFormError.textContent =
      "";


    try {

      const group =
        groups.find(
          item =>
            item.id ===
            currentId
        );


      if (!group) {

        throw new Error(
          "没有找到当前分类"
        );

      }


      if (
        group.items.length >=
        12
      ) {

        throw new Error(
          "当前分类已满，最多可放 12 个快捷方式"
        );

      }


      const label =
        shortcutNameInput.value
          .trim();


      if (!label) {

        throw new Error(
          "请填写名称"
        );

      }


      const url =
        normaliseShortcutUrl(
          shortcutUrlInput.value
        );


      const key =
        `custom-${Date.now()}-${Math.random()
          .toString(36)
          .slice(2, 7)}`;


      const entry = {

        key,
        label,
        url,
        groupId:
          group.id,
        updatedAt:
          new Date().toISOString()

      };


      customSites.push(
        entry
      );


      if (!saveCustomSites()) {

        customSites.pop();


        throw new Error(
          "保存失败：本地存储空间不足"
        );

      }


      markSyncDirty();


      sites[key] = {

        label,
        url,
        icon: ""

      };


      group.items.push(
        key
      );


      touchGroupOrder(
        group.id,
        true
      );


      closeModal(
        addModal
      );


      refreshShortcutGroups();


      showToast(
        `已添加到「${group.label}」`
      );

    }

    catch (error) {

      addFormError.textContent =
        error.message
        ||
        "无法添加快捷方式";

    }

  }
);


document.addEventListener(
  "pointerdown",
  event => {

    if (
      !event.target.closest(
        ".context-menu"
      )
    ) {

      hideContextMenus();

    }

  }
);


document
  .querySelectorAll(
    "[data-close-modal]"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          const modal =
            button.closest(
              ".modal-overlay"
            );


          if (modal) {

            closeModal(
              modal
            );

          }

        }
      );

    }
  );


[addModal, editModal, iconUrlModal, syncModal, trashModal]
  .forEach(
    modal => {

      modal.addEventListener(
        "pointerdown",
        event => {

          if (
            event.target ===
            modal
          ) {

            closeModal(
              modal

        }
      );

    }
  );


/* ========================================
   鼠标滚轮

   滚得越快 / 越远，
   一次可切越多组。

   完全取消之前的锁定等待。
   ======================================== */

let wheelAccumulator =
  0;


let resetTimer =
  null;


/*
   越小越灵敏。

   普通鼠标滚一格一般约 100px，
   所以 65 会比较跟手。
*/

const WHEEL_THRESHOLD =
  65;


/*
   一次极大的滚动事件
   最多跨 6 个组。
*/

const MAX_STEPS =
  6;


function normaliseWheel(
  event
) {

  let delta =
    event.deltaY;


  /*
     deltaMode:
     0 = pixel
     1 = line
     2 = page
  */

  if (
    event.deltaMode === 1
  ) {

    delta *= 16;

  }


  else if (
    event.deltaMode === 2
  ) {

    delta *= 300;

  }


  return delta;

}


document.addEventListener(

  "wheel",

  event => {

    event.preventDefault();


    if (
      !addModal.hidden
      ||
      !editModal.hidden
      ||
      !iconUrlModal.hidden
      ||
      !syncModal.hidden
      ||
      !conflictModal.hidden
      ||
      !trashModal.hidden
    ) {

      return;

    }


    wheelAccumulator +=
      normaliseWheel(
        event
      );


    let steps =
      Math.trunc(
        wheelAccumulator
        /
        WHEEL_THRESHOLD
      );


    if (!steps) {

      clearTimeout(
        resetTimer
      );


      resetTimer =
        setTimeout(
          () => {

            wheelAccumulator =
              0;

          },
          90
        );


      return;

    }


    steps =
      Math.max(
        -MAX_STEPS,
        Math.min(
          MAX_STEPS,
          steps
        )
      );


    wheelAccumulator -=
      steps
      *
      WHEEL_THRESHOLD;


    moveGroups(
      steps
    );


    clearTimeout(
      resetTimer
    );


    resetTimer =
      setTimeout(
        () => {

          wheelAccumulator =
            0;

        },
        90
      );

  },

  {
    passive: false
  }

);


/* ========================================
   上下方向键
   ======================================== */

document.addEventListener(

  "keydown",

  event => {

    if (
      event.key ===
      "Escape"
    ) {

      hideContextMenus();


      if (activeConflictResolver) {

        activeConflictResolver(
          "cancel"
        );

      }


      closeModal(
        addModal
      );


      closeModal(
        iconUrlModal
      );


      closeModal(
        syncModal
      );


      closeModal(
        conflictModal
      );


      closeModal(
        trashModal
      );


      pendingIconKey =
        "";


      return;

    }


    if (
      !addModal.hidden
      ||
      !iconUrlModal.hidden
      ||
      !syncModal.hidden
      ||
      !conflictModal.hidden
      ||
      !trashModal.hidden
      ||
      /^(INPUT|TEXTAREA)$/.test(
        document.activeElement.tagName
      )
    ) {

      return;

    }

    if (
      event.key ===
      "ArrowDown"
    ) {

      moveGroups(1);

    }


    if (
      event.key ===
      "ArrowUp"
    ) {

      moveGroups(-1);

    }

  }

);


/* ========================================
   初始化
   ======================================== */

buildSidebar();

buildAllGroups();


const initial =
  groupElements.get(
    currentId
  );


if (initial) {

  initial.classList.add(
    "active"
  );

}


updateNav();

warmPersistentIconCache();

initialiseCloudSync();

</script>
