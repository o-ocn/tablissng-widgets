<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shortcuts</title>

<style>
* {
  box-sizing: border-box;
}

html {
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Text",
    "SF Pro Display",
    "PingFang SC",
    "Segoe UI",
    "Microsoft YaHei",
    sans-serif;

  color: #fff;
}

body {
  user-select: none;
}


/* ========================================
   整体布局
   ======================================== */

.app {
  width: 100%;
  height: 100%;

  display: grid;
  grid-template-columns: 106px 1fr;

  gap: 16px;

  padding: 8px 10px;

  overflow: hidden;
}


/* ========================================
   左侧分组
   大字号 + 独立滚动区域
   ======================================== */

.sidebar-shell {
  position: relative;
  height: 100%;
  min-height: 0;
  padding: 17px 0;
  overflow: hidden;
}

.sidebar {
  height: 100%;
  min-height: 0;

  display: flex;
  flex-direction: column;
  justify-content: flex-start;

  gap: 3px;

  padding: 2px 3px;

  background: transparent;
  border: 0;
  box-shadow: none;

  overflow-x: hidden;
  overflow-y: auto;
  scroll-behavior: smooth;
  scrollbar-width: none;
  overscroll-behavior: contain;
}

.sidebar::-webkit-scrollbar {
  display: none;
}

.sidebar-scroll {
  position: absolute;
  left: 50%;
  z-index: 12;

  width: 42px;
  height: 17px;
  margin: 0;
  padding: 0;

  transform: translateX(-50%);

  appearance: none;
  border: 0;
  outline: 0;
  background: transparent;

  color: rgba(255, 255, 255, 0.64);
  cursor: pointer;

  opacity: 0;
  visibility: hidden;
  pointer-events: none;

  display: flex;
  align-items: center;
  justify-content: center;

  filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35));
  transition:
    color 0.16s ease,
    opacity 0.18s ease,
    visibility 0s linear 0.18s;
}

.app:hover .sidebar-scroll:not([hidden]),
.app:focus-within .sidebar-scroll:not([hidden]) {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;

  transition:
    color 0.16s ease,
    opacity 0.18s ease,
    visibility 0s linear 0s;
}

.sidebar-scroll:hover {
  color: rgba(255, 255, 255, 0.94);
}

.sidebar-scroll-up {
  top: 0;
}

.sidebar-scroll-down {
  bottom: 0;
}

.sidebar-scroll svg {
  width: 18px;
  height: 12px;
  display: block;
}

.sidebar-scroll path {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}


/* ========================================
   分组按钮
   ======================================== */

.nav-item {
  width: 100%;
  height: 27px;
  flex: 0 0 27px;

  appearance: none;

  border: 0;
  outline: 0;

  padding: 0 9px;

  background: transparent;

  border-radius: 11px;

  color:
    rgba(
      255,
      255,
      255,
      0.60
    );

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Text",
    "PingFang SC",
    "Segoe UI",
    "Microsoft YaHei",
    sans-serif;

  font-size: 13px;
  font-weight: 500;

  letter-spacing: 0.1px;

  cursor: pointer;

  display: flex;
  align-items: center;

  gap: 8px;

  text-align: left;

  transition:
    color 0.16s ease,
    background 0.16s ease,
    border-color 0.16s ease,
    box-shadow 0.16s ease,
    transform 0.16s ease;

  border: 1px solid transparent;
}


.nav-item:hover {
  color:
    rgba(
      255,
      255,
      255,
      0.78
    );
}


.nav-item.active {
  color:
    rgba(
      255,
      255,
      255,
      0.98
    );

  font-weight: 600;

  background:
    linear-gradient(
      135deg,
      rgba(255, 255, 255, 0.16),
      rgba(255, 255, 255, 0.075)
    );

  border-color:
    rgba(255, 255, 255, 0.16);

  box-shadow:
    0 5px 15px rgba(0, 0, 0, 0.10),
    inset 0 1px 0 rgba(255, 255, 255, 0.08);

  backdrop-filter: blur(12px) saturate(135%);
  -webkit-backdrop-filter: blur(12px) saturate(135%);
}


/* ========================================
   分组左侧圆点
   ======================================== */

.nav-dot {
  width: 5px;
  height: 5px;

  flex: 0 0 auto;

  border-radius: 50%;

  background:
    rgba(
      255,
      255,
      255,
      0.20
    );

  transition:
    background 0.16s ease,
    box-shadow 0.16s ease,
    transform 0.16s ease;
}


/* Apple System Blue */

.nav-item.active
.nav-dot {
  background: #0A84FF;

  box-shadow:
    0 0 7px
    rgba(
      10,
      132,
      255,
      0.65
    );

  transform: scale(1.25);
}


/* ========================================
   右侧内容区域
   ======================================== */

.content {
  position: relative;

  width: 100%;
  height: 100%;

  min-width: 0;

  overflow: hidden;
}


/* ========================================
   每个分组都一直存在
   只切换显示状态

   这样切回来时：
   图片节点不会重新创建
   ======================================== */

.group-grid {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  display: grid;

  grid-template-columns:
    repeat(4, minmax(0, 1fr));

  grid-auto-rows: 88px;

  gap:
    8px 9px;

  align-content: center;

  opacity: 0;

  visibility: hidden;

  pointer-events: none;

  transform:
    translateY(10px);

  transition:
    opacity 0.20s ease,
    transform 0.22s
    cubic-bezier(.2,.75,.3,1),
    visibility 0.20s;
}


.group-grid.active {
  opacity: 1;

  visibility: visible;

  pointer-events: auto;

  transform:
    translateY(0);
}


.group-grid.from-top {
  transform:
    translateY(-10px);
}


.group-grid.active.from-top {
  transform:
    translateY(0);
}


/* ========================================
   单个快捷方式
   ======================================== */

.shortcut {
  min-width: 0;

  color: inherit;

  text-decoration: none;

  border-radius: 17px;

  padding:
    7px 5px 6px;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  gap: 7px;

  background: transparent;

  border:
    1px solid
    transparent;

  cursor: pointer;

  transition:
    background 0.16s ease,
    border-color 0.16s ease,
    transform 0.16s ease,
    box-shadow 0.16s ease;
}


.shortcut:hover {
  background:
    rgba(
      255,
      255,
      255,
      0.07
    );

  border-color:
    rgba(
      255,
      255,
      255,
      0.08
    );

  transform:
    translateY(-2px);

  box-shadow:
    0 6px 18px
    rgba(
      0,
      0,
      0,
      0.08
    );
}


/* ========================================
   图标
   ======================================== */

.icon-shell {
  width: 50px;
  height: 50px;

  position: relative;

  display: flex;

  align-items: center;
  justify-content: center;

  overflow: hidden;

  border-radius: 15px;

  background:
    transparent;

  border:
    1px solid
    transparent;

  box-shadow:
    none;

  transition:
    transform 0.16s ease,
    background 0.16s ease;
}


.shortcut:hover
.icon-shell {
  transform:
    scale(1.055);

  background:
    transparent;
}


.icon-shell img {
  width: 39px;
  height: 39px;

  display: block;

  object-fit: contain;
}


/* ========================================
   图标全部失败时才显示文字
   ======================================== */

.fallback {
  position: absolute;

  inset: 0;

  display: none;

  align-items: center;
  justify-content: center;

  color:
    rgba(
      255,
      255,
      255,
      0.95
    );

  font-size: 19px;

  font-weight: 650;
}


/* ========================================
   快捷方式名称
   ======================================== */

.shortcut-label {
  width: 100%;

  padding:
    0 3px;

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;

  text-align: center;

  font-size: 11px;

  font-weight: 500;

  color:
    rgba(
      255,
      255,
      255,
      0.90
    );

  text-shadow:
    0 1px 3px
    rgba(
      0,
      0,
      0,
      0.50
    );
}


/* ========================================
   右键菜单与编辑窗口
   ======================================== */

[hidden] {
  display: none !important;
}

.context-menu {
  position: fixed;
  z-index: 300;
  width: 154px;
  padding: 5px;
  border-radius: 12px;
  background: rgba(38, 39, 46, 0.91);
  backdrop-filter: blur(14px) saturate(125%);
  -webkit-backdrop-filter: blur(14px) saturate(125%);
  border: 1px solid rgba(255, 255, 255, 0.14);
  box-shadow:
    0 10px 28px rgba(0, 0, 0, 0.20),
    inset 0 1px 0 rgba(255, 255, 255, 0.06);
}

.context-menu button {
  width: 100%;
  height: 30px;
  padding: 0 10px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: rgba(255, 255, 255, 0.92);
  font: inherit;
  font-size: 11.5px;
  font-weight: 500;
  text-align: left;

  text-shadow:
    0 1px 3px
    rgba(0, 0, 0, 0.42);
  cursor: pointer;
}

.context-menu button:hover {
  background: rgba(255, 255, 255, 0.10);
}

.context-menu .danger {
  color: #ff9b96;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 400;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px;
  background: rgba(5, 8, 14, 0.20);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
}

.modal-card {
  width: min(320px, 100%);
  padding: 16px;
  border-radius: 17px;
  background: rgba(30, 32, 39, 0.965);
  border: 1px solid rgba(255, 255, 255, 0.15);
  box-shadow:
    0 16px 40px rgba(0, 0, 0, 0.25),
    inset 0 1px 0 rgba(255, 255, 255, 0.06);
}

.modal-title {
  margin: 0 0 12px;
  color: rgba(255, 255, 255, 0.96);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.1px;
}

.field {
  display: block;
  margin-top: 9px;
}

.field span {
  display: block;
  margin: 0 0 5px 1px;
  color: rgba(255, 255, 255, 0.70);
  font-size: 10.5px;
  font-weight: 500;
}

.field input {
  width: 100%;
  height: 34px;
  padding: 0 10px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 10px;
  outline: 0;
  background: rgba(255, 255, 255, 0.075);
  color: #fff;
  font: inherit;
  font-size: 11.5px;
  user-select: text;
}

.field input:focus {
  border-color: rgba(10, 132, 255, 0.72);
  box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.14);
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 7px;
  margin-top: 13px;
}

.modal-actions button {
  height: 30px;
  padding: 0 14px;
  border: 0;
  border-radius: 9px;
  color: #fff;
  font: inherit;
  font-size: 11.5px;
  font-weight: 500;
  cursor: pointer;
}

.button-secondary {
  background: rgba(255, 255, 255, 0.10);
}

.button-primary {
  background: #0A84FF;
}

.form-error {
  min-height: 12px;
  margin-top: 6px;
  color: #ff9b96;
  font-size: 9.5px;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 12px;
  z-index: 500;
  max-width: calc(100% - 32px);
  padding: 8px 13px;
  border-radius: 999px;
  transform: translateX(-50%);
  background: rgba(28, 31, 39, 0.86);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(255, 255, 255, 0.14);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.20);
  color: rgba(255, 255, 255, 0.94);
  font-size: 11px;
  white-space: nowrap;
}

</style>
</head>


<body>

<div class="app">

  <div class="sidebar-shell">

    <button
      class="sidebar-scroll sidebar-scroll-up"
      id="sidebarScrollUp"
      type="button"
      aria-label="向上显示更多分组"
      hidden
    >
      <svg viewBox="0 0 18 12" aria-hidden="true">
        <path d="M4 8.2 9 3.8l5 4.4"></path>
        <path d="M4 11 9 6.6l5 4.4"></path>
      </svg>
    </button>

    <nav
      class="sidebar"
      id="sidebar"
      aria-label="快捷方式分组"
    ></nav>

    <button
      class="sidebar-scroll sidebar-scroll-down"
      id="sidebarScrollDown"
      type="button"
      aria-label="向下显示更多分组"
    >
      <svg viewBox="0 0 18 12" aria-hidden="true">
        <path d="m4 1 5 4.4L14 1"></path>
        <path d="m4 3.8 5 4.4 5-4.4"></path>
      </svg>
    </button>

  </div>

  <main
    class="content"
    id="content"
  ></main>

</div>


<div
  class="context-menu"
  id="shortcutMenu"
  hidden
>
  <button type="button" data-action="upload-icon">
    本地上传图标
  </button>
  <button type="button" data-action="icon-url">
    使用图标链接
  </button>
  <button type="button" data-action="reset-icon">
    恢复自动图标
  </button>
</div>


<div
  class="context-menu"
  id="blankMenu"
  hidden
>
  <button type="button" data-action="add-shortcut">
    添加快捷方式
  </button>
</div>


<input
  id="iconFileInput"
  type="file"
  accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml"
  hidden
>


<div
  class="modal-overlay"
  id="addModal"
  hidden
>
  <form class="modal-card" id="addForm">
    <h2 class="modal-title">添加快捷方式</h2>

    <label class="field">
      <span>名称</span>
      <input
        id="shortcutNameInput"
        type="text"
        maxlength="24"
        autocomplete="off"
        required
      >
    </label>

    <label class="field">
      <span>网站链接</span>
      <input
        id="shortcutUrlInput"
        type="text"
        inputmode="url"
        placeholder="https://example.com"
        autocomplete="off"
        required
      >
    </label>

    <div class="form-error" id="addFormError"></div>

    <div class="modal-actions">
      <button class="button-secondary" type="button" data-close-modal>
        取消
      </button>
      <button class="button-primary" type="submit">
        保存
      </button>
    </div>
  </form>
</div>


<div
  class="modal-overlay"
  id="iconUrlModal"
  hidden
>
  <form class="modal-card" id="iconUrlForm">
    <h2 class="modal-title">使用图标链接</h2>

    <label class="field">
      <span>图片直链（建议 HTTPS）</span>
      <input
        id="iconUrlInput"
        type="text"
        inputmode="url"
        placeholder="https://example.com/icon.png"
        autocomplete="off"
        required
      >
    </label>

    <div class="form-error" id="iconUrlFormError"></div>

    <div class="modal-actions">
      <button class="button-secondary" type="button" data-close-modal>
        取消
      </button>
      <button class="button-primary" type="submit">
        保存
      </button>
    </div>
  </form>
</div>


<div class="toast" id="toast" hidden></div>


<script>

/* ========================================
   保存键
   ======================================== */

const GROUP_STORAGE_KEY =
  "tabliss-shortcuts-group-v3";


/*
   这里已经预留给以后
   “本地上传自定义图标”
   使用。

   后面可以做成：

   右键快捷方式
   → 更换图标
   → 选择本地图片
   → 保存
*/

const ICON_OVERRIDE_KEY =
  "tabliss-shortcuts-icon-overrides-v1";


/*
   已验证图标地址的持久缓存。

   图标文件本身继续交给浏览器 HTTP 缓存；
   localStorage 只记录最终可用地址，
   避免每次刷新都重新探测多组 favicon。
*/

const ICON_CACHE_STORAGE_KEY =
  "tabliss-shortcuts-resolved-icons-v1";


const CUSTOM_SITES_STORAGE_KEY =
  "tabliss-shortcuts-custom-sites-v1";


/* ========================================
   自定义图标覆盖
   ======================================== */

let iconOverrides = {};


try {

  iconOverrides =
    JSON.parse(
      localStorage.getItem(
        ICON_OVERRIDE_KEY
      )
      ||
      "{}"
    );

}

catch {

  iconOverrides = {};

}


function saveIconOverrides() {

  try {

    localStorage.setItem(
      ICON_OVERRIDE_KEY,
      JSON.stringify(
        iconOverrides
      )
    );


    return true;

  }

  catch (error) {

    console.warn(
      "Unable to save custom icon",
      error
    );


    return false;

  }

}


let customSites = [];


try {

  const parsed =
    JSON.parse(
      localStorage.getItem(
        CUSTOM_SITES_STORAGE_KEY
      )
      ||
      "[]"
    );


  if (Array.isArray(parsed)) {

    customSites = parsed;

  }

}

catch {

  customSites = [];

}


function saveCustomSites() {

  try {

    localStorage.setItem(
      CUSTOM_SITES_STORAGE_KEY,
      JSON.stringify(
        customSites
      )
    );


    return true;

  }

  catch (error) {

    console.warn(
      "Unable to save custom shortcut",
      error
    );


    return false;

  }

}


/* ========================================
   图标两级缓存

   第一层：当前页面的 Map
   第二层：localStorage
   ======================================== */

const iconResolutionCache =
  new Map();


let storedIconCache = {};


try {

  const parsed =
    JSON.parse(
      localStorage.getItem(
        ICON_CACHE_STORAGE_KEY
      )
      ||
      "{}"
    );


  if (
    parsed
    &&
    typeof parsed === "object"
    &&
    !Array.isArray(parsed)
  ) {

    storedIconCache =
      parsed;

  }

}

catch {

  storedIconCache = {};

}


function iconCacheSignature(
  key,
  site
) {

  return JSON.stringify([

    iconOverrides[key]
      || "",

    site.customIcon
      || "",

    site.icon
      || "",

    site.url
      || ""

  ]);

}


function getStoredIcon(
  key,
  site
) {

  const entry =
    storedIconCache[key];


  if (
    !entry
    ||
    typeof entry.src !== "string"
    ||
    entry.signature !==
      iconCacheSignature(
        key,
        site
      )
  ) {

    return "";

  }


  return entry.src;

}


function saveStoredIcon(
  key,
  site,
  src
) {

  if (!src) {
    return;
  }


  /*
     data URL 已由 iconOverrides 持久保存，
     这里不重复存一份，避免占用双倍空间。
  */

  if (
    src.startsWith("data:")
    ||
    src.startsWith("blob:")
  ) {

    return;

  }


  storedIconCache[key] = {

    src,

    signature:
      iconCacheSignature(
        key,
        site
      )

  };


  try {

    localStorage.setItem(
      ICON_CACHE_STORAGE_KEY,
      JSON.stringify(
        storedIconCache
      )
    );

  }

  catch (error) {

    console.warn(
      "Unable to save icon cache",
      error
    );

  }

}


function clearStoredIcon(key) {

  iconResolutionCache.delete(
    key
  );


  if (
    !Object.prototype
      .hasOwnProperty.call(
        storedIconCache,
        key
      )
  ) {

    return;

  }


  delete storedIconCache[key];


  try {

    localStorage.setItem(
      ICON_CACHE_STORAGE_KEY,
      JSON.stringify(
        storedIconCache
      )
    );

  }

  catch (error) {

    console.warn(
      "Unable to update icon cache",
      error
    );

  }

}


function getHostname(url) {

  try {

    return (
      new URL(url).hostname
    );

  }

  catch {

    return "";

  }

}


function normaliseIcon(url) {

  if (!url) {
    return "";
  }


  if (
    url.startsWith("/")
  ) {

    return (
      "https://web.gotab.cn"
      +
      url
    );

  }


  return url;

}


function ownFavicon(url) {

  try {

    const parsed =
      new URL(url);


    if (
      parsed.protocol !==
      "https:"
    ) {

      return "";

    }


    return (
      parsed.origin
      +
      "/favicon.ico"
    );

  }

  catch {

    return "";

  }

}


function googleFavicon(url) {

  return (
    "https://www.google.com/s2/favicons?sz=128&domain_url="
    +
    encodeURIComponent(url)
  );

}


function duckFavicon(url) {

  const hostname =
    getHostname(url);


  if (!hostname) {
    return "";
  }


  return (
    "https://icons.duckduckgo.com/ip3/"
    +
    hostname
    +
    ".ico"
  );

}


/* ========================================
   检查一个图标是否可以加载
   ======================================== */

function probeImage(url) {

  return new Promise(
    resolve => {

      if (!url) {

        resolve(false);

        return;

      }


      const img =
        new Image();


      img.onload =
        () => {

          resolve(true);

        };


      img.onerror =
        () => {

          resolve(false);

        };


      img.src =
        url;

    }
  );

}


/* ========================================
   解析网站图标

   优先级：

   1 自定义本地图标
   2 我们指定的图标
   3 网站 favicon
   4 Google favicon
   5 DuckDuckGo favicon
   ======================================== */

function resolveIcon(
  key,
  site,
  forceRefresh = false
) {

  if (
    !forceRefresh
    &&
    iconResolutionCache
      .has(key)
  ) {

    return (
      iconResolutionCache
        .get(key)
    );

  }


  if (!forceRefresh) {

    const storedIcon =
      getStoredIcon(
        key,
        site
      );


    if (storedIcon) {

      const cachedPromise =
        Promise.resolve(
          storedIcon
        );


      iconResolutionCache.set(
        key,
        cachedPromise
      );


      return cachedPromise;

    }

  }


  const promise =
    (async () => {

      const candidates =
        [...new Set([

        iconOverrides[key]
          || "",

        normaliseIcon(
          site.customIcon
        ),

        normaliseIcon(
          site.icon
        ),

        ownFavicon(
          site.url
        ),

        googleFavicon(
          site.url
        ),

        duckFavicon(
          site.url
        )

      ])];


      for (
        const candidate
        of candidates
      ) {

        if (!candidate) {
          continue;
        }


        const success =
          await probeImage(
            candidate
          );


        if (success) {

          saveStoredIcon(
            key,
            site,
            candidate
          );


          return candidate;

        }

      }


      return "";

    })();


  iconResolutionCache.set(
    key,
    promise
  );


  return promise;

}

function hideContextMenus() {

  shortcutMenu.hidden =
    true;


  blankMenu.hidden =
    true;

}


function openContextMenu(
  menu,
  x,
  y
) {

  hideContextMenus();


  menu.hidden =
    false;


  menu.style.left =
    "0px";


  menu.style.top =
    "0px";


  const rect =
    menu.getBoundingClientRect();


  const left =
    Math.max(
      8,
      Math.min(
        x,
        window.innerWidth
        -
        rect.width
        -
        8
      )
    );


  const top =
    Math.max(
      8,
      Math.min(
        y,
        window.innerHeight
        -
        rect.height
        -
        8
      )
    );


  menu.style.left =
    `${left}px`;


  menu.style.top =
    `${top}px`;

}


function showToast(message) {

  clearTimeout(
    toastTimer
  );


  toast.textContent =
    message;


  toast.hidden =
    false;


  toastTimer =
    setTimeout(
      () => {

        toast.hidden =
          true;

      },
      1800
    );

}


function closeModal(modal) {

  modal.hidden =
    true;

}


function openModal(
  modal,
  focusTarget
) {

  hideContextMenus();


  modal.hidden =
    false;


  requestAnimationFrame(
    () => {

      focusTarget.focus();

    }
  );

}


function normaliseShortcutUrl(value) {

  let input =
    value.trim();


  if (
    !/^[a-z][a-z\d+.-]*:/i
      .test(input)
  ) {

    input =
      `https://${input}`;

  }


  const parsed =
    new URL(input);


  if (
    parsed.protocol !== "https:"
    &&
    parsed.protocol !== "http:"
  ) {

    throw new Error(
      "只支持 HTTP 或 HTTPS 网站链接"
    );

  }


  return parsed.href;

}


function normaliseRemoteIconUrl(value) {

  const parsed =
    new URL(
      normaliseShortcutUrl(
        value
      )
    );


  if (
    parsed.protocol !== "https:"
  ) {

    throw new Error(
      "图标链接需要使用 HTTPS"
    );

  }


  return parsed.href;

}

function applyIconOverride(
  key,
  value
) {

  const previous =
    iconOverrides[key];


  iconOverrides[key] =
    value;


  clearStoredIcon(
    key
  );


  if (!saveIconOverrides()) {

    if (previous) {

      iconOverrides[key] =
        previous;

    }

    else {

      delete iconOverrides[key];

    }


    showToast(
      "保存失败：本地存储空间不足"
    );


    return false;

  }


  refreshShortcutGroups();


  return true;

}


function resetIconOverride(key) {

  if (!iconOverrides[key]) {

    showToast(
      "当前已经是自动图标"
    );


    return;

  }


  delete iconOverrides[key];


  clearStoredIcon(
    key
  );


  saveIconOverrides();


  refreshShortcutGroups();


  showToast(
    "已恢复自动图标"
  );

}


function readLocalIcon(file) {

  return new Promise(
    (resolve, reject) => {

      if (
        !file.type.startsWith(
          "image/"
        )
      ) {

        reject(
          new Error(
            "请选择图片文件"
          )
        );


        return;

      }


      if (
        file.size >
        5 * 1024 * 1024
      ) {

        reject(
          new Error(
            "图片不能超过 5 MB"
          )
        );


        return;

      }


      const reader =
        new FileReader();


      reader.onerror =
        () => {

          reject(
            new Error(
              "读取图片失败"
            )
          );

        };


      reader.onload =
        () => {

          const image =
            new Image();


          image.onerror =
            () => {

              reject(
                new Error(
                  "无法识别这张图片"
                )
              );

            };


          image.onload =
            () => {

              const maxSide =
                256;


              const scale =
                Math.min(
                  1,
                  maxSide
                  /
                  Math.max(
                    image.naturalWidth,
                    image.naturalHeight
                  )
                );


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                Math.max(
                  1,
                  Math.round(
                    image.naturalWidth
                    *
                    scale
                  )
                );


              canvas.height =
                Math.max(
                  1,
                  Math.round(
                    image.naturalHeight
                    *
                    scale
                  )
                );


              const context =
                canvas.getContext(
                  "2d"
                );


              context.drawImage(
                image,
                0,
                0,
                canvas.width,
                canvas.height
              );


              resolve(
                canvas.toDataURL(
                  "image/webp",
                  0.90
                )
              );

            };


          image.src =
            reader.result;

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}


function verifyRemoteIcon(url) {

  return new Promise(
    (resolve, reject) => {

      const image =
        new Image();


      const timer =
        setTimeout(
          () => {

            image.src =
              "";


            reject(
              new Error(
                "图标加载超时，请检查图片直链"
              )
            );

          },
          8000
        );


      image.onload =
        () => {

          clearTimeout(
            timer
          );


          resolve(url);

        };


      image.onerror =
        () => {

          clearTimeout(
            timer
          );


          reject(
            new Error(
              "这个链接没有返回可用图片"
            )
          );

        };


      image.referrerPolicy =
        "no-referrer";


      image.src =
        url;

    }
  );

}


/* ========================================
   创建快捷方式
   ======================================== */

function createShortcut(
  key
) {

  const site =
    sites[key];


  if (!site) {

    return null;

  }


  const link =
    document.createElement(
      "a"
    );


  link.className =
    "shortcut";


  link.href =
    site.url;


  link.target =
    "_blank";


  link.rel =
    "noopener noreferrer";


  link.title =
    site.label;


  link.dataset.siteKey =
    key;


  link.addEventListener(
    "contextmenu",
    event => {

      event.preventDefault();
      event.stopPropagation();


      selectedShortcutKey =
        key;


      openContextMenu(
        shortcutMenu,
        event.clientX,
        event.clientY
      );

    }
  );


  const shell =
    document.createElement(
      "div"
    );


  shell.className =
    "icon-shell";


  const img =
    document.createElement(
      "img"
    );


  img.alt =
    "";


  const fallback =
    document.createElement(
      "span"
    );


  fallback.className =
    "fallback";


  fallback.textContent =
    site.label
      .trim()
      .charAt(0);


  function showIcon(icon) {

    img.src =
      icon;


    img.style.display =
      "block";


    fallback.style.display =
      "none";

  }


  function showFallback() {

    img.style.display =
      "none";


    fallback.style.display =
      "flex";

  }


  const storedIcon =
    getStoredIcon(
      key,
      site
    );


  if (storedIcon) {

    showIcon(
      storedIcon
    );

  }

  else {

    showFallback();

  }


  let retriedAfterError =
    false;


  img.addEventListener(
    "error",
    () => {

      if (retriedAfterError) {

        showFallback();

        return;

      }


      retriedAfterError =
        true;


      showFallback();


      clearStoredIcon(
        key
      );


      resolveIcon(
        key,
        site,
        true
      )
      .then(
        icon => {

          if (icon) {

            showIcon(
              icon
            );

          }

        }
      );

    }
  );


  shell.appendChild(
    img
  );


  shell.appendChild(
    fallback
  );


  const label =
    document.createElement(
      "div"
    );


  label.className =
    "shortcut-label";


  label.textContent =
    site.label;


  link.appendChild(
    shell
  );


  link.appendChild(
    label
  );


  /*
     每个网站图标只解析一次。

     同一个 Outlook 即使同时存在：
     主页 + 邮箱

     resolveIcon 也只真正执行一次。
  */

  resolveIcon(
    key,
    site
  )
  .then(
    icon => {

      if (icon) {

        showIcon(
          icon
        );

      }

      else {

        showFallback();

      }

    }
  );


  return link;

}


/* ========================================
   启动时一次性创建全部分组

   后面滚轮切换时不再重建。
   ======================================== */

function buildAllGroups() {

  content.innerHTML =
    "";


  groups.forEach(
    group => {

      const grid =
        document.createElement(
          "div"
        );


      grid.className =
        "group-grid";


      grid.dataset.group =
        group.id;


      group.items.forEach(
        key => {

          const shortcut =
            createShortcut(
              key
            );


          if (shortcut) {

            grid.appendChild(
              shortcut
            );

          }

        }
      );


      content.appendChild(
        grid
      );


      groupElements.set(
        group.id,
        grid
      );

    }
  );

}


/* ========================================
   左侧菜单
   ======================================== */

function buildSidebar() {

  sidebar.innerHTML =
    "";


  groups.forEach(
    group => {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "nav-item";


      button.dataset.group =
        group.id;


      button.innerHTML = `

        <span
          class="nav-dot"
        ></span>

        <span>
          ${group.label}
        </span>

      `;


      button.addEventListener(
        "click",
        () => {

          activateGroup(
            group.id
          );

        }
      );


      sidebar.appendChild(
        button
      );

    }
  );

}


/* ========================================
   获取当前索引
   ======================================== */

function currentIndex() {

  return groups.findIndex(
    group =>
      group.id ===
      currentId
  );

}


/* ========================================
   循环索引
   ======================================== */

function wrapIndex(
  value
) {

  const count =
    groups.length;


  return (
    (
      value % count
    )
    +
    count
  )
  %
  count;

}


/* ========================================
   激活分组

   不重建 DOM，
   只切 active。
   ======================================== */

function activateGroup(
  id,
  direction = 1
) {

  if (
    id === currentId
  ) {

    updateNav();

    const same =
      groupElements.get(id);


    if (same) {

      same.classList.add(
        "active"
      );

    }


    return;

  }


  const old =
    groupElements.get(
      currentId
    );


  const next =
    groupElements.get(
      id
    );


  if (old) {

    old.classList.remove(
      "active",
      "from-top"
    );

  }


  currentId =
    id;


  if (next) {

    next.classList.toggle(
      "from-top",
      direction < 0
    );


    next.classList.add(
      "active"
    );

  }


  updateNav();


  localStorage.setItem(
    GROUP_STORAGE_KEY,
    currentId
  );

}


/* ========================================
   更新左侧状态
   ======================================== */

function updateNav() {

  let activeItem =
    null;


  document
    .querySelectorAll(
      ".nav-item"
    )
    .forEach(
      item => {

        item.classList.toggle(
          "active",
          item.dataset.group
          ===
          currentId
        );


        if (
          item.dataset.group
          ===
          currentId
        ) {

          activeItem =
            item;

        }

      }
    );


  if (activeItem) {

    activeItem.scrollIntoView({

      block: "nearest",
      behavior: "smooth"

    });

  }


  requestAnimationFrame(
    updateSidebarScrollControls
  );

}


/* ========================================
   左侧分组滚动提示
   ======================================== */

function updateSidebarScrollControls() {

  const maxScroll =
    Math.max(
      0,
      sidebar.scrollHeight
      -
      sidebar.clientHeight
    );


  sidebarScrollUp.hidden =
    sidebar.scrollTop <= 1;


  sidebarScrollDown.hidden =
    sidebar.scrollTop >=
    maxScroll - 1;

}


function scrollSidebar(direction) {

  sidebar.scrollTop =
    sidebar.scrollTop
    +
    direction
    *
    90;


  requestAnimationFrame(
    updateSidebarScrollControls
  );

}


sidebarScrollUp.addEventListener(
  "click",
  () => {

    scrollSidebar(-1);

  }
);


sidebarScrollDown.addEventListener(
  "click",
  () => {

    scrollSidebar(1);

  }
);


sidebar.addEventListener(
  "scroll",
  updateSidebarScrollControls,
  {
    passive: true
  }
);


sidebar.addEventListener(
  "wheel",
  event => {

    event.preventDefault();
    event.stopPropagation();


    sidebar.scrollTop +=
      normaliseWheel(
        event
      );


    updateSidebarScrollControls();

  },
  {
    passive: false
  }
);


window.addEventListener(
  "resize",
  updateSidebarScrollControls
);


/* ========================================
   按数量切换分组
   ======================================== */

function moveGroups(
  steps
) {

  if (!steps) {
    return;
  }


  const oldIndex =
    currentIndex();


  const nextIndex =
    wrapIndex(
      oldIndex + steps
    );


  activateGroup(
    groups[nextIndex].id,
    steps
  );

}


/* ========================================
   右键菜单事件
   ======================================== */

content.addEventListener(
  "contextmenu",
  event => {

    if (
      event.target.closest(
        ".shortcut"
      )
    ) {

      return;

    }


    event.preventDefault();


    selectedShortcutKey =
      "";


    openContextMenu(
      blankMenu,
      event.clientX,
      event.clientY
    );

  }
);


shortcutMenu.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        "button[data-action]"
      );


    if (
      !button
      ||
      !selectedShortcutKey
    ) {

      return;

    }


    const key =
      selectedShortcutKey;


    const action =
      button.dataset.action;


    hideContextMenus();


    if (
      action ===
      "upload-icon"
    ) {

      pendingIconKey =
        key;


      iconFileInput.value =
        "";


      iconFileInput.click();

    }


    if (
      action ===
      "icon-url"
    ) {

      pendingIconKey =
        key;


      iconUrlFormError.textContent =
        "";


      iconUrlInput.value =
        /^https:\/\//i.test(
          iconOverrides[key]
          ||
          ""
        )
        ?
        iconOverrides[key]
        :
        "";


      openModal(
        iconUrlModal,
        iconUrlInput
      );

    }


    if (
      action ===
      "reset-icon"
    ) {

      resetIconOverride(
        key
      );

    }

  }
);


blankMenu.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        "button[data-action='add-shortcut']"
      );


    if (!button) {

      return;

    }


    shortcutNameInput.value =
      "";


    shortcutUrlInput.value =
      "";


    addFormError.textContent =
      "";


    openModal(
      addModal,
      shortcutNameInput
    );

  }
);


iconFileInput.addEventListener(
  "change",
  async () => {

    const file =
      iconFileInput.files[0];


    const key =
      pendingIconKey;


    if (
      !file
      ||
      !key
    ) {

      return;

    }


    try {

      const dataUrl =
        await readLocalIcon(
          file
        );


      if (
        applyIconOverride(
          key,
          dataUrl
        )
      ) {

        showToast(
          "本地图标已保存"
        );

      }

    }

    catch (error) {

      showToast(
        error.message
        ||
        "图标处理失败"
      );

    }


    finally {

      pendingIconKey =
        "";


      iconFileInput.value =
        "";

    }

  }
);


iconUrlForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    iconUrlFormError.textContent =
      "";


    try {

      const key =
        pendingIconKey;


      if (!key) {

        throw new Error(
          "没有找到要修改的快捷方式"
        );

      }


      const url =
        normaliseRemoteIconUrl(
          iconUrlInput.value
        );


      await verifyRemoteIcon(
        url
      );


      if (
        applyIconOverride(
          key,
          url
        )
      ) {

        closeModal(
          iconUrlModal
        );


        pendingIconKey =
          "";


        showToast(
          "图标链接已保存"
        );

      }

    }

    catch (error) {

      iconUrlFormError.textContent =
        error.message
        ||
        "图标链接不可用";

    }

  }
);


addForm.addEventListener(
  "submit",
  event => {

    event.preventDefault();


    addFormError.textContent =
      "";


    try {

      const group =
        groups.find(
          item =>
            item.id ===
            currentId
        );


      if (!group) {

        throw new Error(
          "没有找到当前分类"
        );

      }


      if (
        group.items.length >=
        12
      ) {

        throw new Error(
          "当前分类已满，最多可放 12 个快捷方式"
        );

      }


      const label =
        shortcutNameInput.value
          .trim();


      if (!label) {

        throw new Error(
          "请填写名称"
        );

      }


      const url =
        normaliseShortcutUrl(
          shortcutUrlInput.value
        );


      const key =
        `custom-${Date.now()}-${Math.random()
          .toString(36)
          .slice(2, 7)}`;


      const entry = {

        key,
        label,
        url,
        groupId:
          group.id

      };


      customSites.push(
        entry
      );


      if (!saveCustomSites()) {

        customSites.pop();


        throw new Error(
          "保存失败：本地存储空间不足"
        );

      }


      sites[key] = {

        label,
        url,
        icon: ""

      };


      group.items.push(
        key
      );


      closeModal(
        addModal
      );


      refreshShortcutGroups();


      showToast(
        `已添加到「${group.label}」`
      );

    }

    catch (error) {

      addFormError.textContent =
        error.message
        ||
        "无法添加快捷方式";

    }

  }
);


document.addEventListener(
  "pointerdown",
  event => {

    if (
      !event.target.closest(
        ".context-menu"
      )
    ) {

      hideContextMenus();

    }

  }
);


document
  .querySelectorAll(
    "[data-close-modal]"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          const modal =
            button.closest(
              ".modal-overlay"
            );


          if (modal) {

            closeModal(
              modal
            );

          }

        }
      );

    }
  );


[addModal, iconUrlModal]
  .forEach(
    modal => {

      modal.addEventListener(
        "pointerdown",
        event => {

          if (
            event.target ===
            modal
          ) {

            closeModal(
              modal
            );

          }

        }
      );

    }
  );


/* ========================================
   鼠标滚轮

   滚得越快 / 越远，
   一次可切越多组。

   完全取消之前的锁定等待。
   ======================================== */

let wheelAccumulator =
  0;


let resetTimer =
  null;


/*
   越小越灵敏。

   普通鼠标滚一格一般约 100px，
   所以 65 会比较跟手。
*/

const WHEEL_THRESHOLD =
  65;


/*
   一次极大的滚动事件
   最多跨 6 个组。
*/

const MAX_STEPS =
  6;


function normaliseWheel(
  event
) {

  let delta =
    event.deltaY;


  /*
     deltaMode:
     0 = pixel
     1 = line
     2 = page
  */

  if (
    event.deltaMode === 1
  ) {

    delta *= 16;

  }


  else if (
    event.deltaMode === 2
  ) {

    delta *= 300;

  }


  return delta;

}


document.addEventListener(

  "wheel",

  event => {

    event.preventDefault();


    if (
      !addModal.hidden
      ||
      !iconUrlModal.hidden
    ) {

      return;

    }


    wheelAccumulator +=
      normaliseWheel(
        event
      );


    let steps =
      Math.trunc(
        wheelAccumulator
        /
        WHEEL_THRESHOLD
      );


    if (!steps) {

      clearTimeout(
        resetTimer
      );


      resetTimer =
        setTimeout(
          () => {

            wheelAccumulator =
              0;

          },
          90
        );


      return;

    }


    steps =
      Math.max(
        -MAX_STEPS,
        Math.min(
          MAX_STEPS,
          steps
        )
      );


    wheelAccumulator -=
      steps
      *
      WHEEL_THRESHOLD;


    moveGroups(
      steps
    );


    clearTimeout(
      resetTimer
    );


    resetTimer =
      setTimeout(
        () => {

          wheelAccumulator =
            0;

        },
        90
      );

  },

  {
    passive: false
  }

);


/* ========================================
   上下方向键
   ======================================== */

document.addEventListener(

  "keydown",

  event => {

    if (
      event.key ===
      "Escape"
    ) {

      hideContextMenus();


      closeModal(
        addModal
      );


      closeModal(
        iconUrlModal
      );


      pendingIconKey =
        "";


      return;

    }


    if (
      !addModal.hidden
      ||
      !iconUrlModal.hidden
      ||
      /^(INPUT|TEXTAREA)$/.test(
        document.activeElement.tagName
      )
    ) {

      return;

    }

    if (
      event.key ===
      "ArrowDown"
    ) {

      moveGroups(1);

    }


    if (
      event.key ===
      "ArrowUp"
    ) {

      moveGroups(-1);

    }

  }

);


/* ========================================
   初始化
   ======================================== */

buildSidebar();

buildAllGroups();


const initial =
  groupElements.get(
    currentId
  );


if (initial) {

  initial.classList.add(
    "active"
  );

}


updateNav();

</script>

</html>
