<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VPS Widget</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: white;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    a.widget-link {
      display: block;
      width: 100%;
      height: 100%;
      text-decoration: none;
      color: inherit;
    }

    .card {
      width: 100%;
      height: 100%;
      padding: 20px 22px;
      border-radius: 22px;
      background: rgba(18, 22, 30, 0.62);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: transform 0.18s ease, background 0.18s ease;
    }

    a.widget-link:hover .card {
      transform: translateY(-1px);
      background: rgba(22, 28, 38, 0.72);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .server-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .region {
      font-size: 16px;
      line-height: 1;
    }

    .server-name {
      font-size: 17px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #63e6a5;
      box-shadow: 0 0 12px rgba(99, 230, 165, 0.9);
      flex: 0 0 auto;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px 18px;
    }

    .stat .label {
      font-size: 10px;
      opacity: 0.55;
      margin-bottom: 4px;
      letter-spacing: 0.3px;
    }

    .stat .value {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
    }

    .traffic-block {
      margin-top: 2px;
    }

    .traffic-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
    }

    .traffic-top .label {
      font-size: 10px;
      opacity: 0.55;
      letter-spacing: 0.3px;
    }

    .traffic-value {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .bar {
      height: 6px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.12);
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: rgba(255, 255, 255, 0.88);
      transition: width 0.5s ease;
    }

    .footer {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 10px;
      opacity: 0.5;
    }

    .footer-left,
    .footer-right {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .muted {
      opacity: 0.68;
    }

    .error {
      margin-top: auto;
      font-size: 12px;
      line-height: 1.5;
      color: #ffd4d4;
      opacity: 0.92;
    }
  </style>
</head>

<body>
  <a
    class="widget-link"
    href="https://38-207-167-188.sslip.io:8444/"
    target="_blank"
    rel="noopener noreferrer"
    title="打开完整监控页面"
  >
    <div class="card">
      <div class="header">
        <div class="server-wrap">
          <div class="region">🇺🇸</div>
          <div class="server-name" id="serverName">US-VMISS-9929</div>
        </div>

        <div class="status">
          <div class="dot" id="statusDot"></div>
          <span id="statusText">ONLINE</span>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="label">CPU</div>
          <div class="value" id="cpu">--</div>
        </div>

        <div class="stat">
          <div class="label">RAM</div>
          <div class="value" id="ram">--</div>
        </div>

        <div class="stat">
          <div class="label">UP</div>
          <div class="value" id="up">--</div>
        </div>

        <div class="stat">
          <div class="label">DOWN</div>
          <div class="value" id="down">--</div>
        </div>
      </div>

      <div class="traffic-block">
        <div class="traffic-top">
          <div class="label">MONTHLY TRAFFIC</div>
          <div class="traffic-value" id="trafficText">-- / 500 GB</div>
        </div>

        <div class="bar">
          <div class="bar-fill" id="trafficBar"></div>
        </div>
      </div>

      <div class="footer">
        <div class="footer-left" id="footerLeft">Click to open Komari</div>
        <div class="footer-right" id="updated">Updated --:--:--</div>
      </div>

      <div class="error" id="errorBox" style="display:none;"></div>
    </div>
  </a>

  <script>
    const RECENT_API =
      "https://38-207-167-188.sslip.io:8444/api/recent/312e359a-52d7-4725-98d1-593182f062e4";

    const NODES_API =
      "https://38-207-167-188.sslip.io:8444/api/nodes";

    let trafficLimitBytes = 536870912000; // 默认 500 GB
    let expireText = "";

    function bytesToGB(bytes) {
      return bytes / 1024 / 1024 / 1024;
    }

    function formatPercent(num) {
      return Number(num).toFixed(1) + "%";
    }

    function formatSpeed(bytesPerSecond) {
      if (bytesPerSecond >= 1024 * 1024) {
        return (bytesPerSecond / 1024 / 1024).toFixed(2) + " MB/s";
      }
      if (bytesPerSecond >= 1024) {
        return (bytesPerSecond / 1024).toFixed(2) + " KB/s";
      }
      return bytesPerSecond.toFixed(0) + " B/s";
    }

    function formatTime(isoString) {
      const d = new Date(isoString);
      return d.toLocaleTimeString("zh-CN", { hour12: false });
    }

    function setStatus(isOnline) {
      const statusText = document.getElementById("statusText");
      const statusDot = document.getElementById("statusDot");

      if (isOnline) {
        statusText.textContent = "ONLINE";
        statusDot.style.background = "#63e6a5";
        statusDot.style.boxShadow = "0 0 12px rgba(99, 230, 165, 0.9)";
      } else {
        statusText.textContent = "OFFLINE";
        statusDot.style.background = "#ff6b6b";
        statusDot.style.boxShadow = "0 0 12px rgba(255, 107, 107, 0.9)";
      }
    }

    function showError(message) {
      const box = document.getElementById("errorBox");
      box.style.display = "block";
      box.textContent = message;
    }

    function clearError() {
      const box = document.getElementById("errorBox");
      box.style.display = "none";
      box.textContent = "";
    }

    async function fetchNodeMeta() {
      try {
        const res = await fetch(NODES_API, { cache: "no-store" });
        const json = await res.json();

        if (json.status === "success" && Array.isArray(json.data) && json.data.length) {
          const node = json.data[0];
          if (node.name) {
            document.getElementById("serverName").textContent = node.name;
          }
          if (node.traffic_limit) {
            trafficLimitBytes = node.traffic_limit;
          }
          if (node.expired_at) {
            const exp = new Date(node.expired_at);
            expireText = "Exp " + exp.toLocaleDateString("zh-CN");
          }
        }
      } catch (err) {
        console.warn("fetchNodeMeta failed:", err);
      }
    }

    async function fetchRecent() {
      try {
        clearError();

        const res = await fetch(RECENT_API, { cache: "no-store" });
        const json = await res.json();

        if (json.status !== "success" || !Array.isArray(json.data) || !json.data.length) {
          throw new Error("No data returned from API");
        }

        const latest = json.data[json.data.length - 1];

        const cpuUsage = latest.cpu?.usage ?? 0;
        const ramUsed = latest.ram?.used ?? 0;
        const ramTotal = latest.ram?.total ?? 1;
        const ramPercent = (ramUsed / ramTotal) * 100;

        const upSpeed = latest.network?.up ?? 0;
        const downSpeed = latest.network?.down ?? 0;
        const totalUp = latest.network?.totalUp ?? 0;
        const totalDown = latest.network?.totalDown ?? 0;
        const totalTraffic = totalUp + totalDown;

        const updatedAt = latest.updated_at || new Date().toISOString();

        document.getElementById("cpu").textContent = formatPercent(cpuUsage);
        document.getElementById("ram").textContent = formatPercent(ramPercent);
        document.getElementById("up").textContent = formatSpeed(upSpeed);
        document.getElementById("down").textContent = formatSpeed(downSpeed);

        const usedGB = bytesToGB(totalTraffic);
        const limitGB = bytesToGB(trafficLimitBytes);
        const percent = Math.min((totalTraffic / trafficLimitBytes) * 100, 100);

        document.getElementById("trafficText").textContent =
          usedGB.toFixed(1) + " / " + limitGB.toFixed(0) + " GB";
        document.getElementById("trafficBar").style.width = percent + "%";

        document.getElementById("updated").textContent =
          "Updated " + formatTime(updatedAt);

        document.getElementById("footerLeft").textContent =
          expireText || "Click to open Komari";

        setStatus(true);
      } catch (err) {
        console.error(err);
        setStatus(false);
        showError("无法读取 Komari 数据，请检查接口或跨域设置。");
      }
    }

    async function init() {
      await fetchNodeMeta();
      await fetchRecent();
      setInterval(fetchRecent, 15000);
    }

    init();
  </script>
</body>
</html>
