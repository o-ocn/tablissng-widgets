<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPS Monitor</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
  color: #fff;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

.card {
  width: 100%;
  height: 100%;
  padding: 16px 18px 14px;
  border-radius: 20px;

  background: rgba(245, 245, 245, 0.10);

  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  border: 1px solid rgba(255, 255, 255, 0.20);

  box-shadow:
    0 8px 24px rgba(0, 0, 0, 0.10),
    inset 0 1px 0 rgba(255, 255, 255, 0.04);

  cursor: pointer;

  display: flex;
  flex-direction: column;

  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35);

  transition:
    background 0.18s ease,
    border-color 0.18s ease;
}

.card:hover {
  background: rgba(245, 245, 245, 0.14);
  border-color: rgba(255, 255, 255, 0.28);
}


/* =========================
   顶部
   ========================= */

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.server {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 7px;
}

.flag {
  font-size: 14px;
}

.server-name {
  font-size: 15px;
  font-weight: 650;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.status {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 6px;

  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.5px;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;

  background: #f3c969;
  box-shadow: 0 0 8px rgba(243, 201, 105, 0.8);
}


/* =========================
   CPU / RAM / UP / DOWN
   ========================= */

.metrics {
  margin-top: 14px;

  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.metric {
  min-width: 0;
}

.label {
  margin-bottom: 4px;

  color: rgba(255, 255, 255, 0.55);

  font-size: 8px;
  font-weight: 500;
  letter-spacing: 0.5px;
}

.value {
  color: rgba(255, 255, 255, 0.95);

  font-size: 13px;
  font-weight: 650;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.up::before {
  content: "↑ ";
  color: #8bb9ff;
}

.down::before {
  content: "↓ ";
  color: #75e4aa;
}


/* =========================
   流量
   ========================= */

.traffic {
  margin-top: 14px;
}

.traffic-head {
  margin-bottom: 7px;

  display: flex;
  justify-content: space-between;
  align-items: center;
}

.traffic-title {
  color: rgba(255, 255, 255, 0.55);

  font-size: 8px;
  letter-spacing: 0.5px;
}

.traffic-value {
  font-size: 10px;
  font-weight: 650;
}


/* 点断式流量条 */

.bar {
  width: 100%;
  height: 6px;

  display: flex;
  align-items: center;
  gap: 3px;

  background: transparent;
}

.bar-segment {
  flex: 1;

  min-width: 0;
  height: 5px;

  border-radius: 2px;

  background: rgba(255, 255, 255, 0.13);

  transition:
    background 0.35s ease,
    opacity 0.35s ease;
}

.bar-segment.used {
  background: rgba(255, 255, 255, 0.82);

  box-shadow:
    0 0 3px rgba(255, 255, 255, 0.08);
}


/* =========================
   底部
   ========================= */

.footer {
  margin-top: auto;

  display: flex;
  justify-content: space-between;
  align-items: baseline;

  gap: 10px;
}


/* “到期”两个字保持原来的小字效果 */
.expire-label {
  color: rgba(255, 255, 255, 0.46);

  font-size: 8px;
  font-weight: 400;
}


/* 日期单独稍微放大 */
.expire-date {
  color: rgba(255, 255, 255, 0.68);

  font-size: 12px;
  font-weight: 600;
}


/* 更新时间继续放大 */
.updated-time {
  color: rgba(255, 255, 255, 0.68);

  font-size: 12px;
  font-weight: 600;

  white-space: nowrap;
}

</style>
</head>

<body>

<div
  class="card"
  id="card"
  title="打开完整 Komari 监控"
>

  <div class="header">

    <div class="server">

      <span class="flag">
        🇺🇸
      </span>

      <span
        class="server-name"
        id="serverName"
      >
        US-VMISS-9929
      </span>

    </div>

    <div class="status">

      <span
        class="status-dot"
        id="statusDot"
      ></span>

      <span id="statusText">
        CONNECTING
      </span>

    </div>

  </div>


  <div class="metrics">

    <div class="metric">

      <div class="label">
        CPU
      </div>

      <div
        class="value"
        id="cpu"
      >
        --
      </div>

    </div>


    <div class="metric">

      <div class="label">
        RAM
      </div>

      <div
        class="value"
        id="ram"
      >
        --
      </div>

    </div>


    <div class="metric">

      <div class="label">
        UP
      </div>

      <div
        class="value up"
        id="up"
      >
        --
      </div>

    </div>


    <div class="metric">

      <div class="label">
        DOWN
      </div>

      <div
        class="value down"
        id="down"
      >
        --
      </div>

    </div>

  </div>


  <div class="traffic">

    <div class="traffic-head">

      <span class="traffic-title">
        MONTHLY TRAFFIC
      </span>

      <span
        class="traffic-value"
        id="trafficText"
      >
        -- / 500 GB
      </span>

    </div>

    <div
      class="bar"
      id="trafficBar"
    ></div>

  </div>


  <div class="footer">

    <span>
      <span class="expire-label">到期</span>
      <span
        class="expire-date"
        id="expireDate"
      >
        --/--
      </span>
    </span>

    <span
      class="updated-time"
      id="updated"
    >
      --:--:--
    </span>

  </div>

</div>


<script>

const UUID =
  "312e359a-52d7-4725-98d1-593182f062e4";

const BASE =
  "https://38-207-167-188.sslip.io:8444";

const RECENT_API =
  `${BASE}/api/recent/${UUID}`;

const NODES_API =
  `${BASE}/api/nodes`;

let trafficLimit =
  536870912000;

const VPS_CACHE_KEY =
  "tabliss-vps-last-success-v1";

let cachedMeta =
  null;


const SEGMENT_COUNT = 28;


const $ = id =>
  document.getElementById(id);


/* =========================
   初始化点断式流量条
   ========================= */

function createTrafficSegments() {

  const bar =
    $("trafficBar");

  bar.innerHTML = "";

  for (
    let i = 0;
    i < SEGMENT_COUNT;
    i++
  ) {

    const segment =
      document.createElement("div");

    segment.className =
      "bar-segment";

    bar.appendChild(segment);
  }
}


/* 更新点断式流量条 */

function updateTrafficSegments(percent) {

  const segments =
    document.querySelectorAll(
      ".bar-segment"
    );

  const usedSegments =
    Math.round(
      SEGMENT_COUNT *
      percent /
      100
    );

  segments.forEach(
    (segment, index) => {

      segment.classList.toggle(
        "used",
        index < usedSegments
      );

    }
  );
}


/* =========================
   格式化
   ========================= */

function gb(bytes) {

  return (
    bytes /
    1024 /
    1024 /
    1024
  );

}


function pct(value) {

  return (
    Number(value)
      .toFixed(1)
    + "%"
  );

}


function speed(bytes) {

  if (
    bytes >=
    1024 * 1024
  ) {

    return (
      bytes /
      1024 /
      1024
    ).toFixed(2)
      + " MB/s";

  }


  if (
    bytes >=
    1024
  ) {

    return (
      bytes /
      1024
    ).toFixed(2)
      + " KB/s";

  }


  return (
    Math.round(bytes)
    + " B/s"
  );

}


function time(value) {

  return new Date(value)
    .toLocaleTimeString(
      "zh-CN",
      {
        hour12: false,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      }
    );

}


/* =========================
   在线状态
   ========================= */

function status(type) {

  const dot =
    $("statusDot");

  const text =
    $("statusText");


  if (
    type === "online"
  ) {

    text.textContent =
      "ONLINE";

    dot.style.background =
      "#66e3aa";

    dot.style.boxShadow =
      "0 0 8px rgba(102,227,170,.85)";

  }


  if (
    type === "stale"
  ) {

    text.textContent =
      "STALE";

    dot.style.background =
      "#f3c969";

    dot.style.boxShadow =
      "0 0 8px rgba(243,201,105,.80)";

  }


  if (
    type === "offline"
  ) {

    text.textContent =
      "OFFLINE";

    dot.style.background =
      "#ff7474";

    dot.style.boxShadow =
      "0 0 8px rgba(255,116,116,.80)";

  }

}


/* =========================
   上一次成功数据

   新标签页先显示本机缓存，
   网络请求完成后再静默更新。
   ========================= */

function applyMeta(node) {

  if (!node) {
    return;
  }


  cachedMeta = {

    name:
      node.name || "",

    traffic_limit:
      Number(node.traffic_limit) || 0,

    expired_at:
      node.expired_at || ""

  };


  if (cachedMeta.name) {

    $("serverName")
      .textContent =
      cachedMeta.name;

  }


  if (cachedMeta.traffic_limit) {

    trafficLimit =
      cachedMeta.traffic_limit;

  }


  if (cachedMeta.expired_at) {

    const d =
      new Date(
        cachedMeta.expired_at
      );


    $("expireDate")
      .textContent =
      `${
        d.getMonth() + 1
      }/${d.getDate()}`;

  }

}


function renderLatest(
  latest,
  cached = false
) {

  if (!latest) {
    return;
  }


  const ramPercent =
    (
      latest.ram.used /
      latest.ram.total
    ) *
    100;


  $("cpu").textContent =
    pct(latest.cpu.usage);


  $("ram").textContent =
    pct(ramPercent);


  $("up").textContent =
    speed(latest.network.up);


  $("down").textContent =
    speed(latest.network.down);


  const total =
    latest.network.totalUp
    +
    latest.network.totalDown;


  const usedGB =
    gb(total);


  const limitGB =
    gb(trafficLimit);


  $("trafficText").textContent =
    `${usedGB.toFixed(1)} / ${limitGB.toFixed(0)} GB`;


  updateTrafficSegments(
    Math.min(
      (total / trafficLimit) * 100,
      100
    )
  );


  const age =
    Date.now()
    -
    new Date(
      latest.updated_at
    ).getTime();


  status(
    cached
      ? "stale"
      : age < 90000
        ? "online"
        : "stale"
  );


  $("updated").textContent =
    time(latest.updated_at);

}


function restoreCachedSnapshot() {

  try {

    const saved =
      JSON.parse(
        localStorage.getItem(
          VPS_CACHE_KEY
        )
        ||
        "null"
      );


    if (!saved) {
      return;
    }


    applyMeta(saved.meta);
    renderLatest(saved.latest, true);

  }

  catch (error) {

    console.warn(
      "Unable to restore VPS cache",
      error
    );

  }

}


function saveCachedSnapshot(latest) {

  try {

    localStorage.setItem(
      VPS_CACHE_KEY,
      JSON.stringify({

        savedAt:
          Date.now(),

        meta:
          cachedMeta,

        latest

      })
    );

  }

  catch (error) {

    console.warn(
      "Unable to save VPS cache",
      error
    );

  }

}


/* =========================
   Fetch
   ========================= */

async function get(url) {

  const controller =
    new AbortController();


  const timer =
    setTimeout(
      () =>
        controller.abort(),
      6000
    );


  try {

    return await fetch(
      url,
      {
        cache: "no-store",
        signal:
          controller.signal
      }
    );

  }

  finally {

    clearTimeout(timer);

  }

}


/* =========================
   节点基础信息
   ========================= */

async function loadMeta() {

  try {

    const res =
      await get(
        NODES_API
      );


    const json =
      await res.json();


    const node =
      json.data?.find(
        item =>
          item.uuid === UUID
      );


    if (!node) {
      return;
    }


    applyMeta(node);

  }

  catch (e) {

    console.warn(e);

  }

}


/* =========================
   实时数据
   ========================= */

async function refresh() {

  try {

    const res =
      await get(
        RECENT_API
      );


    if (!res.ok) {

      throw new Error(
        `HTTP ${res.status}`
      );

    }


    const json =
      await res.json();


    if (
      !json.data?.length
    ) {

      throw new Error(
        "No monitoring data"
      );

    }


    const latest =
      json.data[
        json.data.length - 1
      ];


    renderLatest(latest);
    saveCachedSnapshot(latest);

  }

  catch (e) {

    console.error(e);


    status(
      "offline"
    );


    $("updated")
      .textContent =
      "读取失败";

  }

}


/* =========================
   点击打开 Komari
   ========================= */

$("card")
  .addEventListener(
    "click",
    () => {

      window.open(
        BASE + "/",
        "_blank",
        "noopener,noreferrer"
      );

    }
  );


/* =========================
   启动
   ========================= */

createTrafficSegments();

restoreCachedSnapshot();

refresh();

loadMeta();


if (
  "serviceWorker" in navigator
  &&
  location.protocol === "https:"
) {

  navigator.serviceWorker.register(
    "./sw.js",
    {
      scope: "./",
      updateViaCache: "none"
    }
  )
  .catch(error => {

    console.warn(
      "Unable to initialise persistent cache",
      error
    );

  });

}

setInterval(
  refresh,
  15000
);

</script>

</body>
</html>
